<div class="sec"><h3>1. תעודת זהות לפחמימות 🪪</h3>
<ul><li><b>מקור השם:</b> פחמן + מים.</li>
<li><b>ערך קלורי:</b> 4 קלוריות (קק"ל) לכל גרם.</li>
<li><b>איפה הן נאגרות?</b> פחמימות שאנחנו אוכלים ולא מנצלים מיד לאנרגיה נאגרות בכבד ובשרירים בצורה של "גליקוגן", והרוב הגדול הופך לשומן ונאגר ברקמת השומן.</li></ul></div>

<div class="sec"><h3>2. תפקידי הפחמימות בגוף 🔋</h3>
<ul><li><b>הדלק של הגוף:</b> התפקיד המרכזי ביותר הוא לספק אנרגיה (דלק) לכל התאים החיים.</li>
<li><b>מרכיבות את ה-DNA:</b> סוגים מסוימים של סוכרים (ריבוז ודיאוקסיריבוז) בונים את החומר התורשתי שלנו.</li>
<li><b>תעודת זהות תאית:</b> פחמימות נמצאות על קרומי התאים ועוזרות למערכת החיסון לזהות אילו תאים שייכים לגוף ואילו זרים.</li>
<li><b>ניקוי מערכת העיכול:</b> הסיבים התזונתיים (שהם סוג של פחמימה) מנקים את המעיים.</li></ul></div>

<div class="sec"><h3>3. מאיפה הפחמימות מגיעות ואיך מפיקים מהן אנרגיה? ☀️</h3>
<ul><li><b>פוטוסינתזה בצמחים:</b> מקור הפחמימות הוא בצומח. הצמח לוקח מים, פחמן דו-חמצני ואור שמש, ויוצר גלוקוז (סוכר) וחמצן.</li>
<li><b>נשימה תאית בגופנו:</b> כשאנחנו אוכלים פחמימות, התאים שלנו עושים את התהליך ההפוך. בעזרת חמצן, התא מפרק את הגלוקוז ומפיק ממנו מולקולות בשם <span class="term">ATP</span> (אלו הם "מטבעות האנרגיה" של הגוף שמשמשים אותנו לכל פעולה).</li></ul></div>

<div class="sec"><h3>4. מיון הפחמימות: פשוטות מול מורכבות 🍭🥔</h3>
<p><b>פחמימות פשוטות (סוכרים):</b></p>
<ul><li><b>חד-סוכרים (יחידה אחת):</b> גלוקוז (סוכר הדם), פרוקטוז (סוכר פירות) וגלקטוז (במוצרי חלב).</li>
<li><b>דו-סוכרים (שתי יחידות):</b> סוכרוז (הסוכר הלבן הרגיל), לקטוז (סוכר החלב) ומלטוז.</li>
<li><b>מאפיינים:</b> מתוקות, נמסות במים, מתעכלות ונספגות במהירות לדם. הן מספקות אנרגיה מהירה אבל נחשבות ל"קלוריות ריקות" כי אין בהן ערך תזונתי נוסף. צריכת יתר שלהן מעמיסה על הכבד וגורמת להשמנה.</li></ul>
<p><b>פחמימות מורכבות (רב-סוכרים):</b></p>
<ul><li>בנויות משרשראות ארוכות של המון יחידות סוכר מחוברות.</li>
<li><b>חומרי תשמורת:</b> עמילן (חומר התשמורת של הצמחים) וגליקוגן (חומר התשמורת בגוף בעלי חיים והאדם).</li>
<li><b>מאפיינים:</b> טעמן תפל (לא מתוק), לא נמסות במים, מתעכלות ונספגות לאט ולכן נותנות תחושת שובע ואנרגיה לטווח ארוך.</li></ul></div>

<div class="sec"><h3>5. סיבים תזונתיים - המנקים של הגוף 🌾</h3>
<p>סיבים הם פחמימות מורכבות שמקורן בצומח, אך לגוף שלנו אין את האנזימים לפרק אותם, ולכן אין בהם קלוריות.</p>
<ul><li><b>סיבים לא מסיסים במים</b> (כמו סובין ותאית): מתפקדים כמו מטאטא במעיים. הם מונעים עצירות, מזרזים את פעילות מערכת העיכול ומקטינים סיכון לסרטן המעי הגס.</li>
<li><b>סיבים מסיסים במים</b> (כמו פקטין): סופחים אליהם נוזלים והופכים לג'ל דביק. הם סופחים אליהם כולסטרול וסוכרים ומוציאים אותם מהגוף, ובכך עוזרים למנוע מחלות לב וסוכרת.</li></ul>
<div class="tip"><span>יותר מדי סיבים עלולים להפריע לספיגת מינרלים כמו ברזל וסידן.</span></div></div>

<div class="sec"><h3>6. תחנות העיכול של הפחמימות 👄</h3>
<ul><li>תהליך פירוק הפחמימות מתחיל כבר בפה, בעזרת אנזים בשם "עמילאז" שמפרק את העמילן.</li>
<li>בקיבה אין עיכול כימי של פחמימות.</li>
<li>עיקר הפירוק והספיגה קורים במעי הדק. שם הפחמימות מתפרקות לחד-סוכרים, נספגות לזרם הדם ועוברות לכבד ולתאים לשם ייצור אנרגיה.</li></ul></div>

<div class="sec"><h3>7. המדד הגליקמי 📈</h3>
<p>מדד שבודק כמה מהר פחמימה מעלה את רמת הגלוקוז (הסוכר) בדם.</p>
<ul><li><b>מדד גליקמי גבוה:</b> הסוכר קופץ מהר ובתגובה הלבלב מפריש המון אינסולין. הסוכר צונח בחזרה מהר ואנחנו שוב מרגישים רעבים. מצב זה תורם להשמנה ולא מומלץ לחולי סוכרת.</li>
<li><b>מדד גליקמי נמוך:</b> הסוכר עולה בהדרגה ולאט, מה שנותן אנרגיה ושובע לאורך זמן (מאוד מומלץ!).</li></ul>
<div class="tip"><span>חימום ובישול של עמילנים (כמו פירה תפוחי אדמה) גורם להם להתפרק מהר יותר, ולכן מעלה להם את המדד הגליקמי.</span></div></div>

<div class="sec"><h3>8. מחלות הקשורות לפחמימות: סוכרת 🩸</h3>
<p>סוכרת היא מחלה מטבולית שבה יש ריכוז גבוה של גלוקוז בדם כי הגוף מתקשה להכניס אותו לתאים.</p>
<ul><li><b>סוכרת סוג 1 (נעורים):</b> מחלה שבה מערכת החיסון "מתבלבלת" ותוקפת והורסת את התאים בלבלב שמייצרים את הורמון האינסולין. החולה חייב לקבל אינסולין ממקור חיצוני (זריקות).</li>
<li><b>סוכרת סוג 2:</b> קשורה לרוב להשמנה. הלבלב מייצר אינסולין, אבל התאים בגוף מפתחים "תנגודת" ולא מגיבים אליו. כתוצאה מכך הגלוקוז נשאר בדם ולא נכנס לתאים.</li></ul></div>
`},
{id:'protein',emoji:'🥚',title:'חלבונים - אבני הבניין של הגוף',html:`
<div class="sec"><h3>1. תעודת זהות לחלבונים 🪪</h3>
<ul><li><b>מה זה חלבון?</b> שרשרת ארוכה שבנויה מיחידות קטנות הנקראות <span class="term">חומצות אמינו</span> (כמו חרוזים שמרכיבים שרשרת).</li>
<li><b>ערך קלורי:</b> 4 קלוריות לכל גרם של חלבון.</li>
<li><b>כמה חומצות אמינו יש?</b> החלבונים בגוף שלנו מורכבים מ-20 סוגים של חומצות אמינו.</li>
<li><b>חומצות אמינו חיוניות (9 סוגים):</b> חומצות שהגוף שלנו לא יודע לייצר בעצמו, ולכן חובה לאכול אותן במזון.</li>
<li><b>חומצות אמינו לא חיוניות (11 סוגים):</b> חומצות שהגוף יודע לייצר בעצמו.</li></ul></div>

<div class="sec"><h3>2. מה תפקיד החלבונים בגוף? 🏗️</h3>
<p>החלבונים מתחלקים לשתי קבוצות עיקריות:</p>
<ul><li><b>חלבונים מבניים (בונים את הגוף):</b> בונים את כל התאים והרקמות בגוף. למשל: "קולגן" שבונה את העור והעצמות, או "קרטין" שבונה את השיער והציפורניים.</li>
<li><b>חלבונים תפקודיים (עושים פעולות):</b> חלבונים שמבצעים משימות. למשל: אנזימים (מזרזים תהליכים כמו עיכול), נוגדנים (שומרים עלינו במערכת החיסון), והורמונים (כמו אינסולין).</li>
<li><b>מקור אנרגיה לשעת חירום:</b> אם הגוף לא מקבל מספיק פחמימות, הוא יתחיל לפרק שרירים (חלבונים) כדי לקבל אנרגיה. זה לא בריא! פירוק חלבונים לאנרגיה מעמיס על הכליות.</li></ul></div>

<div class="sec"><h3>3. איך נוצרים כל כך הרבה חלבונים שונים? 🔠</h3>
<p>יש בגוף שלנו כ-100,000 סוגים שונים של חלבונים. ההבדל בין חלבון אחד לאחר נובע מ-3 דברים (כמו שמילים שונות מורכבות מאותיות שונות):</p>
<ul><li>המספר של חומצות האמינו בשרשרת.</li>
<li>הסוג של חומצות האמינו.</li>
<li>הסדר שבו הן מחוברות.</li></ul>
<p>הוראות ההפעלה לבניית החלבונים נמצאות ב-DNA שלנו, שבתוך גרעין התא.</p></div>

<div class="sec"><h3>4. מאיפה מקבלים חלבון? (איכות החלבון) 🥩🌱</h3>
<ul><li><b>חלבון מן החי = "חלבון מלא":</b> נמצא בבשר, דגים, עוף, ביצים ומוצרי חלב. הוא נקרא מלא כי יש בו את כל חומצות האמינו החיוניות. (לביצה יש "ערך ביולוגי" 100 - כלומר זה החלבון המושלם לגוף).</li>
<li><b>חלבון מן הצומח = "חלבון חסר":</b> נמצא בצמחים (כמו עדשים וחיטה). הוא נקרא חסר כי לרוב חסרה בו חומצת אמינו חיונית אחת או יותר (חומצה זו נקראת "חומצת אמינו מגבילה").</li>
<li><b>השלמה הדדית 🤝:</b> טבעונים שלא אוכלים מהחי, יכולים לשלב שני סוגים של צמחים (דגן + קטנית) שביחד משלימים אחד את השני ונותנים לגוף חלבון מלא. למשל: אורז עם עדשים (מג'דרה), או פיתה עם חומוס/פלאפל.</li></ul></div>

<div class="sec"><h3>5. עיכול חלבונים ו"דנטורציה" 🍳</h3>
<p><b>תחנות העיכול:</b> פירוק החלבונים מתחיל בקיבה (בעזרת החומצה ואנזים בשם "פפסין") ומסתיים במעי הדק. החלבונים מתפרקים לחומצות אמינו ונספגים לדם.</p>
<div class="bagrut"><span>דנטורציה (הרס המבנה המרחבי): כשמחממים חלבון (כמו בטיגון חביתה) או כשמוסיפים לו חומצה (כמו חלב שמחמיץ), החלבון מאבד את הצורה הטבעית שלו ולא יכול לבצע את תפקידו. למרות שהצורה נהרסה, הערך התזונתי לא נפגע והגוף עדיין יכול לנצל את חומצות האמינו!</span></div></div>

<div class="sec"><h3>6. מחלות קשורות לחלבונים: צליאק (דגנת) 🌾</h3>
<ul><li>צליאק היא מחלה שבה יש רגישות לחלבון בשם גלוטן (שנמצא בחיטה, שעורה ושיפון).</li>
<li>כשחולה צליאק אוכל גלוטן, מערכת החיסון שלו תוקפת בטעות את המעי הדק ופוגעת בספיגת המזון.</li>
<li>הטיפול היחיד הוא הימנעות מוחלטת מאכילת מאכלים עם גלוטן.</li></ul></div>

<div class="sec"><h3>מדד איכות החלבון: ערך ביולוגי 💯</h3>
<ul><li><b>מה זה ערך ביולוגי?</b> זהו מדד (כמו ציון בטווח של 0 עד 100) שמדרג ובודק את האיכות של החלבון במזון שאנחנו אוכלים.</li>
<li><b>איך קובעים את הציון?</b> הציון נקבע לפי סוג וכמות חומצות האמינו החיוניות שמרכיבות את אותו חלבון.</li>
<li><b>חלבון ביצה (התלמיד המצטיין) 🥚:</b> מקבל את הציון המושלם - ערך ביולוגי 100! הוא נחשב לחלבון המאוזן והטוב ביותר לצורכי הגוף, ושאר החלבונים במזונות אחרים מקבלים את הציונים שלהם ביחס לביצה.</li>
<li><b>ציונים נוספים לדוגמה:</b> לדג יש ערך ביולוגי של 70, לחלב פרה ציון 60, ולקטניות (שמקורן בצומח) יש ערך נמוך שנע בין 34 ל-44 בקירוב.</li></ul>
<div class="bagrut"><span>חלבון מן החי תמיד ייחשב לבעל ערך ביולוגי גבוה יותר בהשוואה לחלבון מן הצומח.</span></div></div>

{id:'fat',emoji:'🥑',title:'שומנים (ליפידים) - מאגר האנרגיה והבידוד',html:`
<div class="sec"><h3>1. תעודת זהות לשומנים 🪪</h3>
<ul><li><b>שם מדעי:</b> קבוצת השומנים והשמנים נקראת <span class="term">ליפידים</span>. התכונה המשותפת לכולם היא שהם אינם מסיסים במים (הידרופוביים).</li>
<li><b>ערך קלורי:</b> 9 קלוריות לכל גרם שומן (הכי הרבה מבין אבות המזון).</li>
<li><b>שמן מול שומן:</b> שמן הוא נוזל בטמפרטורת החדר (לרוב מהצומח), ושומן הוא מוצק בטמפרטורת החדר (לרוב מהחי).</li></ul></div>

<div class="sec"><h3>2. תפקידי השומנים בגוף 🛡️</h3>
<ul><li><b>מקור אנרגיה:</b> משמשים כמאגר אנרגיה לשעת חירום (נאגרים ברקמת השומן).</li>
<li><b>בניית תאים:</b> מרכיבים את קרומי התאים בכל הגוף.</li>
<li><b>הגנה ובידוד:</b> מגנים על איברים פנימיים מפני מכות, ומבודדים את הגוף מקור.</li>
<li><b>ספיגת ויטמינים:</b> עוזרים לגוף לספוג ויטמינים שמסיסים בשומן (A, D, E, K).</li></ul></div>

<div class="sec"><h3>3. אילו סוגי שומנים יש בגוף? (3 קבוצות) 🔬</h3>
<ul><li><b>טריגליצרידים:</b> זוהי הצורה שבה השומן נאגר בגופנו ובמזון. מורכבים מראש של "גליצרול" שאליו מחוברות 3 "חומצות שומן".</li>
<li><b>פוספוליפידים:</b> בונים את קרומי התאים. יש להם "ראש" שאוהב מים (הידרופילי) ו"זנב" ששונא מים (הידרופובי), מה שמאפשר לתא לשלוט במה שנכנס ויוצא ממנו.</li>
<li><b>כולסטרול:</b> חומר שומני שמיוצר רק בבעלי חיים (אין כולסטרול בצמחים!). הוא חיוני לבניית הורמונים (כמו טסטוסטרון ואסטרוגן) ולוויטמין D.
<ul><li><b>כולסטרול רע (LDL):</b> מוביל כולסטרול לתאים, אך עלול לשקוע ולסתום את כלי הדם (טרשת עורקים).</li>
<li><b>כולסטרול טוב (HDL):</b> מפנה את הכולסטרול העודף מהתאים בחזרה לכבד.</li></ul></li></ul></div>

<div class="sec"><h3>4. חומצות שומן - אבני הבניין של השומן 🧱</h3>
<ul><li><b>חומצות שומן רוויות:</b> "מלאות" באטומי מימן. הן מוצקות (שומן), נמצאות בעיקר בבשר, חמאה וגבינות שמנות. אכילה מרובה שלהן לא מומלצת כי הן סותמות את כלי הדם.</li>
<li><b>חומצות שומן בלתי רוויות:</b> "חסר" להן מימן ויש בהן קשרים כפולים שיוצרים "כיפוף". הן נוזליות (שמן), נמצאות בצמחים (שמן זית, אבוקדו) ובדגים. נחשבות לשומן בריא וידידותי ללב.</li></ul></div>

<div class="sec"><h3>5. שומן טראנס - הרשע של תעשיית המזון 🍟</h3>
<ul><li><b>איך הוא נוצר?</b> בתהליך תעשייתי (הידרוגנציה) שבו לוקחים שמן צמחי נוזלי והופכים אותו למוצק (כמו מרגרינה).</li>
<li><b>למה הוא מסוכן?</b> הגוף לא יודע איך לפרק אותו. הוא מעלה את הכולסטרול הרע (LDL) ומוריד את הטוב (HDL). נמצא במאפים, בצק עלים, חטיפים ואוכל מטוגן. מומלץ להימנע ממנו לחלוטין!</li></ul></div>

<div class="sec"><h3>6. איך אנחנו מעכלים שומן? 🧼</h3>
<p>בגלל ששומן ומים לא מתערבבים, מערכת העיכול נעזרת במיץ המרה (שמיוצר בכבד). מיץ המרה פועל כמו סבון (דטרגנט) - הוא מפרק את השומן לטיפות מיקרוסקופיות (תחליב), וכך האנזימים יכולים לגשת אליו, לפרק אותו, ולעזור לו להיספג בדם.</p></div>

{id:'vit',emoji:'🍊',title:'ויטמינים - שומרי הראש של הגוף',html:`
<div class="sec"><h3>1. תעודת זהות לוויטמינים 🪪</h3>
<ul><li><b>מה הם?</b> חומרים אורגניים חסרי קלוריות. הגוף זקוק להם בכמויות זעירות (קטנות מאוד) כדי לגדול, לתפקד ולהפיק אנרגיה.</li>
<li><b>מאיפה מקבלים אותם?</b> הגוף שלנו לא יודע לייצר אותם בעצמו, ולכן חובה לקבל אותם מבחוץ דרך המזון.</li>
<li><b>היוצאים מן הכלל:</b> ויטמין D (נוצר בעור בעזרת השמש) וויטמינים שמיוצרים על ידי החיידקים הטובים במעיים שלנו (כמו ויטמין K וכמה מוויטמיני B).</li></ul></div>

<div class="sec"><h3>2. שתי משפחות של ויטמינים 💧🥑</h3>
<p>הוויטמינים מתחלקים ל-2 קבוצות לפי החומר שבו הם נמסים:</p>
<ul><li><b>ויטמינים מסיסים בשמן (A, D, E, K):</b> נספגים טוב יותר כשאוכלים אותם עם שומן. הם נאגרים בגוף (בעיקר בכבד וברקמות השומן) לימי מחסור. לכן, צריכה מוגזמת שלהם מסוכנת ועלולה לגרום להרעלה.</li>
<li><b>ויטמינים מסיסים במים (C וקבוצת B):</b> נעים בדם בקלות. הם לא נאגרים בגוף (חוץ מ-B12), והעודפים שלהם יוצאים החוצה בשתן. לכן, חובה לאכול אותם כל יום וקשה מאוד להגיע להרעלה מהם. הם גם רגישים ונהרסים בבישול ובחום.</li></ul></div>

<div class="sec"><h3>3. הכוכבים המסיסים בשומן (A, D, E, K) 🧈</h3>
<ul><li><b>👁️ ויטמין A (רטינול):</b> אחראי על הראייה בחושך, גדילה ומערכת החיסון. חוסר גורם לעיוורון לילה. נמצא בחי (כבד, ביצים) ובצומח בצורה של בטא-קרוטן (צבע כתום/צהוב כמו בגזר) שהגוף הופך לוויטמין A.</li>
<li><b>☀️ ויטמין D:</b> "ויטמין השמש". מכניס את הסידן לעצמות. חוסר גורם למחלת הרככת בילדים (עצמות חלשות ומתעקמות) ואוסטאופורוזיס (בריחת סידן) במבוגרים.</li>
<li><b>🛡️ ויטמין E:</b> נוגד חמצון חזק. שומר על קרומי התאים שלנו מפני נזקים של "רדיקלים חופשיים" (חומרים שתוקפים והורסים תאים בגוף).</li>
<li><b>🩸 ויטמין K:</b> אחראי על קרישת הדם (עוצר דימומים פנימיים). נוצר בעיקר על ידי חיידקי המעי שלנו, ונמצא גם בעלים ירוקים.</li></ul></div>

<div class="sec"><h3>4. הכוכבים המסיסים במים (קבוצת B ו-C) 🚰</h3>
<ul><li><b>🍊 ויטמין C:</b> נוגד חמצון ששומר על מערכת החיסון, בונה את הקולגן שבעור ועוזר לגוף לספוג ברזל. חוסר חמור גורם למחלת הצפדינה (דימומים ונשירת שיניים שאפיינה מלחים בעבר). נמצא בפירות הדר, עגבניות וקיווי, ונהרס מאוד בקלות בחום ובישול.</li>
<li><b>⚡ קבוצת ויטמיני B (קומפלקס B):</b> שמונה ויטמינים שעוזרים להפיק אנרגיה מהמזון. החשובים שבהם לבגרות:
<ul><li><b>B1 (תיאמין):</b> חשוב למערכת העצבים. חוסר בו גורם למחלת הברי-ברי (זה הוויטמין שהיה חסר בתמ"ל ב"פרשת רמדיה" וגרם לפגיעה בתינוקות).</li>
<li><b>B3 (ניאצין):</b> חוסר חמור גורם למחלת הפלגרה (בעיות בעור ובמערכת העיכול).</li>
<li><b>B9 (חומצה פולית):</b> קריטי לנשים לפני ובזמן היריון. מונע מומים מולדים קשים במוח ובעמוד השדרה של העובר.</li>
<li><b>B12:</b> בונה את ה-DNA וכדוריות הדם האדומות. חשוב מאוד: נמצא אך ורק במזון מן החי (בשר, ביצים, חלב)! טבעונים חייבים לקחת אותו כתוסף. חוסר גורם לאנמיה ממארת ולנזק למערכת העצבים.</li></ul></li></ul></div>

{id:'min',emoji:'🧂',title:'מינרלים - יסודות החיים מהטבע',html:`
<div class="sec"><h3>1. תעודת זהות למינרלים 🪪</h3>
<ul><li><b>מה הם?</b> בשונה מהוויטמינים והפחמימות שהם חומרים אורגניים, המינרלים הם חומרים אי-אורגניים (אינם מכילים קשרי פחמן-מימן).</li>
<li><b>ערך קלורי:</b> המינרלים אינם מספקים קלוריות כלל.</li>
<li><b>מאיפה הם מגיעים?</b> מקורם בסלעים שבקליפת כדור הארץ. הסלעים מתפוררים למים ולאדמה, הצמחים שואבים אותם, ובעלי החיים אוכלים את הצמחים. כך אנחנו מקבלים אותם מהמים, מהצומח ומהחי.</li>
<li><b>עיכול:</b> המינרלים נספגים במעי הדק, אך הם אינם מתעכלים ואינם משתנים בגוף שלנו.</li></ul></div>

<div class="sec"><h3>2. שתי משפחות של מינרלים ⚖️</h3>
<p>המינרלים מתחלקים ל-2 קבוצות לפי הכמות שלהם בגוף:</p>
<ul><li><b>מאקרו-מינרלים (הגדולים):</b> מינרלים שהגוף צריך בכמות גדולה (מעל 100 מ"ג ביום). הם מהווים כ-4% ממשקל הגוף. דוגמאות: סידן, זרחן, נתרן ומגנזיום.</li>
<li><b>מיקרו-מינרלים / קורט (הקטנים):</b> מינרלים שהגוף צריך בכמות זעירה (פחות מ-100 מ"ג ביום). למרות הכמות הקטנה, הם קריטיים לחיים! דוגמאות: ברזל, אבץ, פלואור ויוד.</li></ul></div>

<div class="sec"><h3>3. הכוכבים הגדולים (מאקרו-מינרלים) 🌟</h3>
<ul><li><b>🦴 סידן (Ca):</b> המינרל הכי נפוץ בגוף. 99% ממנו נמצא בעצמות ובשיניים. הוא חיוני לבניית השלד ולכיווץ שרירים. חוסר בסידן גורם למחלת הרככת בילדים (עצמות מתעקמות) ואוסטאופורוזיס (בריחת סידן) במבוגרים. כדי שהסידן ייספג היטב במעי, הגוף חייב ויטמין D.</li>
<li><b>🧂 נתרן (Na):</b> נמצא בעיקר במלח בישול ובמזון מעובד. תפקידו לווסת את כמות הנוזלים ולחץ הדם בגוף. חוסר יוביל להתייבשות וירידת לחץ דם, אך עודף (שנפוץ מאוד היום) גורם ליציאת מים מהתאים, עלייה בלחץ הדם ובצקות.</li>
<li><b>🧬 זרחן (P):</b> המינרל השני הכי נפוץ. הוא בונה את ה-DNA ומרכיב את "מטבעות האנרגיה" של הגוף (ATP). יחד עם הסידן, הוא בונה את העצמות.</li>
<li><b>🥬 מגנזיום (Mg):</b> מרפה שרירים ושומר על קצב לב יציב. חוסר במגנזיום גורם להתכווצויות שרירים כואבות. הוא נמצא בעלים ירוקים (בתוך הכלורופיל) ובמי הברז שלנו.</li></ul>
<div class="bagrut"><span>התפלת מי ים בישראל מוציאה מהמים את המגנזיום, מה שעלול לגרום לחוסר באוכלוסייה.</span></div></div>

<div class="sec"><h3>4. קטנים אבל חזקים (מיקרו-מינרלים) 🔬</h3>
<ul><li><b>🩸 ברזל (Fe):</b> התפקיד העיקרי שלו הוא לקשור את החמצן בתוך תאי הדם האדומים (בהמוגלובין) ולהוביל אותו לכל הגוף. חוסר בברזל גורם לאנמיה, שמתבטאת בחולשה, עייפות, חיוורון ודופק מואץ. ברזל מהחי נספג הכי טוב, ומומלץ לאכול אותו יחד עם ויטמין C שעוזר לספיגה.</li>
<li><b>🌱 אבץ (Zn):</b> קריטי לתהליך חלוקת התאים. חוסר באבץ פוגע בגדילה, בהתפתחות המינית של מתבגרים ובפוריות.</li>
<li><b>🦷 פלואור (F):</b> מגן על זגוגית השן (אמייל) ומונע חורים בשיניים (עששת). נמצא במשחות שיניים ובחלק ממי השתייה. עודף ממנו יגרום לכתמים על השיניים (פלואורוזיס).</li>
<li><b>🐟 יוד (I):</b> חיוני לפעילות בלוטת התריס שאחראית על חילוף החומרים והגדילה. חוסר ביוד גורם לנפיחות בצוואר (זפקת) ובזמן היריון עלול לגרום לפיגור שכלי בעובר. נמצא בעיקר בדגי ים ואצות.</li></ul></div>
`},
{id:'water',emoji:'💧',title:'משק המים - נוזל החיים',html:`
<div class="sec"><h3>1. תעודת זהות למים 🪪</h3>
<ul><li><b>מה הם?</b> המים הם חומר אי-אורגני (אינם מכילים פחמן ומימן יחד).</li>
<li><b>ערך קלורי:</b> 0 קלוריות (אינם מספקים אנרגיה).</li>
<li><b>חשיבות:</b> החומר החשוב ביותר בגוף אחרי חמצן. אפשר לחיות שבועות בלי אוכל, אבל רק ימים ספורים בלי מים.</li></ul></div>

<div class="sec"><h3>2. מה תפקיד המים בגוף שלנו? 🛠️</h3>
<p>כל התהליכים בגופנו מתרחשים בסביבה מימית. תפקידי המים הם:</p>
<ul><li>ממיסים את רוב החומרים בגוף.</li>
<li>מובילים חומרי מזון וחמצן לתאים, ומסלקים פסולת דרך הדם.</li>
<li>שומרים ומווסתים את טמפרטורת הגוף.</li>
<li>מלחלחים (מרטיבים) איברים שונים כמו הפה, העיניים, העור והמפרקים.</li></ul></div>

<div class="sec"><h3>3. כמה מים יש לנו בגוף? (ומה הקשר לשרירים?) ⚖️</h3>
<p>המים מרכיבים כ-60% עד 70% ממשקל גופנו (אצל תינוקות אפילו 80%!).</p>
<div class="bagrut"><span>שריר מכיל המון מים, ושומן מכיל מעט מאוד מים. לכן: גברים מול נשים - לגברים יש יותר מים בגוף כי יש להם בממוצע יותר מסת שריר מנשים. הגיל השלישי - כשמזדקנים מאבדים מסת שריר, ולכן כמות המים בגוף יורדת. ספורטאים - פעילות גופנית בונה שריר, ולכן מגדילה את כמות המים בגוף.</span></div></div>

<div class="sec"><h3>4. איפה המים נמצאים בגוף? (שני "מדורים") 🗺️</h3>
<ul><li><b>מדור תוך-תאי:</b> רוב המים בגוף (בערך שני שלישים) נמצאים בתוך התאים שלנו.</li>
<li><b>מדור חוץ-תאי:</b> שאר המים (בערך שליש) נמצאים מחוץ לתאים, בעיקר בזרם הדם (פלזמה), בנוזל שבין התאים, ובמפרקים.</li></ul></div>

<div class="sec"><h3>5. מאזן המים בגוף 🚰🚽</h3>
<p>כדי שנהיה בריאים, כמות המים שנכנסת לגוף חייבת להיות שווה לכמות שיוצאת.</p>
<ul><li><b>איך מים נכנסים?</b> דרך שתייה, דרך אוכל, וגם "מים מטבוליים" שהגוף מייצר בעצמו בתאים.</li>
<li><b>איך מים יוצאים?</b> דרך השתן (מהכליות), דרך הזיעה (מהעור), דרך הנשימה (מהריאות) ודרך הצואה.</li>
<li><b>מי שולט בזה?</b> המוח שולט בהכנסה בעזרת יצירת תחושת צמא, והכליות שולטות בהוצאה על ידי קביעת כמות השתן (בעזרת הורמון בשם <span class="term">וזופרסין</span> שמקטין את איבוד המים).</li></ul></div>

<div class="sec"><h3>6. סכנה 1: התייבשות 🏜️</h3>
<ul><li><b>למה זה קורה?</b> כשיוצאים מהגוף יותר נוזלים מאשר נכנסים, ולכן נפח הדם יורד.</li>
<li><b>סימנים ראשונים:</b> כאב ראש, יובש בלשון, בלבול וסחרחורת.</li>
<li><b>סכנה:</b> חוסר חמצן לאיברים חיוניים, אובדן הכרה ואפילו מוות.</li>
<li><b>מה עושים?</b> מפסיקים כל מאמץ, מקררים את הגוף, ושותים נוזלים (עדיף מתוקים) בלגימות קטנות.</li></ul></div>

<div class="sec"><h3>7. סכנה 2: הרעלת מים 🌊</h3>
<ul><li><b>למה זה קורה?</b> מצב נדיר שקורה כששותים המון מים בזמן קצר מאוד.</li>
<li><b>סכנה:</b> המים מדללים את ריכוז הנתרן בדם. כתוצאה מכך מים נכנסים לתוך התאים, מנפחים אותם ויוצרים בצקת. אם נוצרת בצקת במוח, זה עלול לגרום למוות.</li></ul></div>

<div class="sec"><h3>8. אז כמה מים צריך לשתות? 🥤</h3>
<ul><li>לרוב מומלץ לשתות כ-8 עד 12 כוסות ביום (בערך ליטר וחצי עד שניים).</li>
<li><b>מתי צריך לשתות יותר?</b> בקיץ, בפעילות גופנית, בהיריון, וגם כשחולים (שלשולים, הקאות או חום).</li>
<li><b>קבוצות בסיכון:</b> צריך לשים לב במיוחד לתינוקות (כי הם מאבדים מים מהר) ולקשישים (כי עם הגיל מאבדים לפעמים את תחושת הצמא ועלולים להתייבש בלי להרגיש).</li></ul></div>
`},
{id:'energy',emoji:'⚡',title:'אנרגיה ומאזן המשקל בגוף',html:`
<div class="sec"><h3>1. מהי אנרגיה ומאיפה היא מגיעה? 🔋</h3>
<ul><li><b>הגדרה:</b> אנרגיה היא היכולת של הגוף לבצע עבודה, והיא נמדדת ביחידות שנקראות קלוריות (קק"ל).</li>
<li><b>כמה קלוריות יש במזון?</b> הגוף מפיק אנרגיה מפירוק של שלושה אבות מזון בלבד: פחמימות (4 קלוריות לגרם), חלבונים (4 קלוריות לגרם) ושומנים (9 קלוריות לגרם).</li>
<li><b>מטבעות האנרגיה:</b> האנרגיה שמופקת בתאים (למשל מגלוקוז) נאגרת בתוך מולקולות שנקראות ATP – אלו הם ה"מטבעות" שהגוף משתמש בהם כדי לבצע פעולות. אנרגיה עודפת נשמרת כגליקוגן, ורובה נאגרת ברקמת השומן.</li></ul></div>

<div class="sec"><h3>2. איך הגוף "מבזבז" אנרגיה? (ההוצאה האנרגטית הכללית - TEE) 💸</h3>
<p>כלל האנרגיה שאנחנו שורפים ביממה מורכבת מ-3 חלקים:</p>
<ul><li><b>א. קצב חילוף החומרים הבסיסי (BMR):</b> זהו הצרכן הגדול ביותר! הוא מהווה 60%-75% מכל הקלוריות שאנו שורפים ביום. זו האנרגיה שהגוף צורך במנוחה מוחלטת רק כדי לחיות (נשימה, פעילות הלב והמוח).</li>
<li><b>ב. האפקט התרמי של המזון (TEF):</b> האנרגיה שהגוף מתאמץ ומשקיע כדי לעכל ולספוג את האוכל שאכלנו. זה מהווה כ-10% מההוצאה היומית. ארוחה עם הרבה חלבון תדרוש מהגוף יותר אנרגיה לעיכול.</li>
<li><b>ג. פעילות גופנית (EEE):</b> האנרגיה שאנו שורפים כשאנחנו זזים (הליכה, ספורט, ניקיון). זה מהווה 15%-30% מההוצאה היומית, וזה החלק היחיד שיש לנו שליטה מלאה עליו.</li></ul>
<div class="bagrut"><span>מה משפיע על ה-BMR: הרכב הגוף - שריר שורף המון אנרגיה גם במנוחה, בעוד שומן כמעט ולא, לכן ככל שיש יותר שריר ה-BMR גבוה יותר. מין - לגברים BMR גבוה יותר מנשים. גיל - בתקופת הגדילה ה-BMR גבוה, ומגיל 20 מסת השריר יורדת ואיתה ה-BMR. דיאטה - הגבלה קלורית גורמת לגוף "להיבהל" ולהיכנס למצב חיסכון, ולכן דיאטה מורידה את ה-BMR.</span></div></div>

<div class="sec"><h3>3. משוואת מאזן האנרגיה ⚖️</h3>
<p>המשקל שלנו נקבע לפי החשבון הפשוט של "כמה נכנס לעומת כמה יצא":</p>
<ul><li><b>מאזן חיובי (משמינים):</b> מכניסים יותר קלוריות ממה שמוציאים. העודף הופך לשומן.</li>
<li><b>מאזן שלילי (מרזים):</b> מוציאים יותר קלוריות ממה שמכניסים.</li>
<li><b>מאזן אפס (שומרים על המשקל):</b> צריכת הקלוריות שווה בדיוק להוצאת הקלוריות.</li></ul></div>

<div class="sec"><h3>4. מלכודת הדיאטות ⚠️</h3>
<p>למה כל כך קשה לרדת במשקל רק בעזרת דיאטה? בגלל שהגוף חושב שחסר אוכל, הוא "מתייעל" ומוריד את קצב חילוף החומרים הבסיסי (BMR) כדי לחסוך באנרגיה. לכן, הדרך הנכונה והבריאה ביותר היא לשלב תזונה נכונה יחד עם פעילות גופנית. הספורט בונה את השריר, וכך מעלה בחזרה את ה-BMR שירד בגלל הדיאטה.</p></div>
`},
{id:'pregnancy',emoji:'🤰',title:'היריון והנקה',html:`
<div class="sec"><h3>1. משקל ואנרגיה בזמן היריון ⚖️</h3>
<ul><li><b>עלייה במשקל היא טבעית וחובה:</b> הגוף מוסיף משקל בגלל העובר, השליה, מי השפיר, העלייה בנפח הדם ומאגרי שומן שהגוף מכין מראש. אישה במשקל תקין אמורה לעלות בממוצע 11-16 ק"ג.</li>
<li><b>סכנות במשקל לא תקין:</b> היריון בעודף משקל מסוכן ועלול לגרום לסוכרת, רעלת היריון וצורך בניתוח קיסרי בגלל עובר גדול. היריון בתת-משקל מעלה סיכון ללידה מוקדמת ותינוק קטן מדי.</li>
<li><b>כמה לאכול? (לא אוכלים בשביל שניים!):</b> אין צורך להכפיל את כמות האוכל. החל מהשליש השני (שבוע 13) מומלץ להוסיף רק כ-300 קלוריות ביום.</li></ul></div>

<div class="sec"><h3>2. הכוכבים של ההיריון - רכיבי תזונה שחייבים להגדיל ⭐</h3>
<p>בזמן ההיריון, הדרישה לויטמינים ומינרלים עולה משמעותית:</p>
<ul><li><b>💊 חומצה פולית (ויטמין B9):</b> קריטית ביותר! חובה לקחת כבר לפני ההיריון ובשלושת החודשים הראשונים. היא מונעת מומים מולדים קשים מאוד במוח ובעמוד השדרה של העובר (מומים בתעלה העצבית).</li>
<li><b>🩸 ברזל:</b> נפח הדם של האם עולה והעובר לוקח ברזל לעצמו. מחסור יגרום לאם לאנמיה (עייפות, חולשה). לרוב מקבלים תוסף ברזל מהשבוע ה-13.</li>
<li><b>🦴 סידן:</b> חשוב במיוחד בשליש האחרון כדי לבנות את השלד של התינוק.</li></ul>
<div class="bagrut"><span>אם האם לא תאכל מספיק סידן, העובר "ייקח" את הסידן מהעצמות שלה, מה שעלול לגרום לה למחלת דילול עצם (אוסטאופורוזיס) בעתיד.</span></div></div>

<div class="sec"><h3>3. "רשימת השחורים" - ממה חובה להימנע? 🚫</h3>
<p>מערכת החיסון של האישה ההרה חלשה יותר, ולכן יש סכנה גדולה מזיהומים במזון:</p>
<ul><li><b>אסור לאכול מזון חי (לא מבושל):</b> בשר נא (קרפצ'יו), דגים נאים (סושי), וביצים חיות (ביצת עין, מוס רך) – סכנה לחיידקי סלמונלה, אי-קולי וטפילים.</li>
<li><b>אסור מוצרי חלב לא מפוסטרים:</b> וגבינות עובש (כמו קממבר ורוקפור), בגלל סכנה לחיידק הליסטריה שעלול לגרום להפלה.</li>
<li><b>🍷 אלכוהול (איסור מוחלט!):</b> האלכוהול עובר ישר לעובר וגורם ל"תסמונת אלכוהול עוברית" (FAS) – פגמים פיזיים ושכליים חמורים ובלתי הפיכים. אין כמות בטוחה של אלכוהול בהיריון.</li>
<li><b>☕ קפאין:</b> מומלץ להפחית, כי העובר מתקשה לפרק אותו.</li></ul></div>

<div class="sec"><h3>4. תקופת ההנקה 🍼</h3>
<ul><li><b>הקולוסטרום:</b> זהו החלב של הימים הראשונים לאחר הלידה. צבעו צהבהב והוא מלא בנוגדנים שנועדו להגן על התינוק שנולד עם מערכת חיסון חלשה.</li>
<li><b>פרולקטין:</b> ההורמון שאחראי על ייצור החלב. הוא גורם לאם לתחושת רעב ומעכב את הביוץ.</li>
<li><b>תזונת האם המניקה:</b> גם אם האם תאכל ג'אנק פוד, חלב האם יהיה מצוין עבור התינוק. למה? כי הגוף "לוקח" את מה שחסר מהמאגרים של האם (ולכן האם היא זו שתיפגע אם לא תאכל נכון).</li>
<li><b>אנרגיה ושתייה:</b> אישה מניקה שורפת הרבה קלוריות! היא צריכה תוספת של 300-500 קלוריות ביום ושתייה מרובה של כ-3 ליטרים מים ביום כדי לייצר חלב. חומרים כמו אלכוהול, ניקוטין ותרופות עוברים לחלב, ולכן יש להימנע מהם.</li></ul></div>
`},
{id:'childhood',emoji:'🧒',title:'תזונה בינקות, ילדות ונעורים',html:`
<div class="sec"><h3>1. תזונה בינקות (מלידה עד גיל שנה) 🍼</h3>
<p>שנת החיים הראשונה מתאפיינת בגדילה המהירה ביותר בחיים.</p>
<ul><li><b>חלב אם או תמ"ל:</b> חלב אם הוא המזון המומלץ ביותר, מכיוון שהוא מכיל את כל רכיבי התזונה והנוגדנים שהתינוק צריך. אם לא מניקים, משתמשים בתמ"ל (תרכובת מזון לתינוקות) המותאם לצרכי התינוק.</li>
<li><b>מעבר למוצקים:</b> סביב גיל חצי שנה מתחילים לחשוף את התינוק ל"טעימות" של מזון מוצק. חשיפה למזונות בגיל זה חשובה כדי למנוע התפתחות של אלרגיות בעתיד ולהכיר לתינוק מרקמים וטעמים.</li>
<li><b>בדיקות ותוספים:</b> בימים הראשונים עושים לתינוק בדיקת דם לאיתור מחלות מטבוליות גנטיות (כמו PKU - פנילקטונוריה, שדורשת תזונה מיוחדת ללא פנילאלנין). בנוסף, מגיל 4 חודשים נותנים לתינוקות תוספת ברזל כדי למנוע אנמיה ופגיעה בהתפתחות.</li></ul></div>

<div class="sec"><h3>2. תזונה בילדות (גיל שנה עד 10) 👧</h3>
<ul><li><b>קצב הגדילה:</b> בשלב זה קצב הגדילה מאט יחסית לשנת החיים הראשונה.</li>
<li><b>ארוחת בוקר:</b> סופר חשובה! אחרי צום הלילה, הגוף מרוקן מאנרגיה. ארוחת הבוקר היא ה"דלק" שמסייע לריכוז בלימודים, לערנות ולשמירה על משקל תקין.</li>
<li><b>שינה:</b> חובה להקפיד על שעות שינה מספקות, כי בזמן השינה מופרש הורמון הגדילה, שאחראי על בניית שרירים ועצמות וצמיחה לגובה.</li></ul></div>

<div class="sec"><h3>3. תזונה בנעורים (גיל ההתבגרות) 🧑</h3>
<p>תקופה סוערת שבה יש "בולמוסי רעב" בגלל גדילה מואצת.</p>
<ul><li><b>הבדלים בין בנים לבנות:</b> אצל בנים נוספת בעיקר מסת שריר ושלד (ולכן הם צריכים יותר אנרגיה וחלבון). אצל בנות נוספת מסת שלד ורקמת שומן.</li>
<li><b>רכיבי תזונה שחייבים להגביר:</b> סידן (קריטי עכשיו כי כמעט חצי ממסת העצם נבנית בגיל הזה), ברזל (יש עלייה בנפח הדם ובשרירים, ואצל בנות גם איבוד דם בווסת, ולכן חובה לצרוך ברזל למניעת אנמיה), אבץ (דרוש להתפתחות התקינה של מערכת המין).</li>
<li><b>הגורמים שמשפיעים על הצרכים התזונתיים:</b> קצב גדילה מואץ, התבגרות מינית (שינויים הורמונליים) והתבגרות חברתית (לחץ חברתי, מודל היופי).</li></ul></div>

<div class="sec"><h3>4. השמנה ופעילות גופנית 🏃‍♂️🍔</h3>
<ul><li><b>השמנה:</b> נגרמת משילוב של ג'אנק פוד, מיעוט שעות שינה, מסכים (ישיבה ממושכת) ואכילה רגשית.</li>
<li><b>פעילות אירובית:</b> מפעילה קבוצות שרירים גדולות לאורך זמן בעזרת חמצן (ריצה, שחייה, אופניים). שורפת שומנים ופחמימות ומשפרת סיבולת לב-ריאה.</li>
<li><b>פעילות אנאירובית:</b> עבודה לטווח קצר בעוצמה גבוהה ללא חמצן (הדוגמה הקלאסית: הרמת משקולות). מיועדת לחיזוק ופיתוח שרירים.</li></ul></div>

<div class="sec"><h3>5. הפרעות אכילה ⚠️</h3>
<p>הלחץ החברתי למראה רזה, יחד עם שינויים רגשיים, עלול להוביל להפרעות אכילה המסכנות חיים. השלוש המרכזיות לבגרות הן:</p>
<ul><li><b>אנורקסיה נרבוזה (ציימנות):</b> הימנעות קיצונית ממזון, המובילה לאובדן משקל חמור.</li>
<li><b>בולימיה נרבוזה (זללנות):</b> התקפי זלילה בלתי נשלטים של כמויות מזון גדולות, המלווים בדרך כלל בפעולות "ריקון" (כמו הקאות או משלשלים) כטקס היטהרות.</li>
<li><b>הפרעת אכילת יתר (אכילה כפייתית):</b> התקפי אכילת כמויות מזון עצומות ללא שליטה וללא הקאות. הפרעה זו מלווה לרוב בבושה ומובילה פעמים רבות להשמנת יתר חמורה.</li></ul></div>

<div class="sec"><h3>עקומות גדילה (Growth Curves) 📈</h3>
<ul><li><b>מהן עקומות גדילה?</b> אלו כלים (מעין גרפים) שמשמשים אנשי מקצוע רפואיים והורים כדי להעריך ולעקוב אחר הבריאות והתזונה של הילד בתקופת הגדילה.</li>
<li><b>מה מודדים?</b> העקומות מציגות את התפלגות המשקל, הגובה ומדד מסת הגוף (BMI) בהתאם לגיל ולמין. אצל תינוקות (עד גיל שנתיים) מודדים גם את היקף הראש.</li>
<li><b>מהו "אחוזון"?</b> המדדים מוצגים כקווי "אחוזונים", שזהו נתון סטטיסטי המראה איפה הילד ממוקם ביחס לשאר הילדים. לדוגמה, אם ילד נמצא באחוזון 70 בגובה, זה אומר שהוא גבוה יותר מ-70% מבני גילו, ונמוך מ-30% מהם.</li>
<li><b>התאמה אישית:</b> מכיוון שקצב הגדילה של ילדים עם תסמונות גנטיות (כמו תסמונת דאון או תסמונת טרנר) שונה מהקצב הרגיל, נוצרו עבורם עקומות גדילה מיוחדות ואופייניות רק להם.</li></ul></div>

<div class="sec"><h3>אלרגיות ומערכת החיסון 🤧</h3>
<ul><li><b>מה זו אלרגיה?</b> מדובר בתגובת־יתר של מערכת החיסון. במקום להילחם באיומים אמיתיים (כמו חיידקים), המערכת "מתבלבלת" ותוקפת חומרים תמימים שאינם באמת מסוכנים לגוף, כמו סוגי מזון מסוימים, אבקני פרחים או עובש. התגובה יכולה להתבטא בפריחה, הופעת שיעול או נפיחות בפנים הדורשת טיפול רפואי.</li></ul>
<p><b>למה חשוב לחשוף תינוקות למזון מוצק וחדש דווקא בגיל חצי שנה?</b></p>
<ul><li><b>לגלות סימני אלרגיה:</b> חשיפה הדרגתית וזהירה למזונות חדשים עוזרת לזהות בזמן אם התינוק רגיש למזון מסוים.</li>
<li><b>למנוע אלרגיות בעתיד:</b> עד גיל חצי שנה, חשיפה למזונות חדשים עלולה דווקא להעלות את שכיחות האלרגיות. אולם, מגיל שישה חודשים נפתח מעין "חלון הזדמנויות" שבו מערכת החיסון עדיין מתפתחת, ולכן חשיפה למזונות מגוונים בשלב זה מקטינה משמעותית את הסיכוי שתתפתח אליהם אלרגיה בעתיד.</li></ul>
<div class="tip"><span>עיקרון ה"חשיפה מונעת אלרגיה" נכון גם לגורמים נוספים. למשל, נמצא שילדים שחיים בסביבת חיות מחמד בשנת חייהם הראשונה, לרוב לא מפתחים כלפיהן אלרגיה בעתיד.</span></div></div>
`},
{id:'elderly',emoji:'👴',title:'תזונה בגיל השלישי',html:`
<div class="sec"><h3>1. מי הם בני הגיל השלישי? 🪪</h3>
<ul><li>הגיל השלישי מוגדר (באופן די שרירותי) מגיל 70 ומעלה.</li>
<li>במציאות, אין באמת קו שמפריד בין מבוגרים לקשישים, כי המצב הבריאותי והנפשי של האדם חשוב יותר מהגיל שלו במספרים.</li>
<li>תזונה נכונה במהלך החיים יכולה לעכב את תהליכי הזקנה ולמנוע מחלות כמו סוכרת ומחלות לב.</li></ul></div>

<div class="sec"><h3>2. האתגרים והשינויים בגיל המבוגר 🔄</h3>
<p>עם העלייה בתוחלת החיים, קשישים מתמודדים עם שינויים רבים שעלולים לפגוע להם בתזונה:</p>
<ul><li><b>שינויים גופניים:</b> חוסר תיאבון, בעיות שיניים ובליעה, ירידה בחוש הטעם והריח, עצירות, וצריכת תרופות רבות.</li>
<li><b>שינויים פסיכולוגיים וחברתיים:</b> קושי כלכלי, קושי בקניית אוכל, בדידות, דיכאון, או מחלות הפוגעות בזיכרון כמו שיטיון (דמנציה).</li>
<li><b>שינויים במגורים:</b> מעבר למוסדות, בתי חולים או בתי אבות.</li></ul></div>

<div class="sec"><h3>3. הסכנה הגדולה: תת-תזונה ⚠️</h3>
<ul><li>כל השינויים שציינו עלולים לגרום לקשיש לאכול מעט מדי ולהגיע למצב של תת-תזונה (מחסור באנרגיה או בוויטמינים ומינרלים).</li>
<li>התופעה נפוצה מאוד (במיוחד בבתי אבות) ויש לה השלכות קשות: ירידה בתפקוד, ריפוי איטי של פצעים, דיכאון, ועצמות שנשברות בקלות.</li></ul></div>

<div class="sec"><h3>4. המלצות תזונתיות לבני הגיל השלישי 🥗</h3>
<p>התזונה צריכה להיות מאוזנת, צבעונית ומגוונת בטעמים ובמרקמים.</p>
<ul><li><b>אנרגיה (קלוריות):</b> בגלל שזזים פחות ויש פחות שריר, הגוף שורף פחות קלוריות. לכן, צריכים לאכול פחות קלוריות כדי לא להשמין (עודף משקל עלול לגרום לסוכרת ומחלות לב).</li>
<li><b>חלבונים:</b> למרות שצורכים פחות קלוריות, ההמלצה היא דווקא להעלות מעט את כמות החלבון, כדי למנוע את דילול ופירוק השרירים שקורה בגיל הזה.</li>
<li><b>פחמימות וסיבים תזונתיים:</b> כדאי לאכול פחמימות מורכבות וסיבים תזונתיים שעוזרים מאוד למנוע עצירות (בעיה נפוצה בגיל השלישי).</li></ul>
<div class="bagrut"><span>יש סכנה גדולה למחסור בסידן וויטמין D. מחסור בהם גורם למחלת אוסטיאופורוזיס (בריחת סידן), שבה העצמות מאבדות סידן ונשברות בקלות. בנוסף - בגיל מבוגר הגוף מאבד את תחושת הצמא, ולכן קשישים חייבים לשתות גם כשהם לא צמאים כדי לא להתייבש.</span></div></div>

<div class="sec"><h3>5. פעילות גופנית 🚶‍♂️</h3>
<p>פעילות גופנית מותאמת אישית עוזרת מאוד: היא מגדילה את מסת השריר, משפרת את התיאבון ואת המצב הנפשי והשכלי.</p></div>

<div class="sec"><h3>מחלת השיטיון (דמנציה) 🧠</h3>
<ul><li><b>מהי המחלה?</b> דמנציה היא מחלה שבה נפגעות יכולות החשיבה (התפקודים הקוגניטיביים) וכן התפקודים הרגשיים וההתנהגותיים (התפקודים המנטאליים) של האדם.</li>
<li><b>פגיעה בזיכרון ובהתמצאות:</b> חולים בדמנציה סובלים מפגיעה הדרגתית בזיכרון, ביכולת החשיבה, בהתמצאות בזמן ובמרחב, ואפילו ביכולת לזהות אנשים וחפצים מוכרים.</li>
<li><b>תסמינים התנהגותיים ורגשיים:</b> כחלק ממהלך המחלה, החולה חווה פעמים רבות תופעות התנהגותיות קשות כמו בלבול, רוגז, חשדנות ואף התקפי אלימות.</li>
<li><b>פגיעה בתפקוד היומיומי:</b> מעבר לפגיעה המוחית, עם הזמן מתרחשת גם פגיעה ביכולות הפיזיות של החולה. כל אלה מובילים לירידה הדרגתית ומשמעותית ביכולת שלו לבצע פעילויות יומיומיות פשוטות ולתקשר עם הסביבה.</li></ul></div>
`},
{id:'sport',emoji:'🏃',title:'תזונה ופעילות גופנית',html:`
<div class="sec"><h3>1. חשיבות הפעילות הגופנית 🏃‍♀️</h3>
<ul><li>פעילות גופנית תורמת רבות לבריאות הגוף והנפש.</li>
<li>חוסר בפעילות מעלה את הסיכון לפתח בעיות כמו השמנה, סוכרת, אי ספיקת לב ויתר לחץ דם.</li></ul></div>

<div class="sec"><h3>2. אנרגיה וקלוריות - למה ספורט לבד לא מספיק להרזיה? ⚖️</h3>
<ul><li>כדי לרדת במשקל ולשמור על מסת השריר, הפתרון הטוב ביותר הוא שילוב של תזונה נכונה (דיאטה) יחד עם פעילות גופנית.</li>
<li><b>למה לא רק דיאטה?</b> כי דיאטה לבדה אינה טבעית לגוף וגורמת לו "להיבהל" ולהאט את קצב חילוף החומרים הבסיסי שלו כדי לחסוך באנרגיה. הספורט (ובעיקר בניית שריר) עוזר להעלות את קצב חילוף החומרים בחזרה.</li></ul></div>

<div class="sec"><h3>3. מה הגוף שורף בזמן אימון - שומן או פחמימות? 🔥</h3>
<ul><li><b>אימון בעצימות גבוהה (מאמץ קשה):</b> הגוף צריך לקבל אנרגיה בצורה דחופה ומהירה, ולכן הוא ישתמש בעיקר בפחמימות (גלוקוז וגליקוגן).</li>
<li><b>אימון בעצימות נמוכה/בינונית (מאמץ מתון):</b> הגוף ישרוף בעיקר שומנים. למעשה, שריפת השומן היעילה ביותר קורית במאמץ מתון, בדופק של 60%-70% מהדופק המרבי.</li></ul></div>

<div class="sec"><h3>4. אבות המזון והספורט 🥗</h3>
<ul><li><b>פחמימות:</b> מספקות אנרגיה קריטית לאימון. לפני האימון מומלץ לאכול פחמימות פשוטות שנותנות אנרגיה מהירה וזמינה, ואחרי האימון כדאי לאכול פחמימות מורכבות. חוסר בפחמימות יגרום לעייפות ויגביר סכנה לפציעות.</li>
<li><b>חלבונים:</b> בזמן עבודת השריר נוצרים בו "קרעים" קטנים, והחלבון משקם, מחזק ובונה את השריר מחדש לאחר האימון. לרוב הגדול של האנשים אין צורך באבקות או תוספי חלבון, ואפשר לקבל את הכמות הנדרשת מאוכל רגיל. בנוסף, הגוף יכול לאגור רק כמות מוגבלת של חלבון בשריר, ולכן חלבון עודף פשוט יהפוך לשומן.</li>
<li><b>שומנים:</b> למרות שמוציאים הרבה אנרגיה בספורט, אין צורך להעלות את כמות השומנים בתפריט היומי.</li></ul></div>

<div class="sec"><h3>5. מינרלים שספורטאים חייבים לשים אליהם לב 🩸🦴</h3>
<ul><li><b>ברזל:</b> תפקידו להוביל חמצן לשרירים. ספורטאים מאבדים ברזל בזיעה ובעיכול (ונשים מאבדות גם במחזור החודשי). מחסור בברזל פוגע בפעילות ומוביל למצב של "אנמיית ספורט".</li>
<li><b>סידן:</b> חיוני לכיווץ והרפיית השרירים. בזמן פעילות השימוש בסידן גובר, ואם חסר סידן בדם, הגוף יפרק אותו מהעצמות, מה שעלול לגרום לדלדול עצמות.</li></ul></div>

<div class="sec"><h3>6. חומצת חלב (למה נתפסים לנו השרירים?) 😫</h3>
<ul><li>כשהגוף מתאמץ מאוד וחסר לו חמצן כדי להפיק אנרגיה, נוצר בשריר תוצר לוואי שנקרא "חומצה לקטית" (חומצת חלב).</li>
<li>הצטברות החומצה מעלה את רמת החומציות בשריר וגורמת לכאב העז והמוכר שאנו קוראים לו "שריר תפוס".</li></ul>
<div class="bagrut"><span>למעשה, זהו מנגנון הגנה חכם של הגוף - הכאב מאותת לנו לעצור ולנוח, וכך מונע מאיתנו להמשיך במאמץ ולגרום לעצמנו נזק של ממש.</span></div></div>

/* ===== topic <-> chapter mapping (by chapter, per user's choice) ===== */
// questions topic id -> summary chapter id(s)
const TOPIC_TO_CH = {
  carbs:['carbs'], protein:['protein'], fat:['fat'], vit:['vit'], min:['min'],
  water:['water'], digest:['digest'], intro:['intro'], sport:['sport'], energy:['energy'],
  life:['pregnancy','childhood','elderly']
};
// summary chapter id -> questions topic id
const CH_TO_TOPIC = {
  carbs:'carbs', protein:'protein', fat:'fat', vit:'vit', min:'min', water:'water',
  digest:'digest', intro:'intro', sport:'sport', energy:'energy',
  pregnancy:'life', childhood:'life', elderly:'life'
};
function clean(t){ return t.replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}️]/gu,'').trim(); }

let mode='summary', activeChip='all', searchTerm='', typeFilter='all';

/* chip label = the chapter name without its explanatory subtitle after the dash */
function chipLabel(title){return clean(title).split(/\s+[-—–]\s+/)[0].trim();}
/* ===== build nav chips per mode ===== */
function buildNav(){
  const nav=document.getElementById('navchips'); nav.innerHTML='';
  const all=document.createElement('button');all.className='navchip active';all.textContent='הכל';
  all.onclick=()=>{activeChip='all';highlightChip(all);window.scrollTo({top:0,behavior:'smooth'});};nav.appendChild(all);
  if(mode==='summary'){
    CH.forEach(c=>{const b=document.createElement('button');b.className='navchip';b.textContent=c.emoji+' '+chipLabel(c.title);
      b.onclick=()=>{const el=document.getElementById('ch-'+c.id);openSummaryChapter(el,true);el.scrollIntoView({behavior:'smooth',block:'start'});};nav.appendChild(b);});
  }else{
    Object.entries(TOPICS).forEach(([k,v])=>{const b=document.createElement('button');b.className='navchip';b.textContent=v.emoji+' '+v.name;
      b.onclick=()=>{const el=document.getElementById('qch-'+k);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});};nav.appendChild(b);});
  }
}
function highlightChip(el){document.querySelectorAll('#navchips .navchip').forEach(c=>c.classList.remove('active'));el.classList.add('active');}
/* second chip row: filter the question list by question type */
function buildTypeChips(){
  const bar=document.getElementById('typechips'); bar.innerHTML='';
  bar.style.display = mode==='questions' ? '' : 'none';
  if(mode!=='questions')return;
  const opts=[['all','הכל']].concat(Object.entries(TYPES).map(([k,v])=>[k,v]));
  opts.forEach(([k,label])=>{
    const n=(k==='all')?Q.length:Q.filter(q=>q.ty===k).length;
    if(!n)return;                                    /* skip types with no questions */
    const b=document.createElement('button');
    b.className='navchip'+(typeFilter===k?' active':'');
    b.textContent=label+' ('+n+')';
    b.onclick=()=>{typeFilter=k;renderQuestions();buildTypeChips();if(searchTerm)searchQuestions();};
    bar.appendChild(b);
  });
}

/* ===== SUMMARY render ===== */
function renderSummary(){
  const c=document.getElementById('summaryContent');c.innerHTML='';
  CH.forEach(ch=>{
    const topic=CH_TO_TOPIC[ch.id];

function openSummaryChapter(el,on){if(on)el.classList.add('open');else el.classList.remove('open');}

/* ===== QUESTIONS render ===== */
function renderQuestions(){
  const cont=document.getElementById('questionsContent');cont.innerHTML='';
  Object.keys(TOPICS).forEach(tk=>{
    const inT=Q.filter(q=>q.topics.includes(tk)&&(typeFilter==='all'||q.ty===typeFilter));
    if(!inT.length)return;
    const sec=document.createElement('div');sec.className='qchapter';sec.id='qch-'+tk;
    // link back to summary
    const chIds=TOPIC_TO_CH[tk]||[];
    let back='';
    if(chIds.length){
      const label = chIds.length>1 ? 'חזרה לחומר במעגל החיים' : 'חזרה לחומר בסיכום: '+clean(TOPICS[tk].name);
      back='<button class="xlink toSummary" onclick="goToSummary(\''+chIds[0]+'\')"><span>📖 '+label+'</span><span class="arrow">←</span></button>';
    }
    sec.innerHTML='<div class="qchapter-head"><span class="emoji">'+TOPICS[tk].emoji+'</span><h2>'+TOPICS[tk].name+'</h2><span class="cnt">'+inT.length+'</span></div>'+back;
    inT.forEach(q=>sec.appendChild(makeQCard(q,tk)));
    cont.appendChild(sec);
  });
}
/* split a question string into numbered sub-parts (א/ב/ג) like the answers */
function formatQuestionText(qq){
  let lead='', rest=qq;
  const m=qq.match(/^([^—]*—)\s*([\s\S]*)$/);          /* "נושא — ..." → topic lead + rest */
  if(m){ lead=m[1].trim(); rest=m[2].trim(); }
  const parts=rest.split(/(?<=[.?!])\s+/).map(s=>s.trim()).filter(Boolean);
  if(parts.length<2) return '<div class="q-text">'+qq+'</div>';   /* single-part question */
  const marks='אבגדהוזחט';
  let h = lead ? '<div class="q-text">'+lead+'</div>' : '';
  h += '<div class="parts q-parts">'+parts.map((s,i)=>
        '<div class="part"><span class="pl">'+(marks[i]||(i+1))+'. </span>'+s+'</div>').join('')+'</div>';
  return h;
}
function makeQCard(q,curTopic){
  const card=document.createElement('div');card.className='q';
  const top=document.createElement('div');top.className='q-top';
  let multi='';
  if(q.topics.length>1){const others=q.topics.filter(t=>t!==curTopic).map(t=>TOPICS[t].name);multi='<span class="tag multi">🔗 גם: '+others.join(' · ')+'</span>';}
  const tags='<span class="tag year">'+q.y+'</span><span class="tag type">'+TYPES[q.ty]+'</span>'+multi;
  /* q.html = the question text is already written with its own sub-parts / options */
  const qHtml=(q.html||q.ty==='mc')?'<div class="q-text">'+q.q+'</div>':formatQuestionText(q.q);
  let body='<div class="q-meta">'+tags+'</div>'+qHtml;
  if(q.parts){body+='<div class="parts">'+q.parts.map(p=>'<div class="part">'+(p.l?'<span class="pl">'+p.l+'. </span>':'')+p.t+'</div>').join('')+'</div>';}
  if(q.tableQ){body+=q.tableQ;}
  if(q.mc){body+='<div class="mc-list">'+q.mc.map((o,i)=>'<div class="mc-q">'+'אבגד'[i]+'. '+o.t+'</div>').join('')+'</div>';}
  top.innerHTML='<div class="qicon">+</div><div class="q-body" style="flex:1">'+body+'</div>';
  const ans=document.createElement('div');ans.className='a';
  let ah='<div class="a-inner"><div class="alabel">✅ תשובה</div>';
  if(q.mc){ah+='<div class="mc-ans">'+q.mc.map((o,i)=>'<span class="opt'+(o.correct?' correct':'')+'">'+'אבגד'[i]+'. '+o.t+'</span>').join('')+'</div>';}
  else{
    // number the answer paragraphs as sub-parts (א/ב/ג...) when there are 2+
    let a=q.ans;
    const pcount=(a.match(/<p>/g)||[]).length;
    if(!q.html && pcount>=2 && !/class="pl"/.test(a) && a.indexOf('<table')===-1){
      let i=0; const marks='אבגדהוזחט';
      a=a.replace(/<p>/g,()=>{const m=marks[i]||(i+1); i++; return '<p><span class="pl">'+m+'. </span>';});
    }
    ah+=a;
  }
  // per-question links back to the summary material (one per topic)
  const studyLinks=q.topics.map(t=>{const ch=(TOPIC_TO_CH[t]||[])[0]; if(!ch)return ''; return '<button class="studylink" onclick="event.stopPropagation();goToSummary(\''+ch+'\')">📖 ללמוד על '+TOPICS[t].name+' →</button>';}).join('');
  if(studyLinks)ah+='<div class="studyrow">'+studyLinks+'</div>';
  ah+='</div>';ans.innerHTML=ah;
  top.onclick=()=>card.classList.toggle('open');
  card.appendChild(top);card.appendChild(ans);
  return card;
}

/* ===== mode switch ===== */
function setMode(m){
  mode=m;
  document.getElementById('btnSummary').classList.toggle('active',m==='summary');
  document.getElementById('btnQuestions').classList.toggle('active',m==='questions');
  document.getElementById('view-summary').classList.toggle('active',m==='summary');
  document.getElementById('view-questions').classList.toggle('active',m==='questions');

/* ===== search (within current mode) ===== */
document.getElementById('search').addEventListener('input',e=>{
  searchTerm=e.target.value.trim().toLowerCase();
  if(mode==='summary')searchSummary();else searchQuestions();
});
function searchSummary(){
  renderSummary();
  if(!searchTerm){document.getElementById('noresults').style.display='none';document.getElementById('count').textContent='';return;}
  let any=false;
  document.querySelectorAll('#summaryContent .chapter').forEach(ch=>{
    const body=ch.querySelector('.ch-body');
    if(body.textContent.toLowerCase().includes(searchTerm)){any=true;ch.classList.add('open');ch.style.display='';}
    else ch.style.display='none';
  });
  document.getElementById('noresults').style.display=any?'none':'block';
  document.getElementById('count').textContent='';
}
function searchQuestions(){
  renderQuestions();
  if(!searchTerm){document.getElementById('noresults').style.display='none';document.getElementById('count').textContent='';return;}
  let cnt=0;
  document.querySelectorAll('#questionsContent .qchapter').forEach(sec=>{
    let shown=0;
    sec.querySelectorAll('.q').forEach(qc=>{
      if(qc.textContent.toLowerCase().includes(searchTerm)){qc.style.display='';shown++;cnt++;}
      else qc.style.display='none';
    });
    sec.style.display=shown?'':'none';
  });
  document.getElementById('noresults').style.display=cnt?'none':'block';
  document.getElementById('count').textContent='נמצאו '+cnt+' שאלות';
}

renderSummary();renderQuestions();buildNav();buildTypeChips();
document.querySelector('#summaryContent .chapter').classList.add('open');

/* ===== Text-to-Speech controller ===== */
const TTS={
  rate:1,voice:null,el:null,sentences:[],i:0,paused:false,
  init(){
    if(!('speechSynthesis' in window))return;
    const pick=()=>{const vs=speechSynthesis.getVoices();
      this.voice=vs.find(v=>/^he/i.test(v.lang))||null;};
    pick(); speechSynthesis.onvoiceschanged=pick;
  },
  strip(t){return (t||'').replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{2190}-\u{21FF}\u{2713}\u{2714}️]/gu,' ').replace(/\s+/g,' ').trim();},
  speak(el,textOverride){
    if(!('speechSynthesis' in window)){alert('הדפדפן אינו תומך בהקראה קולית. נסו בדפדפן Chrome / Edge.');return;}
    if(this.el===el){this.stop();return;}      /* click same block again = stop */
    this.stop();
    this.el=el; el.classList.add('tts-reading');
    el.scrollIntoView({behavior:'smooth',block:'center'});
    const raw=this.strip(textOverride!=null?textOverride:(el.innerText||el.textContent));
    this.sentences=raw.split(/(?<=[.!?׃:])\s+|\n+/).map(s=>s.trim()).filter(Boolean);
    if(!this.sentences.length)this.sentences=[raw];
    this.i=0;this.paused=false;
    document.body.classList.add('tts-on');
    document.getElementById('ttsBar').classList.add('open');
    document.getElementById('ttsToggle').textContent='⏸';
    this._next();
  },
  _next(){
    if(this.paused)return;
    if(this.i>=this.sentences.length){this.stop();return;}
    const u=new SpeechSynthesisUtterance(this.sentences[this.i]);
    u.lang='he-IL'; if(this.voice)u.voice=this.voice; u.rate=this.rate;
    document.getElementById('ttsTxt').textContent=this.sentences[this.i];
    u.onend=()=>{ if(this.paused)return; this.i++; this._next(); };
    u.onerror=()=>{ this.i++; if(!this.paused)this._next(); };
    speechSynthesis.speak(u);
  },
  toggle(){
    if(!this.el)return;
    if(this.paused){
      this.paused=false; document.getElementById('ttsToggle').textContent='⏸';
      if(speechSynthesis.paused)speechSynthesis.resume();
      if(!speechSynthesis.speaking)this._next();
    }else{
      this.paused=true; document.getElementById('ttsToggle').textContent='▶';
      speechSynthesis.pause();
    }
  },
  stop(){
    if('speechSynthesis' in window)speechSynthesis.cancel();
    if(this.el)this.el.classList.remove('tts-reading');
    this.el=null;this.sentences=[];this.i=0;this.paused=false;
    document.body.classList.remove('tts-on');
    document.getElementById('ttsBar').classList.remove('open');
  }
};
TTS.init();
document.getElementById('ttsToggle').onclick=()=>TTS.toggle();
document.getElementById('ttsStop').onclick=()=>TTS.stop();

/* ===== inject 🔊 read buttons after every render ===== */
function enhanceReadButtons(){
  document.querySelectorAll('#summaryContent .chapter').forEach(ch=>{
    const head=ch.querySelector('.ch-head');
    if(head && !head.querySelector('.readbtn')){
      const b=document.createElement('button');
      b.className='readbtn';b.title='הקראת הפרק';b.setAttribute('aria-label','הקראת הפרק');b.textContent='🔊';
      b.onclick=e=>{e.stopPropagation(); ch.classList.add('open');
        const body=ch.querySelector('.ch-body');
        const clone=body.cloneNode(true);
        clone.querySelectorAll('.xlink').forEach(n=>n.remove());
        TTS.speak(body, clone.innerText);
      };
      head.insertBefore(b, head.querySelector('.chev'));
    }
  });
  document.querySelectorAll('#questionsContent .q').forEach(q=>{
    const qbody=q.querySelector('.q-body');
    const inner=q.querySelector('.a-inner');
    /* button 1 — read the QUESTION on its own (incl. multiple-choice options) */
    if(qbody && !qbody.querySelector('.q-readbtn')){
      const b=document.createElement('button');
      b.className='q-readbtn q-readbtn-q';b.innerHTML='🔊 הקראת השאלה';b.setAttribute('aria-label','הקראת השאלה');
      b.onclick=e=>{e.stopPropagation();
        const qt=q.querySelector('.q-text'),pp=q.querySelector('.parts'),mm=q.querySelector('.mc-list');
        const txt=[qt&&qt.innerText,pp&&pp.innerText,mm&&mm.innerText].filter(Boolean).join('. ');
        TTS.speak(qbody, txt);
      };
      qbody.appendChild(b);
    }
    /* button 2 — read the ANSWER on its own */
    if(inner && !inner.querySelector('.answer-readbtn')){
      const b=document.createElement('button');
      b.className='q-readbtn answer-readbtn';b.innerHTML='🔊 הקראת התשובה';b.setAttribute('aria-label','הקראת התשובה');
      b.onclick=e=>{e.stopPropagation(); q.classList.add('open');
        const clone=inner.cloneNode(true);
        clone.querySelectorAll('.q-readbtn,.answer-readbtn,.studyrow,.alabel').forEach(n=>n.remove());
        TTS.speak(inner, clone.innerText||'');
      };
      inner.insertBefore(b, inner.firstChild);
    }
  });
}
/* wrap the renderers so buttons survive re-renders (search / mode switch) */
['renderSummary','renderQuestions'].forEach(name=>{

(function(){
  const LS='ntz_a11y_v1';
  const state=Object.assign({font:0,spacing:false,plainbg:false,rate:1},
    JSON.parse(localStorage.getItem(LS)||'{}'));
  const wrap=document.querySelector('.wrap');
  const save=()=>localStorage.setItem(LS,JSON.stringify(state));
  function apply(){
    const scales=[1,1.15,1.3,1.45];
    wrap.style.zoom=scales[Math.max(0,Math.min(3,state.font))];
    document.body.classList.toggle('a11y-spacing',state.spacing);
    document.body.classList.toggle('a11y-plainbg',state.plainbg);
    const sp=document.getElementById('tglSpacing'),bg=document.getElementById('tglBg');
    sp.classList.toggle('on',state.spacing); sp.setAttribute('aria-pressed',state.spacing);
    bg.classList.toggle('on',state.plainbg); bg.setAttribute('aria-pressed',state.plainbg);
    document.getElementById('rateRange').value=state.rate;
    document.getElementById('rateVal').textContent=state.rate.toFixed(1);
    TTS.rate=state.rate;
  }
  document.getElementById('a11yFab').onclick=()=>document.getElementById('a11yPanel').classList.toggle('open');
  document.getElementById('fontPlus').onclick=()=>{state.font=Math.min(3,state.font+1);save();apply();};
  document.getElementById('fontMinus').onclick=()=>{state.font=Math.max(0,state.font-1);save();apply();};
  document.getElementById('fontReset').onclick=()=>{state.font=0;save();apply();};
  document.getElementById('tglSpacing').onclick=()=>{state.spacing=!state.spacing;save();apply();};
  document.getElementById('tglBg').onclick=()=>{state.plainbg=!state.plainbg;save();apply();};
  document.getElementById('rateRange').oninput=e=>{state.rate=parseFloat(e.target.value);save();apply();};
  apply();
})();

/* keep the controls bar pinned flush below the (variable-height) mode bar */
(function(){
  const ms=document.querySelector('.modeswitch'), ctl=document.querySelector('.controls');
  const sync=()=>{ ctl.style.top=ms.offsetHeight+'px'; };
  sync();
  if(window.ResizeObserver) new ResizeObserver(sync).observe(ms);
  window.addEventListener('resize',sync);
})();
</script>
</body>
</html>
