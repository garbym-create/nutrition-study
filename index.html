<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מדעי התזונה — סיכום ושאלות</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800&family=Assistant:wght@400;600;700&family=Suez+One&display=swap');
  :root{
    --ink:#1A1A2E; --coral:#FF6B6B; --teal:#4ECDC4; --yel:#FFD93D; --purp:#7E57C2;
    --cream:#FFFDF5; --pinkf:#FFE5E5; --yelf:#FFF7D6; --tealf:#E0F7F4; --purpf:#EDE7F6; --grnf:#E8F5D6; --green:#7CB342;
    --shadow:5px 5px 0 var(--ink);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Assistant',sans-serif;background:var(--cream);color:var(--ink);
    background-image:radial-gradient(var(--yelf) 2px,transparent 2px);background-size:34px 34px;min-height:100vh;}
  .wrap{max-width:1000px;margin:0 auto;padding:20px 16px 90px;}
  button{font-family:inherit;cursor:pointer;}
  header{text-align:center;margin-bottom:16px;}
  header .badge{display:inline-block;font-family:'Heebo';font-weight:800;font-size:15px;background:var(--yel);
    border:4px solid var(--ink);border-radius:30px;padding:6px 20px;box-shadow:4px 4px 0 var(--ink);transform:rotate(-2deg);}
  header h1{font-family:'Suez One';font-size:clamp(26px,5vw,42px);margin-top:12px;text-shadow:4px 4px 0 var(--yel);}

  /* mode switch */
  .modeswitch{display:flex;gap:10px;justify-content:center;padding:12px 0 8px;position:sticky;top:0;z-index:50;background:var(--cream);}
  .modebtn{font-family:'Heebo';font-weight:800;font-size:17px;background:#fff;border:4px solid var(--ink);
    border-radius:30px;padding:10px 26px;box-shadow:3px 3px 0 var(--ink);transition:transform .08s;}
  .modebtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);}
  .modebtn.active{background:var(--ink);color:#fff;}

  .controls{position:sticky;top:74px;z-index:40;background:var(--cream);padding:10px 0;margin-bottom:8px;border-bottom:3px solid var(--ink);}
  .search-box{display:flex;gap:10px;align-items:center;background:#fff;border:4px solid var(--ink);border-radius:30px;
    padding:6px 16px;box-shadow:3px 3px 0 var(--ink);}
  .search-box input{flex:1;border:none;outline:none;font-family:'Assistant';font-weight:600;font-size:17px;background:transparent;}
  .search-box .ic{font-size:20px;}
  .navchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;padding-bottom:4px;}
  .navchip{flex:none;font-family:'Heebo';font-weight:700;font-size:13px;background:#fff;border:3px solid var(--ink);
    border-radius:20px;padding:6px 13px;box-shadow:2px 2px 0 var(--ink);white-space:nowrap;}
  .navchip.active{background:var(--yel);}
  /* second row — filter by question type (questions mode only) */
  .typechips{margin-top:6px;}
  .typechips .navchip{font-size:12px;padding:5px 11px;border-width:2px;}
  .typechips .navchip.active{background:var(--teal);}

  .view{display:none;}
  .view.active{display:block;}

  /* ===== SUMMARY styles ===== */
  .chapter{margin-top:16px;border:4px solid var(--ink);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;background:#fff;}
  .ch-head{display:flex;align-items:center;gap:12px;padding:15px 18px;cursor:pointer;background:var(--ink);color:#fff;}
  .ch-head .emoji{font-size:28px;}
  .ch-head h2{font-family:'Heebo';font-weight:800;font-size:20px;flex:1;}
  .ch-head .chev{font-size:19px;transition:transform .2s;}
  .chapter.open .ch-head .chev{transform:rotate(180deg);}
  .ch-body{display:none;padding:6px 18px 18px;}
  .chapter.open .ch-body{display:block;}
  /* cross-link banner */
  .xlink{display:flex;align-items:center;gap:10px;background:var(--tealf);border:3px solid var(--teal);
    border-radius:14px;padding:11px 16px;margin:12px 0 4px;font-family:'Heebo';font-weight:800;font-size:15px;
    width:100%;text-align:right;box-shadow:2px 2px 0 var(--ink);}
  .xlink:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);}
  .xlink .arrow{margin-right:auto;font-size:20px;}
  .xlink.toSummary{background:var(--purpf);border-color:var(--purp);}
  .sec{margin-top:14px;}
  .sec h3{font-family:'Heebo';font-weight:800;font-size:17px;color:var(--ink);background:var(--yelf);
    border-right:6px solid var(--coral);padding:7px 12px;border-radius:8px;margin-bottom:7px;}
  .sec p{font-weight:600;font-size:15.5px;line-height:1.55;margin:5px 0;}
  .sec b{color:#0F7A6E;}
  .sec ul{margin:6px 22px 8px 0;}
  .sec li{font-weight:600;font-size:15.5px;line-height:1.5;margin-bottom:5px;}
  .term{display:inline-block;background:var(--tealf);border:2px solid var(--ink);border-radius:8px;padding:0 6px;font-weight:800;}
  .bagrut{background:var(--grnf);border:3px dashed var(--green);border-radius:12px;padding:9px 13px;margin:9px 0;}
  .bagrut::before{content:"⭐ חשוב לבגרות: ";font-family:'Heebo';font-weight:800;color:#5a8a2a;}
  .bagrut span{font-weight:700;font-size:15px;}
  .tip{background:var(--purpf);border:3px solid var(--purp);border-radius:12px;padding:9px 13px;margin:9px 0;}
  .tip::before{content:"💡 טיפ: ";font-family:'Heebo';font-weight:800;color:var(--purp);}
  .tip span{font-weight:700;font-size:15px;}
  table.t{width:100%;border-collapse:collapse;margin:8px 0;font-size:14px;}
  table.t th,table.t td{border:2px solid var(--ink);padding:6px 8px;text-align:center;}
  table.t th{background:var(--yel);font-family:'Heebo';font-weight:800;}
  table.t td:first-child{background:var(--yelf);font-weight:700;}

  /* ===== QUESTIONS styles ===== */
  .qchapter{margin-top:16px;}
  .qchapter-head{display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;border-radius:16px;
    padding:13px 18px;box-shadow:var(--shadow);}
  .qchapter-head .emoji{font-size:26px;}
  .qchapter-head h2{font-family:'Heebo';font-weight:800;font-size:20px;flex:1;}
  .qchapter-head .cnt{font-family:'Heebo';font-weight:800;font-size:14px;background:var(--yel);color:var(--ink);border-radius:20px;padding:3px 11px;}
  .q{background:#fff;border:4px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--ink);margin-top:12px;overflow:hidden;}
  .q-top{display:flex;align-items:flex-start;gap:11px;padding:16px 18px;cursor:pointer;}
  .q-top .qicon{flex:none;width:32px;height:32px;border-radius:10px;background:var(--yel);border:3px solid var(--ink);
    display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;transition:transform .2s;}
  .q.open .q-top .qicon{transform:rotate(45deg);background:var(--coral);}
  .q-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:7px;}
  .tag{font-family:'Heebo';font-weight:700;font-size:11px;border-radius:14px;padding:2px 9px;border:2px solid var(--ink);}
  .tag.year{background:var(--purpf);} .tag.type{background:var(--tealf);} .tag.multi{background:var(--yel);}
  .q-text{font-family:'Heebo';font-weight:800;font-size:17px;line-height:1.45;}
  .q-text p{margin-bottom:6px;}
  /* multiple-choice options shown inside the question itself */
  ul.mc-q-opts{list-style:none;margin:8px 12px 0 0;padding:0;}
  ul.mc-q-opts li{font-family:'Heebo';font-weight:600;font-size:16px;line-height:1.45;
    margin-bottom:4px;padding-right:14px;position:relative;}
  ul.mc-q-opts li::before{content:"•";position:absolute;right:0;top:1px;color:var(--coral);font-size:20px;}
  .q-parts{margin-top:10px;}
  .q-parts .part{font-family:'Heebo';font-weight:800;font-size:16px;line-height:1.5;margin-bottom:7px;}
  .parts{margin-top:9px;}
  .part{font-weight:700;font-size:15.5px;line-height:1.5;margin-bottom:5px;}
  .part .pl,.a-inner .pl{color:var(--coral);font-weight:800;}
  .mc-list{margin-top:9px;display:flex;flex-direction:column;gap:5px;}
  .mc-q{font-weight:700;font-size:15.5px;border:2px solid var(--ink);border-radius:12px;padding:7px 13px;background:var(--cream);}
  .a{max-height:0;overflow:hidden;transition:max-height .35s ease;background:var(--grnf);}
  .q.open .a{max-height:2000px;border-top:4px solid var(--green);}
  .a-inner{padding:16px 18px;}
  .a-inner .alabel{font-family:'Heebo';font-weight:800;font-size:14px;color:var(--green);margin-bottom:7px;}
  .a-inner p{font-weight:600;font-size:15.5px;line-height:1.5;margin-bottom:5px;}
  .a-inner b{color:var(--coral);}
  table.bg{width:100%;border-collapse:collapse;margin:8px 0;font-size:13px;}
  table.bg th,table.bg td{border:2px solid var(--ink);padding:6px 7px;text-align:center;}
  table.bg th{background:var(--yel);font-family:'Heebo';font-weight:800;}
  table.bg td:first-child{background:var(--yelf);font-weight:700;}
  table.bg.empty td:not(:first-child){background:repeating-linear-gradient(45deg,#fff,#fff 6px,#f4f4f4 6px,#f4f4f4 12px);height:28px;}
  .mc-ans .opt{display:block;font-weight:600;font-size:15.5px;padding:2px 0;}
  .mc-ans .opt.correct{color:var(--green);font-weight:800;}
  .mc-ans .opt.correct::after{content:" ✓";}

  .count{font-family:'Heebo';font-weight:700;font-size:13px;color:#888;margin-top:8px;text-align:center;}
  .noresults{text-align:center;font-family:'Heebo';font-weight:700;font-size:18px;color:#999;margin-top:40px;}
  footer{text-align:center;margin-top:40px;font-family:'Heebo';font-weight:700;font-size:13px;color:#9A9AA8;}

  .studyrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding-top:12px;border-top:2px dashed var(--purp);}
  .studylink{font-family:'Heebo';font-weight:800;font-size:14px;background:var(--purpf);color:var(--purp);
    border:3px solid var(--purp);border-radius:14px;padding:8px 14px;box-shadow:2px 2px 0 var(--ink);min-height:40px;}
  .studylink:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);}
  @keyframes flash{0%{box-shadow:0 0 0 4px var(--yel);}100%{box-shadow:4px 4px 0 var(--ink);}}
  .flash{animation:flash 1.2s ease;}

  /* ===== Accessibility toolbar + Text-to-Speech ===== */
  .a11y-fab{position:fixed;bottom:18px;left:18px;z-index:200;width:58px;height:58px;border-radius:50%;
    background:var(--purp);color:#fff;border:4px solid var(--ink);box-shadow:3px 3px 0 var(--ink);
    font-size:27px;display:flex;align-items:center;justify-content:center;transition:bottom .2s;}
  .a11y-fab:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);}
  .a11y-panel{position:fixed;bottom:86px;left:18px;z-index:200;background:#fff;border:4px solid var(--ink);
    border-radius:18px;box-shadow:var(--shadow);padding:14px;width:280px;max-width:calc(100vw - 36px);display:none;transition:bottom .2s;}
  .a11y-panel.open{display:block;}
  .a11y-panel h4{font-family:'Heebo';font-weight:800;font-size:16px;margin-bottom:12px;text-align:center;}
  .a11y-row{margin-bottom:13px;}
  .a11y-row .lbl{font-family:'Heebo';font-weight:700;font-size:13px;margin-bottom:6px;display:block;}
  .a11y-btns{display:flex;gap:6px;flex-wrap:wrap;}
  .a11y-btns button{flex:1;min-width:54px;min-height:42px;font-family:'Heebo';font-weight:800;font-size:14px;
    background:var(--cream);border:3px solid var(--ink);border-radius:12px;box-shadow:2px 2px 0 var(--ink);padding:6px;}
  .a11y-btns button.on{background:var(--yel);}
  .a11y-btns button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);}
  input[type=range].a11y-range{width:100%;accent-color:var(--purp);height:28px;}

  .readbtn{flex:none;width:36px;height:36px;border-radius:10px;background:var(--yel);border:3px solid var(--ink);
    display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:2px 2px 0 var(--ink);}
  .readbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);}
  .q-readbtn{margin-bottom:10px;font-family:'Heebo';font-weight:800;font-size:14px;background:var(--tealf);color:var(--ink);
    border:3px solid var(--teal);border-radius:12px;padding:8px 13px;box-shadow:2px 2px 0 var(--ink);
    display:inline-flex;align-items:center;gap:6px;min-height:42px;}
  .q-readbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);}
  .q-readbtn-q{margin-top:10px;margin-bottom:0;background:var(--yelf);border-color:var(--coral);}

  .tts-reading{outline:4px solid var(--purp);outline-offset:3px;border-radius:10px;background:var(--purpf)!important;}

  .tts-bar{position:fixed;left:0;right:0;bottom:0;z-index:210;background:var(--ink);color:#fff;
    padding:10px 14px;display:none;align-items:center;gap:10px;box-shadow:0 -3px 0 var(--purp);}
  .tts-bar.open{display:flex;}
  .tts-bar button{width:46px;height:46px;border-radius:12px;border:3px solid #fff;background:transparent;color:#fff;font-size:19px;flex:none;}
  .tts-bar button:active{background:rgba(255,255,255,.15);}
  .tts-bar .tts-txt{flex:1;font-family:'Heebo';font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  body.tts-on .a11y-fab{bottom:90px;}
  body.tts-on .a11y-panel{bottom:158px;}

  /* dyslexia-friendly spacing toggle */
  body.a11y-spacing .sec p,body.a11y-spacing .sec li,body.a11y-spacing .a-inner p,
  body.a11y-spacing .q-text,body.a11y-spacing .part,body.a11y-spacing .mc-q,body.a11y-spacing .mc-ans .opt,
  body.a11y-spacing .q-text p,body.a11y-spacing ul.mc-q-opts li,
  body.a11y-spacing .bagrut span,body.a11y-spacing .tip span{
    line-height:2.05!important;letter-spacing:.4px;word-spacing:2px;}
  /* clean background toggle */
  body.a11y-plainbg{background-image:none!important;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="badge">מדעי התזונה · שאלון 798381</span>
    <h1>סיכום ושאלות — הכול במקום אחד</h1>
  </header>

  <div class="modeswitch">
    <button class="modebtn active" id="btnSummary" onclick="setMode('summary')">📖 סיכום</button>
    <button class="modebtn" id="btnQuestions" onclick="setMode('questions')">🎓 שאלות</button>
  </div>

  <div class="controls">
    <div class="search-box"><span class="ic">🔍</span><input id="search" type="text" placeholder="חיפוש..."></div>
    <div class="navchips" id="navchips"></div>
    <div class="navchips typechips" id="typechips"></div>
    <div class="count" id="count"></div>
  </div>

  <div class="view active" id="view-summary"><div id="summaryContent"></div></div>
  <div class="view" id="view-questions"><div id="questionsContent"></div></div>
  <div class="noresults" id="noresults" style="display:none;">לא נמצאו תוצאות 🤔</div>

  <footer>ממעבדת הניסויים של מרי גרבי · מדעי התזונה 798381</footer>
</div>

<!-- ===== Accessibility toolbar ===== -->
<button class="a11y-fab" id="a11yFab" title="נגישות והקראה" aria-label="פתיחת תפריט נגישות והקראה">♿</button>
<div class="a11y-panel" id="a11yPanel" role="dialog" aria-label="נגישות והקראה">
  <h4>נגישות והקראה 🔊</h4>
  <div class="a11y-row">
    <span class="lbl">גודל טקסט</span>
    <div class="a11y-btns">
      <button id="fontMinus" aria-label="הקטנת טקסט">A−</button>
      <button id="fontReset" aria-label="גודל רגיל">100%</button>
      <button id="fontPlus" aria-label="הגדלת טקסט">A+</button>
    </div>
  </div>
  <div class="a11y-row">
    <span class="lbl">קריאה נוחה</span>
    <div class="a11y-btns">
      <button id="tglSpacing" aria-pressed="false">📏 ריווח</button>
      <button id="tglBg" aria-pressed="false">🌫️ רקע נקי</button>
    </div>
  </div>
  <div class="a11y-row">
    <span class="lbl">מהירות הקראה: <span id="rateVal">1.0</span></span>
    <input type="range" class="a11y-range" id="rateRange" min="0.6" max="1.4" step="0.1" value="1" aria-label="מהירות הקראה">
  </div>
</div>
<div class="tts-bar" id="ttsBar" role="status" aria-live="polite">
  <button id="ttsToggle" title="השהה / המשך" aria-label="השהה או המשך הקראה">⏸</button>
  <button id="ttsStop" title="עצור הקראה" aria-label="עצירת הקראה">⏹</button>
  <div class="tts-txt" id="ttsTxt">קורא…</div>
</div>

<script>
/* ===== DATA ===== */
/* order follows the summary chapters, so both modes read the same way */
const TOPICS={"intro": {"name": "מבוא / פירמידה / תווית", "emoji": "🍽️"}, "digest": {"name": "מערכת העיכול", "emoji": "🦷"}, "carbs": {"name": "פחמימות", "emoji": "🍞"}, "protein": {"name": "חלבונים", "emoji": "🥚"}, "fat": {"name": "שומנים", "emoji": "🥑"}, "vit": {"name": "ויטמינים", "emoji": "🍊"}, "min": {"name": "מינרלים", "emoji": "🧂"}, "water": {"name": "מים", "emoji": "💧"}, "energy": {"name": "אנרגיה", "emoji": "⚡"}, "life": {"name": "מעגל החיים", "emoji": "🤰"}, "sport": {"name": "פעילות גופנית", "emoji": "🏃"}};
const TYPES={"open": "שאלה פתוחה", "mc": "רב-ברירה", "table": "טבלה", "term": "הסבר מונח"};
const Q=[{"topics": ["carbs"], "ty": "open", "y": "תשע\"ח 2018", "q": "<p><b>א. סוכרים</b> — השלימו את הטבלה לשלוש קבוצות סוכרים (חד / דו / רב):</p><table class=\"bg empty\"><tr><th>קבוצה</th><th>דוגמה</th><th>מסיסות במים</th><th>מקור מזון</th><th>טעם</th><th>השפעה על רמת הסוכר בדם</th></tr><tr><td>חד-סוכר</td><td>x</td><td>x</td><td>x</td><td>x</td><td>x</td></tr><tr><td>דו-סוכר</td><td>x</td><td>x</td><td>x</td><td>x</td><td>x</td></tr><tr><td>רב-סוכר</td><td>x</td><td>x</td><td>x</td><td>x</td><td>x</td></tr></table><p><b>ב.</b> הסבירו מהו אינדקס גליקמי.</p>", "ans": "<p><b>א. טבלה מלאה:</b></p><table class=\"bg\"><tr><th>קבוצה</th><th>דוגמה</th><th>מסיסות</th><th>מקור</th><th>טעם</th><th>השפעה על הסוכר</th></tr><tr><td>חד-סוכר</td><td>גלוקוז</td><td>מסיס</td><td>צומח</td><td>מתוק</td><td>מהירה</td></tr><tr><td>דו-סוכר</td><td>סוכרוז</td><td>מסיס</td><td>צומח/חי</td><td>מתוק</td><td>מהירה</td></tr><tr><td>רב-סוכר</td><td>עמילן</td><td>לא מסיס</td><td>צומח</td><td>לא מתוק</td><td>איטית</td></tr></table><p><b>ב. אינדקס גליקמי</b> = מדד למהירות שבה הפחמימה מעלה את רמת הסוכר בדם. רב-סוכרים מתאפיינים באינדקס נמוך.</p>", "html": true}, {"topics": ["carbs"], "ty": "open", "y": "תשפ\"ב 2022 · תשע\"ז 2017", "q": "<p><b>א.</b> לאיזו קבוצת פחמימות שייכים הסיבים התזונתיים?</p><p><b>ב.</b> ציינו שני מזונות המכילים סיבים, והסבירו את חשיבותם לגוף.</p>", "ans": "<p><b>א.</b> הסיבים שייכים ל<b>פחמימות מורכבות (רב-סוכרים)</b>.</p><p><b>ב.</b> מזונות: דגנים מלאים, ירקות, קטניות.<br>חשיבות: שמירה על תקינות מערכת העיכול, מניעת עצירות, תחושת שובע, והאטת ספיגת הסוכר והכולסטרול לדם.</p>", "html": true}, {"topics": ["carbs"], "ty": "open", "y": "תש\"ף 2020", "q": "<p>ציינו את שתי קבוצות הסיבים התזונתיים והסבירו את תפקיד כל אחת.</p>", "ans": "<p><b>מסיסים במים (פקטין):</b> סופחים כולסטרול וסוכר ומאטים את ספיגתם.</p><p><b>לא מסיסים (תאית, סובין, ליגנין):</b> ממריצים את מערכת העיכול ומונעים עצירות.</p>", "html": true}, {"topics": ["carbs"], "ty": "open", "y": "תשפ\"ג 2023 · תשפ\"ב 2022 · תשע\"ט 2019", "q": "<p><b>א.</b> הסבירו מהו אינדקס גליקמי.</p><p><b>ב.</b> ציינו שלוש דוגמאות למזון בעל אינדקס גבוה ושתיים בעל אינדקס נמוך.</p><p><b>ג.</b> מדוע בשר וביצים בעלי אינדקס נמוך מאוד?</p>", "ans": "<p><b>א.</b> אינדקס גליקמי = מדד למהירות העלאת הסוכר בדם.</p><p><b>ב. גבוה:</b> לחם לבן, תפוח אדמה מבושל, אורז לבן, סוכר.<br><b>נמוך:</b> קטניות, דגנים מלאים, ירקות.</p><p><b>ג.</b> בשר וביצים כמעט אינם מכילים פחמימות, ולכן כמעט אינם משפיעים על רמת הסוכר (אינדקס ~0).</p>", "html": true}, {"topics": ["carbs"], "ty": "open", "y": "תשע\"ט 2019", "q": "<p><b>א.</b> ציינו פחמימה מורכבת שמקורה במזון, ופחמימה מורכבת המיוצרת בגוף.</p><p><b>ב.</b> ציינו פחמימה שאינה מתעכלת בגוף והסבירו מדוע מומלץ לצרוך אותה.</p>", "ans": "<p><b>א.</b> מהמזון: <b>עמילן</b>. בגוף: <b>גליקוגן</b>.</p><p><b>ב.</b> שאינה מתעכלת: <b>תאית (סיבים)</b> — מומלצת כי היא שומרת על תקינות מערכת העיכול ומונעת עצירות.</p>", "html": true}, {"topics": ["carbs"], "ty": "open", "y": "תשפ\"ד 2024", "q": "<p><b>א.</b> איזו פחמימה אינה מתעכלת בגוף ומהי חשיבותה?</p><p><b>ב.</b> ציינו שלושה מזונות המכילים אותה, ושני חסרונות של צריכה מוגברת.</p>", "ans": "<p><b>א. סיבים תזונתיים (תאית).</b> חשיבות: עיכול תקין.</p><p><b>ב.</b> מזונות: דגנים מלאים, ירקות, קטניות.<br>חסרונות בעודף: פגיעה בספיגת מינרלים (ברזל/סידן), נפיחות וגזים.</p>", "html": true}, {"topics": ["carbs"], "ty": "open", "y": "תשפ\"א 2021", "q": "<p><b>א.</b> הסבירו את תהליך הנשימה התאית (מגיבים ותוצרים).</p><p><b>ב.</b> לאיזו קבוצת פחמימות שייכת התאית, וציינו שני מקורות שלה.</p>", "ans": "<p><b>א.</b> נשימה תאית: <b>גלוקוז + חמצן → אנרגיה (ATP) + פחמן דו-חמצני + מים.</b></p><p><b>ב.</b> תאית = רב-סוכר. מקורות: ירקות, דגנים מלאים, קטניות.</p>", "html": true}, {"topics": ["carbs", "fat", "energy"], "ty": "open", "y": "תשפ\"ו 2026", "q": "<p><b>א. חומרי תשמורת</b> — הגדירו את המונח ותפקידו.</p><p><b>ב.</b> איזה חומר (שומן או גליקוגן) משמש בפעילות אירובית אינטנסיבית?</p><p><b>ג.</b> מדוע עמילן אינו יכול לשמש חומר תשמורת בגוף האדם?</p>", "ans": "<p><b>א. חומר תשמורת</b> = מאגר אנרגיה לשעת הצורך.</p><p><b>ב.</b> בפעילות אירובית אינטנסיבית משמש ה<b>גליקוגן</b> (זמין ומתפרק מהר לאנרגיה).</p><p><b>ג.</b> עמילן הוא חומר תשמורת של הצמח; האדם מפרק אותו לגלוקוז ואינו אוגר אותו כעמילן.</p>", "html": true}, {"topics": ["carbs"], "ty": "open", "y": "תשפ\"ו 2026", "q": "<p><b>א.</b> איזה רכיב תזונתי מצוי בכמות גבוהה בלחם מקמח מלא לעומת לבן? ציינו שלושה יתרונות שלו.</p><p><b>ב.</b> מהו הרכיב שמסמיך דייסת שיבולת שועל?</p>", "ans": "<p><b>א.</b> הרכיב: <b>סיבים תזונתיים.</b> יתרונות: עיכול תקין, תחושת שובע, האטת ספיגת סוכר/כולסטרול.</p><p><b>ב.</b> המסמיך את הדייסה: סיב מסיס (בטא-גלוקן).</p>", "html": true}, {"topics": ["carbs"], "ty": "open", "y": "תשפ\"ד 2024 · תשע\"ט 2019", "q": "<p><b>א. סוכרת</b> — בסוכרת סוג 1 חסר הורמון. ציינו את שמו ואת האיבר המפריש אותו, ושתי המלצות אורח חיים.</p><p><b>ב.</b> מדוע חשוב לחולה להכיר את המדד הגליקמי?</p>", "ans": "<p><b>א.</b> ההורמון: <b>אינסולין</b>, המופרש מה<b>לבלב</b>. המלצות: תזונה מאוזנת דלת סוכר פשוט, פעילות גופנית, ניטור סוכר.</p><p><b>ב.</b> הכרת המדד הגליקמי עוזרת לבחור מזון שלא יקפיץ את הסוכר בדם.</p>", "html": true}, {"topics": ["carbs"], "ty": "mc", "y": "תשפ\"ד 2024", "q": "<p>מאילו יסודות מורכבות הפחמימות?</p><ul class=\"mc-q-opts\"><li>1. גופרית, פחמן, מימן</li><li>2. פחמן, מימן, חנקן</li><li>3. פחמן, מימן, חמצן</li><li>4. פחמן, חמצן, חנקן</li></ul>", "ans": "<p>תשובה נכונה: <b>3. פחמן, מימן, חמצן</b></p>", "html": true}, {"topics": ["carbs"], "ty": "mc", "y": "תש\"ף 2020 · תשפ\"ד 2024", "q": "<p>ממה מורכב עמילן?</p><ul class=\"mc-q-opts\"><li>1. מולקולות גלוקוז</li><li>2. גליצרול</li><li>3. חומצות אמיניות</li><li>4. פרוקטוז</li></ul>", "ans": "<p>תשובה נכונה: <b>1. מולקולות גלוקוז</b></p>", "html": true}, {"topics": ["carbs"], "ty": "mc", "y": "תשע\"ח 2018 · תשפ\"ב 2022", "q": "<p>מהו סוכרוז (סוכר לבן)?</p><ul class=\"mc-q-opts\"><li>1. חד-סוכר</li><li>2. דו-סוכר</li><li>3. רב-סוכר</li><li>4. סיב תזונתי</li></ul>", "ans": "<p>תשובה נכונה: <b>2. דו-סוכר</b></p>", "html": true}, {"topics": ["carbs"], "ty": "mc", "y": "תשפ\"ג 2023", "q": "<p>מה מהבאים הוא דו-סוכר?</p><ul class=\"mc-q-opts\"><li>1. חלבון</li><li>2. סוכרזית</li><li>3. לקטוז</li><li>4. גלוטן</li></ul>", "ans": "<p>תשובה נכונה: <b>3. לקטוז</b></p>", "html": true}, {"topics": ["carbs"], "ty": "mc", "y": "תש\"ף 2020 · תשפ\"ב 2022", "q": "<p>באיזה סעיף מופיעות רק פחמימות מורכבות?</p><ul class=\"mc-q-opts\"><li>1. גלוקוז, עמילן, תאית</li><li>2. עמילן, גליקוגן, תאית</li><li>3. גלוקוז, פרוקטוז, סוכרוז</li><li>4. לקטוז, מלטוז, עמילן</li></ul>", "ans": "<p>תשובה נכונה: <b>2. עמילן, גליקוגן, תאית</b></p>", "html": true}, {"topics": ["carbs"], "ty": "mc", "y": "תשע\"ט 2019 · תשפ\"א 2021 · תשפ\"ב 2022", "q": "<p>מדוע מומלץ להמעיט בצריכת פחמימות פשוטות?</p><ul class=\"mc-q-opts\"><li>1. הן מתוקות מדי</li><li>2. ערכן התזונתי נמוך (\"קלוריות ריקות\")</li><li>3. קשות לעיכול</li><li>4. אינן מספקות אנרגיה</li></ul>", "ans": "<p>תשובה נכונה: <b>2. ערכן התזונתי נמוך (\"קלוריות ריקות\")</b></p>", "html": true}, {"topics": ["carbs"], "ty": "mc", "y": "תשפ\"ו 2026", "q": "<p>צריכה של איזה מזון תגרום לעלייה מהירה ברמת הסוכר בדם?</p><ul class=\"mc-q-opts\"><li>1. לחם שיפון</li><li>2. עדשים מבושלות</li><li>3. פירה תפוחי אדמה</li><li>4. חזה עוף</li></ul>", "ans": "<p>תשובה נכונה: <b>3. פירה תפוחי אדמה</b></p>", "html": true}, {"topics": ["carbs"], "ty": "mc", "y": "תשפ\"ו 2026", "q": "<p>מדוע צריכה עודפת של סיבים תזונתיים עלולה להזיק?</p><ul class=\"mc-q-opts\"><li>1. גורמים לעלייה חדה בסוכר</li><li>2. הופכים לשומן טראנס</li><li>3. קושרים מינרלים (ברזל/סידן) ומונעים את ספיגתם</li><li>4. מונעים העברת ויטמין D</li></ul>", "ans": "<p>תשובה נכונה: <b>3. קושרים מינרלים (ברזל/סידן) ומונעים את ספיגתם</b></p>", "html": true}, {"topics": ["carbs"], "ty": "mc", "y": "תשפ\"ו 2026", "q": "<p>איזה מזון מכיל את הכמות הגבוהה ביותר של פחמימות?</p><ul class=\"mc-q-opts\"><li>1. חלב פרה</li><li>2. ביצי חופש</li><li>3. דגי סלמון</li><li>4. חזה עוף</li></ul>", "ans": "<p>תשובה נכונה: <b>1. חלב פרה</b></p>", "html": true}, {"topics": ["carbs"], "ty": "mc", "y": "תשפ\"ד 2024", "q": "<p>מהו תפקיד הגלוקוז בגוף?</p><ul class=\"mc-q-opts\"><li>1. בניית רקמות</li><li>2. אספקת אנרגיה לתהליכי החיים</li><li>3. הובלת חמצן</li><li>4. קרישת דם</li></ul>", "ans": "<p>תשובה נכונה: <b>2. אספקת אנרגיה לתהליכי החיים</b></p>", "html": true}, {"topics": ["carbs"], "ty": "mc", "y": "תשע\"ט 2019", "q": "<p>איזו פחמימה אינה מסיסה במים?</p><ul class=\"mc-q-opts\"><li>1. גלוקוז</li><li>2. גליקוגן</li><li>3. פרוקטוז</li><li>4. סוכרוז</li></ul>", "ans": "<p>תשובה נכונה: <b>2. גליקוגן</b></p>", "html": true}, {"topics": ["carbs"], "ty": "mc", "y": "תשפ\"ה 2025", "q": "<p>מהו המקור העיקרי לגלוקוז בגוף?</p><ul class=\"mc-q-opts\"><li>1. חלבונים</li><li>2. שומנים</li><li>3. פחמימות</li><li>4. ויטמינים</li></ul>", "ans": "<p>תשובה נכונה: <b>3. פחמימות</b></p>", "html": true}, {"topics": ["carbs", "digest"], "ty": "mc", "y": "תש\"ף 2020", "q": "<p>איזה חומר אינו מתעכל בקיבה ובמעי?</p><ul class=\"mc-q-opts\"><li>1. לקטוז</li><li>2. עמילן</li><li>3. תאית</li><li>4. חלבון</li></ul>", "ans": "<p>תשובה נכונה: <b>3. תאית</b></p>", "html": true}, {"topics": ["carbs"], "ty": "mc", "y": "תשע\"ח 2018 · תשפ\"ב 2022", "q": "<p>מהו הטיפול המיידי לאדם עם רמת סוכר נמוכה בדם (היפוגליקמיה)?</p><ul class=\"mc-q-opts\"><li>1. מתן מזון או משקה המכילים סוכר</li><li>2. מתן מים בלבד</li><li>3. מנוחה ללא אוכל</li><li>4. הזרקת אינסולין</li></ul>", "ans": "<p>תשובה נכונה: <b>1. מתן מזון או משקה המכילים סוכר</b></p>", "html": true}, {"topics": ["protein"], "ty": "open", "y": "תשע\"ח 2018", "q": "<p><b>א.</b> ציינו שלושה תפקידים של החלבונים בגוף.</p><p><b>ב.</b> הסבירו מהו חלבון מלא וציינו שני מזונות המכילים אותו.</p>", "ans": "<p><b>א.</b> תפקידים: בנייה וחידוש תאים ורקמות, מרכיב באנזימים והורמונים, נוגדנים במערכת החיסון, מקור אנרגיה חלופי.</p><p><b>ב. חלבון מלא</b> = מכיל את כל חומצות האמינו החיוניות. מזונות: בשר, ביצים, דגים, מוצרי חלב.</p>", "html": true}, {"topics": ["protein"], "ty": "open", "y": "תשפ\"ד 2024", "q": "<p><b>א.</b> ציינו שני תפקידים של החלבונים.</p><p><b>ב.</b> הסבירו מהו חלבון מלא. האם עדשים לבדן מספקות חלבון מלא?</p>", "ans": "<p><b>א.</b> תפקידים: בנייה וחידוש רקמות, מרכיב באנזימים/הורמונים/נוגדנים.</p><p><b>ב.</b> חלבון מלא מכיל את כל חומצות האמינו החיוניות. עדשים לבדן <b>אינן</b> חלבון מלא (חסרות חלק מחומצות האמינו) — יש לשלב אותן עם דגן (אורז/לחם) כדי להשלים.</p>", "html": true}, {"topics": ["protein"], "ty": "open", "y": "תשפ\"ה 2025", "q": "<p><b>א.</b> ציינו שתי סיבות לחשיבות צריכת החלבונים.</p><p><b>ב.</b> כיצד מסולקים עודפי חלבון מהגוף, ואיזה איבר עלול להיפגע מצריכת יתר?</p>", "ans": "<p><b>א.</b> סיבות: בניית וחידוש רקמות, מרכיב באנזימים/הורמונים/מערכת החיסון.</p><p><b>ב.</b> עודפים מפורקים בכבד ומסולקים דרך הכליות (בשתן). צריכת יתר ממושכת פוגעת ב<b>כליות</b>.</p>", "html": true}, {"topics": ["protein"], "ty": "open", "y": "תשפ\"ג 2023", "q": "<p><b>א.</b> הסבירו מהי חומצה אמינית ומהי חומצה אמינית חיונית.</p><p><b>ב.</b> ציינו שני מקורות מהחי ומקור אחד מהצומח לחומצות אמיניות חיוניות.</p>", "ans": "<p><b>א. חומצה אמינית</b> = אבן הבניין של החלבון. <b>חיונית</b> = הגוף אינו מסוגל לייצרה ולכן חייבים לקבלה מהמזון.</p><p><b>ב.</b> מהחי: בשר, ביצים, דגים, חלב. מהצומח: קטניות (בשילוב דגנים) או סויה.</p>", "html": true}, {"topics": ["protein"], "ty": "open", "y": "תשפ\"א 2021", "q": "<p><b>א.</b> הסבירו מהי חומצה אמינית חיונית. דרגו את המזונות הבאים לפי ערכם החלבוני: גבינה לבנה, סטייק, שעועית ירוקה.</p><p><b>ב.</b> הסבירו מהי דנטורציה וציינו שני גורמים לה.</p>", "ans": "<p><b>א.</b> חומצה חיונית = מתקבלת מהמזון בלבד. דירוג (גבוה→נמוך): סטייק → גבינה לבנה → שעועית ירוקה.</p><p><b>ב. דנטורציה</b> = שינוי המבנה המרחבי של החלבון. גורמים: חום, חומצה, ערבוב מכני.</p>", "html": true}, {"topics": ["protein"], "ty": "open", "y": "תשפ\"ג 2023", "q": "<p><b>א.</b> הסבירו מהי דנטורציה של חלבון ואת תהליך היווצרותה.</p><p><b>ב.</b> ציינו שני מזונות בעלי ערך חלבוני גבוה ושניים בעלי ערך נמוך.</p>", "ans": "<p><b>א.</b> דנטורציה = שינוי המבנה המרחבי של החלבון (למשל קרישת חלבון הביצה בטיגון). התכונות משתנות אך החלבון אינו \"נהרס\" כימית במובן של פירוק לחומצות אמינו.</p><p><b>ב.</b> ערך גבוה: בשר, ביצים. ערך נמוך: ירקות, פירות, דגנים.</p>", "html": true}, {"topics": ["protein"], "ty": "open", "y": "תשע\"ז 2017", "q": "<p><b>א.</b> הסבירו מהי חומצה אמינית חיונית.</p><p><b>ב.</b> כיצד טבעונים יכולים לספק לגופם חלבון מלא?</p>", "ans": "<p><b>א.</b> חומצה אמינית חיונית = חומצה שהגוף לא מייצר לבד ומתקבלת מהמזון בלבד.</p><p><b>ב.</b> טבעונים משלבים <b>קטנייה + דגן</b> (חומוס+טחינה, אורז+עדשים) בארוחה או במהלך היום — כל אחד משלים את חומצות האמינו החסרות בשני.</p>", "html": true}, {"topics": ["protein"], "ty": "mc", "y": "תשע\"ח 2018 · תשפ\"ד 2024", "q": "<p>מהו ההיגד הנכון לגבי חומצות אמיניות חיוניות?</p><ul class=\"mc-q-opts\"><li>1. מקורן במזון בלבד</li><li>2. הגוף מייצר אותן</li><li>3. הן רב-סוכרים</li><li>4. מצויות רק בצומח</li></ul>", "ans": "<p>תשובה נכונה: <b>1. מקורן במזון בלבד</b></p>", "html": true}, {"topics": ["protein"], "ty": "mc", "y": "תשע\"ט 2019", "q": "<p>מה מבדיל בין חלבונים שונים?</p><ul class=\"mc-q-opts\"><li>1. מספר, סוג וסדר חומצות האמינו</li><li>2. צבעם</li><li>3. מקורם בלבד</li><li>4. כמות הקלוריות</li></ul>", "ans": "<p>תשובה נכונה: <b>1. מספר, סוג וסדר חומצות האמינו</b></p>", "html": true}, {"topics": ["protein"], "ty": "mc", "y": "תשע\"ט 2019", "q": "<p>מה מאפיין חלבון שעבר דנטורציה?</p><ul class=\"mc-q-opts\"><li>1. הוא מתפרק לסוכרים</li><li>2. מתווספות לו חומצות אמינו</li><li>3. מבנהו המרחבי משתנה</li><li>4. הוא הופך לשומן</li></ul>", "ans": "<p>תשובה נכונה: <b>3. מבנהו המרחבי משתנה</b></p>", "html": true}, {"topics": ["protein"], "ty": "mc", "y": "תשפ\"א 2021", "q": "<p>איזו מולקולה מכילה חנקן?</p><ul class=\"mc-q-opts\"><li>1. גלוקוז</li><li>2. חומצה אמינית</li><li>3. חומצת שומן</li><li>4. גליצרול</li></ul>", "ans": "<p>תשובה נכונה: <b>2. חומצה אמינית</b></p>", "html": true}, {"topics": ["protein"], "ty": "mc", "y": "תשפ\"א 2021", "q": "<p>מה מאפיין חלבון שאינו מלא?</p><ul class=\"mc-q-opts\"><li>1. מקורו בחי</li><li>2. מקורו בעולם הצומח (לרוב)</li><li>3. מכיל את כל חומצות האמינו</li><li>4. עשיר בשומן</li></ul>", "ans": "<p>תשובה נכונה: <b>2. מקורו בעולם הצומח (לרוב)</b></p>", "html": true}, {"topics": ["protein"], "ty": "mc", "y": "תשפ\"ד 2024", "q": "<p>אכילת בשר בקר מספקת בעיקר:</p><ul class=\"mc-q-opts\"><li>1. פחמימות</li><li>2. חלבון לא מלא</li><li>3. חלבון מלא</li><li>4. סיבים</li></ul>", "ans": "<p>תשובה נכונה: <b>3. חלבון מלא</b></p>", "html": true}, {"topics": ["protein"], "ty": "mc", "y": "תשפ\"ה 2025", "q": "<p>מהו המקור הטוב ביותר לחלבון מלא?</p><ul class=\"mc-q-opts\"><li>1. ביצים</li><li>2. אורז</li><li>3. תפוח</li><li>4. שמן זית</li></ul>", "ans": "<p>תשובה נכונה: <b>1. ביצים</b></p>", "html": true}, {"topics": ["fat"], "ty": "open", "y": "תשע\"ח 2018 · תשפ\"ב 2022", "q": "<p><b>א.</b> מהו התהליך התעשייתי שבעקבותיו נוצר שומן טראנס? הביאו דוגמה לחומר המכיל אותו.</p><p><b>ב.</b> הסבירו מדוע לא מומלץ לצרוך שומן טראנס.</p>", "ans": "<p><b>א.</b> התהליך: <b>הידרוגנציה</b> (הקשיית שמן צמחי נוזלי לשומן מוצק ע\"י הוספת מימן). דוגמה: מרגרינה, מאפים תעשייתיים.</p><p><b>ב.</b> לא מומלץ כי הוא מעלה כולסטרול \"רע\" (LDL), מוריד \"טוב\" (HDL), ומגביר סיכון לטרשת עורקים ומחלות לב.</p>", "html": true}, {"topics": ["fat"], "ty": "open", "y": "תש\"ף 2020", "q": "<p><b>א.</b> ציינו שלושה תפקידים של שומנים.</p><p><b>ב.</b> הסבירו מהו שומן רווי ותנו שלושה מזונות, ומהו שומן בלתי-רווי ותנו שלושה מזונות.</p>", "ans": "<p><b>א.</b> תפקידים: מאגר אנרגיה, בידוד ושמירת חום, הגנה על איברים, מסיסות ויטמינים A,D,E,K, בניית קרום התא.</p><p><b>ב. רווי</b> (מוצק, לרוב מהחי): חמאה, בשר שמן, גבינה צהובה. <b>בלתי-רווי</b> (נוזלי, צומח/דגים): שמן זית, אבוקדו, אגוזים, סלמון.</p>", "html": true}, {"topics": ["fat"], "ty": "open", "y": "תשפ\"ה 2025", "q": "<p><b>א.</b> הבחינו בין חומצת שומן רוויה לבלתי-רוויה (דוגמה לכל אחת).</p><p><b>ב.</b> ציינו שלושה תפקידים של הכולסטרול בגוף.</p>", "ans": "<p><b>א.</b> רוויה = ללא קשרים כפולים (חמאה/בשר); בלתי-רוויה = עם קשר כפול (שמן זית/דגים).</p><p><b>ב.</b> כולסטרול: חומר מוצא להורמונים, מרכיב בקרום התא, בסיס לחומצות מרה ולוויטמין D.</p>", "html": true}, {"topics": ["fat"], "ty": "open", "y": "תשע\"ז 2017", "q": "<p><b>א.</b> מאילו יסודות כימיים מורכב השומן?</p><p><b>ב.</b> ציינו שני תפקידים של הכולסטרול.</p>", "ans": "<p><b>א.</b> יסודות: פחמן, מימן, חמצן.</p><p><b>ב.</b> כולסטרול: בניית הורמונים (כגון הורמוני מין), מרכיב חיוני בקרום התא.</p>", "html": true}, {"topics": ["fat"], "ty": "open", "y": "תשפ\"ד 2024", "q": "<p><b>א.</b> מהי כמות הכולסטרול בעדשים?</p><p><b>ב.</b> מדוע רמת LDL גבוהה מסוכנת?</p><p><b>ג.</b> כיצד נקראת דיאטה ללא כולסטרול כלל?</p>", "ans": "<p><b>א.</b> בעדשים יש <b>אפס</b> כולסטרול (כולסטרול מצוי רק במזון מהחי).</p><p><b>ב.</b> LDL גבוה שוקע בדפנות העורקים → יוצר רבדים → טרשת עורקים ומחלות לב.</p><p><b>ג.</b> דיאטה ללא כולסטרול = דיאטה <b>טבעונית</b>.</p>", "html": true}, {"topics": ["fat"], "ty": "mc", "y": "תשע\"ח 2018", "q": "<p>עלייה בתחלואה בטרשת העורקים קשורה לצריכה מוגברת של:</p><ul class=\"mc-q-opts\"><li>1. פחמימות</li><li>2. שומנים רוויים</li><li>3. סיבים</li><li>4. חלבונים</li></ul>", "ans": "<p>תשובה נכונה: <b>2. שומנים רוויים</b></p>", "html": true}, {"topics": ["fat"], "ty": "mc", "y": "תשע\"ח 2018 · תשפ\"ב 2022 · תשפ\"ד 2024", "q": "<p>מהו ההיגד הנכון לגבי כולסטרול?</p><ul class=\"mc-q-opts\"><li>1. הוא סוג של פחמימה</li><li>2. מצוי רק בצומח</li><li>3. משמש חומר מוצא לבניית הורמונים</li><li>4. אין לו תפקיד בגוף</li></ul>", "ans": "<p>תשובה נכונה: <b>3. משמש חומר מוצא לבניית הורמונים</b></p>", "html": true}, {"topics": ["fat"], "ty": "mc", "y": "תשפ\"א 2021", "q": "<p>למה משמשים השומנים בגוף?</p><ul class=\"mc-q-opts\"><li>1. הובלת חמצן</li><li>2. בניית הורמונים, קרום התא ורקמת בידוד</li><li>3. קרישת דם</li><li>4. ייצור נוגדנים</li></ul>", "ans": "<p>תשובה נכונה: <b>2. בניית הורמונים, קרום התא ורקמת בידוד</b></p>", "html": true}, {"topics": ["fat"], "ty": "mc", "y": "תש\"ף 2020", "q": "<p>איזה מזון עשיר באומגה 3?</p><ul class=\"mc-q-opts\"><li>1. חזה עוף</li><li>2. דג סלמון</li><li>3. לחם לבן</li><li>4. תפוח</li></ul>", "ans": "<p>תשובה נכונה: <b>2. דג סלמון</b></p>", "html": true}, {"topics": ["fat"], "ty": "mc", "y": "תשפ\"ה 2025", "q": "<p>מהו ההיגד הנכון לגבי שומן ושמן?</p><ul class=\"mc-q-opts\"><li>1. שניהם מוצקים בטמפ' החדר</li><li>2. שומן מוצק ושמן נוזלי בטמפ' החדר</li><li>3. שניהם נוזליים</li><li>4. אין ביניהם הבדל</li></ul>", "ans": "<p>תשובה נכונה: <b>2. שומן מוצק ושמן נוזלי בטמפ' החדר</b></p>", "html": true}, {"topics": ["fat"], "ty": "mc", "y": "תשפ\"ו 2026", "q": "<p>איזה מזון עשיר בחומצות שומן בלתי-רוויות?</p><ul class=\"mc-q-opts\"><li>1. חמאה</li><li>2. מרגרינה</li><li>3. שמן דגים</li><li>4. שומן כבש</li></ul>", "ans": "<p>תשובה נכונה: <b>3. שמן דגים</b></p>", "html": true}, {"topics": ["fat"], "ty": "mc", "y": "תשפ\"א 2021", "q": "<p>מהם גורמי הסיכון למחלות לב?</p><ul class=\"mc-q-opts\"><li>1. שתיית מים מרובה</li><li>2. עישון, תורשה, חוסר פעילות ומזון מתועש</li><li>3. צריכת ירקות</li><li>4. שינה מרובה</li></ul>", "ans": "<p>תשובה נכונה: <b>2. עישון, תורשה, חוסר פעילות ומזון מתועש</b></p>", "html": true}, {"topics": ["fat", "carbs"], "ty": "mc", "y": "תשפ\"א 2021 · תשפ\"ב 2022", "q": "<p>באיזה מזון יש הכי פחות קלוריות (ל-100 גרם)?</p><ul class=\"mc-q-opts\"><li>1. שמן זית</li><li>2. חמאה</li><li>3. סוכר לבן</li><li>4. שקדים</li></ul>", "ans": "<p>תשובה נכונה: <b>3. סוכר לבן</b> (הוא פחמימה - מספק 4 קלוריות לגרם, לעומת שומנים ושקדים שמספקים קרוב ל-9 קלוריות לגרם).</p>", "html": true}, {"topics": ["vit"], "ty": "open", "y": "תשע\"ח 2018", "q": "<p>ציינו שני תפקידים של ויטמין C ושלושה מזונות מהצומח העשירים בו.</p>", "ans": "<p>תפקידים: חיזוק מערכת החיסון, בניית קולגן, נוגד חמצון, סיוע בספיגת ברזל.</p><p>מזונות: פלפל (גמבה), פרי הדר, עגבנייה, קיווי.</p>", "html": true}, {"topics": ["vit"], "ty": "open", "y": "תשפ\"ג 2023 · תשע\"ז 2017", "q": "<p><b>א.</b> ציינו שני ויטמינים מסיסים במים ושניים מסיסים בשומן.</p><p><b>ב.</b> ציינו שלושה מקורות לוויטמין C.</p>", "ans": "<p><b>א.</b> מסיסים במים: <b>C, B</b>. מסיסים בשומן: <b>A, D, E, K</b>.</p><p><b>ב.</b> מקורות לוויטמין C: פלפל אדום, תפוז, לימון, עגבנייה, ברוקולי.</p>", "html": true}, {"topics": ["vit"], "ty": "open", "y": "תשפ\"א 2021", "q": "<p>ציינו שני ויטמינים שהגוף מסוגל לייצר, את תפקידם ואת מקורם הטבעי (בגוף).</p>", "ans": "<p><b>ויטמין D</b> — מיוצר בעור מקרינת שמש; מסייע בספיגת סידן למעי ובניית עצם.</p><p><b>ויטמין K</b> — מיוצר ע\"י חיידקי המעי הגס; חיוני למנגנון קרישת הדם.</p>", "html": true}, {"topics": ["vit"], "ty": "open", "y": "תשע\"ט 2019", "q": "<p><b>א.</b> באיזה תהליך מעורב ויטמין D ומהי חשיבותו?</p><p><b>ב.</b> ציינו שני מזונות המכילים אותו.</p>", "ans": "<p><b>א.</b> מעורב בתהליך ספיגת הסידן במעי. חשיבותו בבנייה ובריאות העצם.</p><p><b>ב.</b> מזונות: דגים שמנים, חלמון ביצה, חלב מועשר. (כאמור, גם נוצר בעור מחשיפה לשמש.)</p>", "html": true}, {"topics": ["vit"], "ty": "open", "y": "תש\"ף 2020", "q": "<p>ציינו שני ויטמינים מקבוצת B, מזון לכל אחד, את תפקידם ותופעה הנובעת ממחסור בויטמין זה.</p>", "ans": "<p><b>B1 (תיאמין)</b> — דגנים מלאים; חשוב למערכת העצבים; מחסור = מחלת בריברי.</p><p><b>B12</b> — מזון מהחי (בשר/חלב); חיוני לייצור כדוריות דם; מחסור = אנמיה ופגיעה עצבית.</p>", "html": true}, {"topics": ["vit"], "ty": "open", "y": "תשפ\"ו 2026", "q": "<p>ציינו שני תפקידים של ויטמין B12, שני תסמיני מחסור, ושני מקורות תזונתיים (ללא תוספי תזונה).</p>", "ans": "<p>תפקידים: ייצור תאי דם אדומים, תפקוד תקין של מערכת העצבים.</p><p>תסמיני מחסור: אנמיה, עייפות, נימול בגפיים, פגיעה בזיכרון.</p><p>מקורות: בשר, דגים, ביצים, מוצרי חלב (המקורות הם מהחי בלבד).</p>", "html": true}, {"topics": ["vit"], "ty": "mc", "y": "תשע\"ח 2018 · תש\"ף 2020", "q": "<p>למה גורם חסר בוויטמין A?</p><ul class=\"mc-q-opts\"><li>1. צפדינה</li><li>2. רככת</li><li>3. אנמיה</li><li>4. עיוורון לילה</li></ul>", "ans": "<p>תשובה נכונה: <b>4. עיוורון לילה</b></p>", "html": true}, {"topics": ["vit"], "ty": "mc", "y": "תשע\"ז 2017 · תשפ\"א 2021 · תשפ\"ה 2025", "q": "<p>חוסר באיזה ויטמין גורם למחלת הצפדינה (סקורבוט)?</p><ul class=\"mc-q-opts\"><li>1. ויטמין A</li><li>2. ויטמין C</li><li>3. ויטמין D</li><li>4. ויטמין K</li></ul>", "ans": "<p>תשובה נכונה: <b>2. ויטמין C</b></p>", "html": true}, {"topics": ["vit"], "ty": "mc", "y": "תשפ\"ה 2025", "q": "<p>איזה ויטמין חיוני לקרישת דם?</p><ul class=\"mc-q-opts\"><li>1. ויטמין A</li><li>2. ויטמין C</li><li>3. ויטמין D</li><li>4. ויטמין K</li></ul>", "ans": "<p>תשובה נכונה: <b>4. ויטמין K</b></p>", "html": true}, {"topics": ["vit"], "ty": "mc", "y": "תשפ\"ג 2023 · תשפ\"ו 2026", "q": "<p>איזה ויטמין מסיס במים?</p><ul class=\"mc-q-opts\"><li>1. ויטמין A</li><li>2. ויטמין C</li><li>3. ויטמין D</li><li>4. ויטמין K</li></ul>", "ans": "<p>תשובה נכונה: <b>2. ויטמין C</b></p>", "html": true}, {"topics": ["vit"], "ty": "mc", "y": "תשפ\"א 2021", "q": "<p>אילו ויטמינים מסיסים בשומן?</p><ul class=\"mc-q-opts\"><li>1. B, C</li><li>2. A, D, E, K</li><li>3. C, K</li><li>4. B, D</li></ul>", "ans": "<p>תשובה נכונה: <b>2. A, D, E, K</b></p>", "html": true}, {"topics": ["vit", "fat"], "ty": "mc", "y": "תשפ\"ו 2026", "q": "<p>איזה מזון מומלץ לצרוך כדי לסייע בספיגת ויטמין K בארוחה?</p><ul class=\"mc-q-opts\"><li>1. חזה עוף</li><li>2. תפוח אדמה</li><li>3. שמן זית</li><li>4. גבינה לבנה חצי אחוז</li></ul>", "ans": "<p>תשובה נכונה: <b>3. שמן זית</b> (ויטמין K מסיס בשומן ולכן זקוק לשומן כדי להיספג בגוף).</p>", "html": true}, {"topics": ["vit", "min"], "ty": "mc", "y": "תשפ\"ו 2026", "q": "<p>מהו תפקידו המרכזי של ויטמין D?</p><ul class=\"mc-q-opts\"><li>1. סיוע בספיגת סידן בקיבה</li><li>2. סיוע בספיגת סידן במעי</li><li>3. ייצור אנזימים בכבד</li><li>4. ייצור אנזימים בכליות</li></ul>", "ans": "<p>תשובה נכונה: <b>2. סיוע בספיגת סידן במעי</b></p>", "html": true}, {"topics": ["vit"], "ty": "mc", "y": "תשע\"ט 2019", "q": "<p>מהם אנטי-אוקסידנטים?</p><ul class=\"mc-q-opts\"><li>1. חומרים נוגדי חמצון</li><li>2. סוג של שומן</li><li>3. חומצות אמינו</li><li>4. מינרלים</li></ul>", "ans": "<p>תשובה נכונה: <b>1. חומרים נוגדי חמצון</b> (למשל ויטמין C וויטמין E).</p>", "html": true}, {"topics": ["vit"], "ty": "term", "y": "תשע\"ז 2017", "q": "<p>הסבירו את המונח: <b>רככת</b></p>", "ans": "<p>מחלת עצמות בילדים הנגרמת ממחסור בוויטמין D, דבר המוביל לפגיעה בספיגת הסידן ובבניית העצם (העצמות הופכות רכות ומתעקמות).</p>", "html": true}, {"topics": ["vit", "life"], "ty": "mc", "y": "תשפ\"ו 2026", "q": "<p>באיזו תקופה במעגל החיים יש חשיבות מיוחדת לצריכת חומצה פולית (ויטמין B9)?</p><ul class=\"mc-q-opts\"><li>1. היריון ולפני היריון</li><li>2. ינקות</li><li>3. ילדות מוקדמת</li><li>4. גיל ההתבגרות לגברים</li></ul>", "ans": "<p>תשובה נכונה: <b>1. היריון ולפני היריון</b> (למניעת מומים בתעלה העצבית של העובר).</p>", "html": true}, {"topics": ["min"], "ty": "open", "y": "תשע\"ח 2018 · תשפ\"ב 2022", "q": "<p><b>א.</b> ציינו שתי תקופות בחיים שבהן מומלץ לצרוך סידן בכמות גבוהה ונמקו.</p><p><b>ב.</b> ציינו שני גורמים הפוגעים בספיגת הסידן במעי.</p>", "ans": "<p><b>א.</b> תקופות: גיל ההתבגרות (בניית עצם מואצת), היריון והנקה, גיל שלישי (מניעת אוסטיאופורוזיס ובריחת סידן).</p><p><b>ב.</b> פוגעים בספיגה: עודף נתרן, עודף קפאין, מחסור בוויטמין D, צריכת אלכוהול מוגברת.</p>", "html": true}, {"topics": ["min"], "ty": "open", "y": "תשפ\"ד 2024", "q": "<p><b>א.</b> ציינו שתי מערכות בגוף התלויות בסידן לתפקודן התקין.</p><p><b>ב.</b> מדוע תינוקות זקוקים לסידן רב, ומדוע גם בני 60+?</p>", "ans": "<p><b>א.</b> מערכות: שלד/עצמות (חוזק מבני), שרירים (התכווצות), עצבים (העברת אותות), מערכת הדם (קרישה).</p><p><b>ב.</b> תינוקות — לשם גדילת עצם מהירה. בני 60+ — לשם מניעת ירידה בצפיפות העצם ואוסטיאופורוזיס.</p>", "html": true}, {"topics": ["min"], "ty": "open", "y": "תשע\"ז 2017", "q": "<p><b>א.</b> ציינו שני תפקידים של הסידן ואיזה ויטמין מסייע בספיגתו.</p><p><b>ב.</b> אילו שתי מחלות נגרמות ממחסור בסידן לאורך זמן?</p>", "ans": "<p><b>א.</b> תפקידים: בניית עצם ושן, התכווצות שריר. הוויטמין שמסייע הוא <b>ויטמין D</b>.</p><p><b>ב.</b> מחלות מחסור: רככת (אצל ילדים), אוסטיאופורוזיס / אוסטיאומלציה (במבוגרים).</p>", "html": true}, {"topics": ["min"], "ty": "open", "y": "תשפ\"ג 2023", "q": "<p>ציינו שלושה מינרלים החיוניים לגוף ומקור טבעי לכל אחד מהם.</p>", "ans": "<p><b>סידן</b> — מוצרי חלב / סרדינים.<br><b>ברזל</b> — בשר אדום / קטניות.<br><b>אשלגן</b> — בננה / עגבנייה.<br><b>מגנזיום</b> — אגוזים / ירקות ירוקים.</p>", "html": true}, {"topics": ["min"], "ty": "open", "y": "תשפ\"ה 2025", "q": "<p><b>א.</b> באילו תאים נמצא רוב הברזל בגוף, ומהו תפקידו המרכזי?</p><p><b>ב.</b> מדוע מחסור בברזל גורם לתחושת חולשה ועייפות?</p>", "ans": "<p><b>א.</b> רוב הברזל נמצא ב<b>תאי הדם האדומים</b> (בתוך חלבון ההמוגלובין). תפקידו: הובלת חמצן מהריאות לרקמות.</p><p><b>ב.</b> מחסור מוריד את כמות ההמוגלובין → פחות חמצן מגיע לרקמות (לשם הפקת אנרגיה) → גורם לחולשה, עייפות ואנמיה.</p>", "html": true}, {"topics": ["min"], "ty": "mc", "y": "תשפ\"ד 2024", "q": "<p>באיזה מזון יש את כמות הסידן הגבוהה ביותר?</p><ul class=\"mc-q-opts\"><li>1. חזה עוף</li><li>2. סרדינים (עם עצמות)</li><li>3. אורז לבן</li><li>4. תפוח עץ</li></ul>", "ans": "<p>תשובה נכונה: <b>2. סרדינים</b></p>", "html": true}, {"topics": ["min"], "ty": "mc", "y": "תשפ\"ד 2024", "q": "<p>איזה חומר/מינרל מהבאים אינו פוגע בספיגת הסידן?</p><ul class=\"mc-q-opts\"><li>1. נתרן (עודף מלח)</li><li>2. ברזל</li><li>3. קפאין</li><li>4. חומצה פיטית (בסובין)</li></ul>", "ans": "<p>תשובה נכונה: <b>2. ברזל</b></p>", "html": true}, {"topics": ["min"], "ty": "mc", "y": "תשפ\"ד 2024", "q": "<p>באיזה מזון יש את כמות הברזל הגבוהה ביותר?</p><ul class=\"mc-q-opts\"><li>1. חלב פרה</li><li>2. תפוח</li><li>3. לחם לבן</li><li>4. סטייק בקר</li></ul>", "ans": "<p>תשובה נכונה: <b>4. סטייק בקר</b></p>", "html": true}, {"topics": ["min"], "ty": "mc", "y": "תשפ\"ד 2024", "q": "<p>אדם עם רמת המוגלובין נמוכה בבדיקת דם — מהי הסיבה הסבירה?</p><ul class=\"mc-q-opts\"><li>1. בעיה בספיגה או בצריכת ברזל</li><li>2. עודף סידן</li><li>3. עודף ויטמין C</li><li>4. מחסור בשומן</li></ul>", "ans": "<p>תשובה נכונה: <b>1. בעיה בספיגה או בצריכת ברזל</b></p>", "html": true}, {"topics": ["min"], "ty": "mc", "y": "תשפ\"ג 2023", "q": "<p>על צריכת איזה מינרל יש להקפיד במיוחד בתפריט לגיל השלישי (למניעת שברים)?</p><ul class=\"mc-q-opts\"><li>1. נתרן</li><li>2. ברזל</li><li>3. סידן</li><li>4. אשלגן</li></ul>", "ans": "<p>תשובה נכונה: <b>3. סידן</b></p>", "html": true}, {"topics": ["min", "water"], "ty": "mc", "y": "תשפ\"ה 2025", "q": "<p>מדוע הזיעה מלוחה?</p><ul class=\"mc-q-opts\"><li>1. היא מכילה מינרלים (אלקטרוליטים, כגון נתרן)</li><li>2. בגלל הסוכר שמופרש</li><li>3. בגלל החלבונים</li><li>4. בגלל עודף שומן</li></ul>", "ans": "<p>תשובה נכונה: <b>1. היא מכילה מינרלים (אלקטרוליטים, כגון נתרן)</b></p>", "html": true}, {"topics": ["min"], "ty": "open", "y": "תשפ\"ד 2024 · תשע\"ז 2017", "q": "<p><b>א.</b> איזה מינרל מתאמנים צריכים להשלים בכמות מוגברת ומדוע?</p><p><b>ב.</b> איזה מינרל שחסר בגוף גורם לתופעת \"היתפסות\" שרירים וכיווצי שריר פתאומיים?</p>", "ans": "<p><b>א.</b> מתאמנים מאבדים בהזעה <b>נתרן ואשלגן (אלקטרוליטים)</b> — אשר חשובים לתפקוד שרירים ולמאזן נוזלים תקין. כמו כן הם זקוקים ל<b>ברזל</b> להובלת חמצן לשריר.</p><p><b>ב.</b> \"היתפסות\" שרירים (התכווצויות בלתי רצוניות) נגרמת לרוב ממחסור ב<b>מגנזיום</b> (האחראי על התכווצות והרפיית שריר) או באשלגן/נתרן.</p>", "html": true}, {"topics": ["min"], "ty": "term", "y": "תשע\"ז 2017", "q": "<p>הסבירו את המונח: <b>אנמיה</b></p>", "ans": "<p>מצב רפואי הנגרם לרוב ממחסור בברזל, ומוביל לירידה ברמת ההמוגלובין בתאי הדם האדומים. כתוצאה מכך ישנה ירידה ביכולת הדם להוביל חמצן לרקמות, מה שמתבטא בעייפות, חולשה וחיוורון.</p>", "html": true}, {"topics": ["water"], "ty": "open", "y": "תשע\"ח 2018 · תשפ\"ב 2022", "q": "<p><b>א.</b> הסבירו כיצד נשמר מאזן המים בגוף (דרכי קליטה ופליטה של מים).</p><p><b>ב.</b> ציינו ארבעה סימנים שמעידים על מחסור במים (התייבשות).</p>", "ans": "<p><b>א.</b> קליטה מתבצעת דרך: שתייה ישירה, מים במזון (כגון פירות/ירקות), ומים מטבוליים (תוצר של נשימה תאית). פליטה: מתבצעת דרך שתן, זיעה, נשימה וצואה.</p><p><b>ב.</b> סימני מחסור: תחושת צמא, יובש בפה, שתן כהה/מועט, עייפות, כאב ראש, סחרחורת.</p>", "html": true}, {"topics": ["water"], "ty": "open", "y": "תשפ\"ג 2023", "q": "<p><b>א.</b> ציינו שלוש פעילויות או תהליכים שבהם הגוף מאבד מים.</p><p><b>ב.</b> מדוע חשוב לשמור על מאזן מים תקין לאורך היום?</p>", "ans": "<p><b>א.</b> איבוד מתרחש בעת: הזעה (ויסות חום), מתן שתן, נשימה ופליטת אוויר לח.</p><p><b>ב.</b> מאזן תקין חיוני ל: העברת חומרים בדם, סביבה לתגובות כימיות, ויסות חום הגוף, סילוק פסולת ותפקוד תקין של כל תאי הגוף.</p>", "html": true}, {"topics": ["water"], "ty": "open", "y": "תשע\"ז 2017", "q": "<p><b>א.</b> ציינו שלושה תפקידים של המים בגוף.</p><p><b>ב.</b> ציינו שלושה מצבים בהם נדרשת לאדם שתייה מוגברת ביחס לשגרה.</p>", "ans": "<p><b>א.</b> תפקידים: ממס וסביבת תגובות כימיות, ויסות חום הגוף, הובלת חומרים (בדם) וסילוק רעלים.</p><p><b>ב.</b> שתייה מוגברת נדרשת בעת: מזג אוויר חם/קיץ, ביצוע פעילות גופנית עצימה, מחלה הכוללת חום/שלשול/הקאות (למניעת התייבשות).</p>", "html": true}, {"topics": ["water"], "ty": "open", "y": "תשפ\"ה 2025", "q": "<p>האם \"אתגר\" שתיית 5 ליטר מים בדקה עלול להיות מסוכן? נמקו את תשובתכם.</p>", "ans": "<p><b>כן — הוא מסוכן מאוד.</b> שתייה כזו עלולה לגרום ל<b>היפונתרמיה</b> (הרעלת מים — דילול דרסטי של ריכוז הנתרן בדם), אשר מובילה לבצקת מוחית, פרכוסים ואף מוות.</p>", "html": true}, {"topics": ["water"], "ty": "open", "y": "תשפ\"ד 2024", "q": "<p><b>א.</b> מדוע אחוז המים שונה בין גבר לאישה ששוקלים בדיוק אותו משקל?</p><p><b>ב.</b> ציינו שני תנאים יומיומיים לצריכת מים מוגברת.</p>", "ans": "<p><b>א.</b> לגבר יש בדרך כלל יותר מסת שריר (רקמת שריר היא עתירת מים - כ-75%), ולאישה יש באופן טבעי אחוז גבוה יותר של רקמת שומן (שהיא דלת מים) — ולכן אחוז המים הכולל בגופו של הגבר יהיה גבוה יותר.</p><p><b>ב.</b> תנאים: עבודה פיזית בחום, פעילות גופנית, וגם אצל נשים בתקופת הנקה.</p>", "html": true}, {"topics": ["water"], "ty": "open", "y": "תשפ\"ו 2026", "q": "<p><b>א.</b> ציינו שתי סכנות ממצב של התייבשות ממושכת.</p><p><b>ב.</b> האם המים הם חומר אורגני או אי-אורגני? האם הם מספקים אנרגיה (קלוריות)?</p>", "ans": "<p><b>א.</b> סכנות: כשל כלייתי, הלם, פגיעה בלתי הפיכה בתפקוד המוח ומוות.</p><p><b>ב.</b> מים הם חומר <b>אי-אורגני</b>. הם אינם מספקים קלוריות (אנרגיה) כלל.</p>", "html": true}, {"topics": ["water"], "ty": "mc", "y": "תשע\"ח 2018", "q": "<p>איזה היגד על מים <b>אינו</b> נכון?</p><ul class=\"mc-q-opts\"><li>1. שתיית מים בזמן ארוחה מזיקה לבריאות</li><li>2. המים מסייעים בוויסות חום הגוף</li><li>3. המים מובילים חומרים מומסים בדם</li><li>4. המים מסלקים פסולת דרך השתן</li></ul>", "ans": "<p>תשובה נכונה (ההיגד השגוי): <b>1. שתיית מים בזמן ארוחה מזיקה לבריאות</b></p>", "html": true}, {"topics": ["water"], "ty": "mc", "y": "תשפ\"ה 2025", "q": "<p>לאיזה אדם מבין הבאים אחוז המים הגבוה ביותר בגוף?</p><ul class=\"mc-q-opts\"><li>1. צעיר שרירי (בעל מסת שריר גבוהה ואחוז שומן נמוך)</li><li>2. קשיש בן 80</li><li>3. אדם עם עודף משקל ואחוז שומן גבוה</li><li>4. תינוק שמן</li></ul>", "ans": "<p>תשובה נכונה: <b>1. צעיר שרירי</b> (רקמת שריר אוגרת הרבה מים, בעוד שומן וזקנה מורידים את אחוז המים).</p>", "html": true}, {"topics": ["water"], "ty": "mc", "y": "תשפ\"ה 2025", "q": "<p>איזה תהליך גורם לאיבוד נוזלים שוטף וסמוי מגוף האדם?</p><ul class=\"mc-q-opts\"><li>1. אכילה</li><li>2. נשימה (פליטת אדי מים בנשיפה)</li><li>3. שינה רגועה בחדר ממוזג היטב ללא הזעה</li><li>4. קריאת ספר</li></ul>", "ans": "<p>תשובה נכונה: <b>2. נשימה</b></p>", "html": true}, {"topics": ["digest"], "ty": "open", "y": "תשפ\"ה 2025", "q": "<p>בנוגע למערכת העיכול:<br><b>א.</b> באיזה איבר מתבצע עיכול מכני וגם עיכול כימי מרכזי של חלבונים?<br><b>ב.</b> היכן מתחיל העיכול המכני של כלל המזונות?<br><b>ג.</b> היכן נמצא ריכוז החיידקים המייצרים ויטמין B12 ו-K?<br><b>ד.</b> באיזה חלק במעי נספגים רוב תוצרי העיכול והיכן נספגים מרבית המים?</p>", "ans": "<p><b>א.</b> עיכול חלבון (מכני+כימי): ב<b>קיבה</b> (באמצעות חומצה ואנזימים כמו פפסין).</p><p><b>ב.</b> העיכול המכני מתחיל ב<b>פה</b> (לעיסת השיניים).</p><p><b>ג.</b> חיידקי המעי מרוכזים ב<b>מעי הגס</b>.</p><p><b>ד.</b> המזון (תוצרי הפירוק) נספג ב<b>מעי הדק</b>, וספיגת המים העיקרית חזרה לגוף נעשית ב<b>מעי הגס</b>.</p>", "html": true}, {"topics": ["digest"], "ty": "mc", "y": "תשע\"ח 2018 · תשפ\"ב 2022", "q": "<p>היכן מתרחש עיכול מכני של המזון במערכת העיכול?</p><ul class=\"mc-q-opts\"><li>1. רק בפה</li><li>2. רק בקיבה</li><li>3. רק במעי</li><li>4. בפה, בקיבה, במעי הדק ובמעי הגס</li></ul>", "ans": "<p>תשובה נכונה: <b>4. בפה, בקיבה, במעי הדק ובמעי הגס</b> (לעיסה בפה, וערבול ותנועה פריסטלטית לאורך כל הצינור).</p>", "html": true}, {"topics": ["digest"], "ty": "mc", "y": "תשפ\"ג 2023", "q": "<p>היכן מתבצע פירוק מכני של המזון?</p><ul class=\"mc-q-opts\"><li>1. בקיבה</li><li>2. בחלל הפה</li><li>3. במעי הדק</li><li>4. בכבד</li></ul>", "ans": "<p>תשובה נכונה: <b>2. בחלל הפה</b></p>", "html": true}, {"topics": ["digest", "carbs"], "ty": "mc", "y": "תשפ\"א 2021", "q": "<p>איזה רכיב תזונתי מתחיל להתפרק כימית כבר בפה?</p><ul class=\"mc-q-opts\"><li>1. פחמימות (עמילן)</li><li>2. חלבונים</li><li>3. שומנים</li><li>4. ויטמינים</li></ul>", "ans": "<p>תשובה נכונה: <b>1. פחמימות (עמילן)</b> - ע\"י האנזים עמילאז הנמצא ברוק.</p>", "html": true}, {"topics": ["intro"], "ty": "open", "y": "תשע\"ז 2017", "q": "<p><b>א.</b> פירמידת המזון — מדוע הקומה העליונה (ממתקים ושתייה מתוקה) מופרדת משאר הקומות בפירמידה?</p><p><b>ב.</b> ציינו שני מסרים נוספים שאפשר ללמוד מהעיצוב בצורת פירמידה.</p>", "ans": "<p><b>א.</b> הקומה מופרדת כדי להדגיש שמזונות אלו אינם חיוניים תזונתית (\"קלוריות ריקות\") ומומלץ למעט בהם מאוד.</p><p><b>ב.</b> מסרים: (1) ככל שהקומה רחבה ונמוכה יותר — יש לצרוך ממנה יותר (כמו מים ודגנים). (2) חשיבות הגיוון התזונתי (כל קומה מייצגת קבוצה אחרת של מזון שיש לשלב).</p>", "html": true}, {"topics": ["intro"], "ty": "open", "y": "תשע\"ט 2019", "q": "<p><b>א.</b> מדוע מבנה ההמלצות התזונתיות מוצג דווקא בצורת פירמידה?</p><p><b>ב.</b> תארו את סדר הקומות בפירמידת המזון (מלמטה למעלה).</p>", "ans": "<p><b>א.</b> הפירמידה ממחישה באופן ויזואלי מינון: היא רחבה בבסיס (מזון שיש לצרוך בכמות גדולה ביום) וצרה בקודקוד (מזון שיש למעט בו).</p><p><b>ב.</b> קומות (מלמטה למעלה): מים → קבוצת הדגנים → ירקות ופירות → קבוצת החלבונים → קבוצת השומנים → ממתקים וחטיפים.</p>", "html": true}, {"topics": ["intro"], "ty": "open", "y": "תשפ\"ו 2026", "q": "<p><b>א. אבות המזון</b> — מיינו את המזונות הבאים לקבוצות: חזה עוף, אבוקדו, טחינה, חומוס, אורז מלא, טונה.</p><p><b>ב.</b> הסבירו מהו חלבון מלא, וציינו שני מזונות מהרשימה הנ\"ל (מהצומח) שביחד משלימים לחלבון מלא.</p>", "ans": "<p><b>א.</b><br>עתיר חלבון: חזה עוף, טונה.<br>עתיר שומן: אבוקדו, טחינה.<br>עתיר פחמימה: אורז מלא, חומוס.</p><p><b>ב.</b> חלבון מלא = מכיל את כל חומצות האמינו החיוניות. שילוב צמחי משלים (מגילת המזונות): <b>חומוס + אורז מלא</b> או <b>חומוס + טחינה</b> (קטנייה + זרע/דגן).</p>", "html": true}, {"topics": ["intro"], "ty": "open", "y": "תשע\"ח 2018", "q": "<p><b>א. תוויות מזון</b> — אם כתוב על מוצר \"ללא תוספת סוכר\", האם זה אומר שהמוצר נטול סוכרים לחלוטין? נמקו.</p><p><b>ב.</b> עיינו בתווית בה רשום 78 גרם פחמימות ל-100 גרם. כמה קלוריות מספקות הפחמימות ב-100 גרם מוצר?</p>", "ans": "<p><b>א.</b> לא בהכרח. משמעות ההצהרה היא שלא הוסיפו סוכר בתהליך הייצור, אך ייתכנו סוכרים טבעיים בחומרי הגלם (כמו סוכר הפירות ברכז פירות או לקטוז בחלב).</p><p><b>ב.</b> גרם פחמימה מספק 4 קלוריות. לכן: 78 גרם × 4 = <b>312 קלוריות</b> מופקות מהפחמימות.</p>", "html": true}, {"topics": ["intro"], "ty": "open", "y": "תשע\"ט 2019", "q": "<p><b>א.</b> בהתבוננות על תווית של קורנפלקס (המכיל רכז לתת שעורה), האם חולה צליאק יכול לצרוך אותו?</p><p><b>ב.</b> אילו מרכיבים בטבלת הערכים התזונתיים תורמים לערך הקלורי הכללי של המוצר?</p>", "ans": "<p><b>א. לא</b> — הקורנפלקס מכיל שעורה, ושעורה מכילה חלבון גלוטן, האסור לחולי צליאק ומזיק להם.</p><p><b>ב.</b> המרכיבים התורמים קלוריות הם אבות המזון המפיקים אנרגיה: <b>פחמימות, חלבונים ושומנים</b>.</p>", "html": true}, {"topics": ["intro"], "ty": "mc", "y": "תשע\"ח 2018", "q": "<p>מה אפשר ללמוד מפירמידת המזון החדשה?</p><ul class=\"mc-q-opts\"><li>1. רק על ויטמינים ומינרלים</li><li>2. על הכמות היחסית שיש לצרוך מכל קבוצת מזון ביום</li><li>3. על מחירי המזון ברשתות</li><li>4. על מספר הקלוריות המדויק בכל ארוחה</li></ul>", "ans": "<p>תשובה נכונה: <b>2. על הכמות היחסית שיש לצרוך מכל קבוצת מזון ביום</b></p>", "html": true}, {"topics": ["intro"], "ty": "mc", "y": "תשע\"ח 2018", "q": "<p>מהי ההגדרה של \"תפריט מאוזן\"?</p><ul class=\"mc-q-opts\"><li>1. תפריט המכיל את כל אבות המזון וסיבים, בהתאם לצורכי הגוף</li><li>2. תפריט ללא שומן כלל</li><li>3. תפריט המבוסס על פחמימות בלבד לאנרגיה</li><li>4. תפריט דל קלוריות לירידה במשקל בלבד</li></ul>", "ans": "<p>תשובה נכונה: <b>1. תפריט המכיל את כל אבות המזון וסיבים, בהתאם לצורכי הגוף</b></p>", "html": true}, {"topics": ["intro"], "ty": "mc", "y": "תש\"ף 2020", "q": "<p>מה מומלץ לגבי מזון בקודקוד הפירמידה?</p><ul class=\"mc-q-opts\"><li>1. לצרוך הרבה</li><li>2. לצמצם את צריכתו</li><li>3. לצרוך בכל ארוחה</li><li>4. להימנע לחלוטין</li></ul>", "ans": "<p>תשובה נכונה: <b>2. לצמצם את צריכתו</b></p>", "html": true}, {"topics": ["intro"], "ty": "mc", "y": "תש\"ף 2020", "q": "<p>כמה קלוריות מספקות 60 גרם פחמימות?</p><ul class=\"mc-q-opts\"><li>1. 120</li><li>2. 180</li><li>3. 240</li><li>4. 540</li></ul>", "ans": "<p>תשובה נכונה: <b>3. 240</b></p>", "html": true}, {"topics": ["intro"], "ty": "mc", "y": "תש\"ף 2020 · תשפ\"ב 2022 · תשפ\"ג 2023", "q": "<p>מה ניתן ללמוד מסדר הופעת המרכיבים (רשימת רכיבים) על גבי תווית מזון?</p><ul class=\"mc-q-opts\"><li>1. הם מסודרים לפי סדר אלפביתי</li><li>2. לפי הערך התזונתי (הבריא ביותר תחילה)</li><li>3. לפי הכמות במוצר, מהרכיב בעל הכמות הגדולה ביותר לקטן ביותר</li><li>4. לפי המחיר והעלות ליצרן</li></ul>", "ans": "<p>תשובה נכונה: <b>3. לפי הכמות במוצר, מהרכיב בעל הכמות הגדולה ביותר לקטן ביותר</b></p>", "html": true}, {"topics": ["sport", "carbs"], "ty": "open", "y": "תשפ\"ה 2025 · תשע\"ח 2018", "q": "<p>מדוע מומלץ לספורטאי לצרוך <b>פחמימות פשוטות</b> לפני או בזמן אימון אירובי עצים, ו<b>פחמימות מורכבות</b> לאחר האימון?</p>", "ans": "<p><b>לפני/בזמן אימון (פשוטות):</b> נספגות מהר בדם ומספקות אנרגיה זמינה ומידית לשרירים העובדים (למשל: תמר, בננה, משקה ספורט).</p><p><b>לאחר האימון (מורכבות):</b> מתפרקות לאט, מסייעות במילוי הדרגתי של מאגרי הגליקוגן בשרירים ובכבד לטווח הארוך, ומונעות נפילת סוכר (למשל: פסטה, אורז מלא).</p>", "html": true}, {"topics": ["sport"], "ty": "open", "y": "תשפ\"א 2021 · תשע\"ז 2017", "q": "<p><b>א.</b> מדוע ספורטאים זקוקים להקפיד על צריכת חלבונים לאחר אימון?</p><p><b>ב.</b> מהי חשיבות שתיית מים, ומהי חשיבות מינרל הברזל עבורם?</p>", "ans": "<p><b>א. חלבונים:</b> חיוניים לשיקום רקמות השריר שנהרסו קלות במאמץ, ולבניית מסת שריר חדשה.</p><p><b>ב. מים:</b> לוויסות חום הגוף (קירור דרך זיעה) ומניעת התייבשות שיכולה לפגוע בביצועים. <b>ברזל:</b> מרכיב בהמוגלובין, האחראי על הובלת חמצן בדם אל השרירים הפעילים.</p>", "html": true}, {"topics": ["sport"], "ty": "open", "y": "תשפ\"ד 2024", "q": "<p><b>א.</b> ציינו שתי סיבות לכך שפעילות גופנית קבועה מסייעת בהורדת משקל ושומן.</p><p><b>ב.</b> איזה מינרל שחסר בגוף גורם ל\"היתפסות\" וכיווץ שרירים כואב באמצע אימון?</p>", "ans": "<p><b>א.</b> (1) הפעילות דורשת אנרגיה וגורמת לשריפת קלוריות (ושומן) בזמן המאמץ. (2) היא בונה מסת שריר – שריר הוא רקמה פעילה מטבולית שמעלה את ה-BMR וצורכת יותר אנרגיה גם במנוחה.</p><p><b>ב.</b> המינרל: <b>מגנזיום</b>.</p>", "html": true}, {"topics": ["sport", "energy"], "ty": "open", "y": "תשפ\"ו 2026", "q": "<p><b>א.</b> מדוע נוצרת חומצה לקטית (חומצת חלב) בשרירים במהלך פעילות אירובית אינטנסיבית (כמו ריצת ספרינט)?</p><p><b>ב.</b> מדוע הצטברות החומצה נחשבת ל\"מנגנון הגנה\" של הגוף?</p>", "ans": "<p><b>א.</b> במאמץ קצר ואינטנסיבי מאד למערכת הדם אין מספיק זמן/יכולת לספק מספיק חמצן לשריר. לכן הגוף מפיק אנרגיה במסלול <b>נשימה אל-אווירנית</b> שתוצר הלוואי שלו הוא חומצה לקטית.</p><p><b>ב. \"מנגנון הגנה\":</b> הצטברות החומצה גורמת לירידת ה-pH בשריר, מה שמתבטא בתחושת שריפה, עייפות וכאב. זה מאלץ את הספורטאי להאט או לעצור, ובכך מונע נזק וקריעה של רקמת השריר מעומס יתר.</p>", "html": true}, {"topics": ["sport"], "ty": "mc", "y": "תשע\"ט 2019", "q": "<p>מהו הגורם הסביבתי/נשימתי החיוני ביותר להפקת אנרגיה בפעילות אירובית (כמו הליכה ממושכת)?</p><ul class=\"mc-q-opts\"><li>1. סוכר</li><li>2. חלבון</li><li>3. חמצן</li><li>4. מים</li></ul>", "ans": "<p>תשובה נכונה: <b>3. חמצן</b> (אשר נדרש לתהליך הנשימה התאית השלם להפקת אנרגיה במיטוכונדריה).</p>", "html": true}, {"topics": ["energy"], "ty": "open", "y": "תשע\"ז 2017 · תשפ\"ב 2022", "q": "<p><b>א.</b> ציינו שלוש פעילויות פיזיולוגיות שהגוף צורך עבורן אנרגיה (קלוריות) במצב של מנוחה מוחלטת.</p><p><b>ב.</b> מדוע בגיל ההתבגרות צריכת האנרגיה היומית הנדרשת גבוהה יותר מזו שבגיל השלישי (קשישים)?</p>", "ans": "<p><b>א.</b> במנוחה הגוף מוציא אנרגיה על תפקודי בסיס (BMR): נשימה (תנועת סרעפת), פעימות לב, שמירת חום הגוף, פעילות עצבית במוח ותפקוד הכליות.</p><p><b>ב.</b> בהתבגרות ישנם תהליכי גדילה מואצת, בניית שריר ועצם, ושינויים הורמונליים הדורשים הרבה אנרגיה, בנוסף לפעילות גופנית שבד\"כ רבה יותר בגיל זה. אצל קשישים יש אובדן מסת שריר וירידה בקצב המטבולי.</p>", "html": true}, {"topics": ["energy", "carbs", "fat"], "ty": "open", "y": "תשפ\"ה 2025", "q": "<p>ציינו את שני מקורות האנרגיה העיקריים של הגוף בפעילות גופנית, והשוו ביניהם מבחינת הערך הקלורי ומבחינת קצב שחרור האנרגיה.</p>", "ans": "<p><b>1. פחמימות (גלוקוז/גליקוגן):</b> מספקות 4 קלוריות לגרם. שחרור האנרגיה מהן הוא <b>מהיר</b> ולכן משמשות למאמץ עצים ומידי.</p><p><b>2. שומנים (חומצות שומן):</b> מספקים 9 קלוריות לגרם. שחרור האנרגיה מהם הוא <b>איטי</b>, ולכן הם משמשים כמאגר אנרגיה מרכזי לפעילות מתונה וממושכת.</p>", "html": true}, {"topics": ["energy"], "ty": "open", "y": "תשפ\"ו 2026", "q": "<p><b>א.</b> הסבירו מהו קצב חילוף החומרים הבסיסי (BMR) וציינו שלושה גורמים המשפיעים עליו.</p><p><b>ב.</b> כיצד תשפיע עלייה ניכרת במסת השריר של האדם על ה-BMR שלו?</p>", "ans": "<p><b>א. BMR</b> = כמות האנרגיה המינימלית הדרושה לגוף כדי לקיים את תפקודי הבסיס שלו במצב מנוחה. גורמים משפיעים: גיל, מין, הרכב הגוף (יחס שריר/שומן), שטח פנים (גובה/משקל).</p><p><b>ב.</b> עלייה במסת שריר תוביל ל<b>עלייה ב-BMR</b> (מכיוון שרקמת שריר צורכת יותר אנרגיה לתחזוקתה מאשר רקמת שומן, גם במנוחה).</p>", "html": true}, {"topics": ["energy"], "ty": "open", "y": "תשפ\"ה 2025", "q": "<p><b>א.</b> אילו שני פרמטרים גופניים משמשים לחישוב מדד מסת הגוף (BMI)?</p><p><b>ב.</b> האם ילד בן 10 ומבוגר בן 30 יכולים לקבל ערך BMI מספרי זהה? כיצד הוא יתפרש?</p>", "ans": "<p><b>א.</b> הפרמטרים הם <b>משקל וגובה</b> (הנוסחה: משקל בק\"ג חלקי גובה במטרים בריבוע).</p><p><b>ב. כן</b>, הם יכולים לקבל ערך מספרי זהה. אך אצל ילדים המשמעות שונה לחלוטין — לא בודקים את המספר עצמו אלא ממירים אותו ל<b>אחוזונים בעקומות גדילה</b> לפי גיל ומין, ולכן משמעות הערך (תקין/עודף) תהיה שונה.</p>", "html": true}, {"topics": ["energy"], "ty": "mc", "y": "תשפ\"א 2021", "q": "<p>אילו גורמים משפיעים על קצב חילוף החומרים הבסיסי (BMR)?</p><ul class=\"mc-q-opts\"><li>1. צבע העיניים וגובה</li><li>2. גיל, מגדר ויחס שריר/שומן בגוף</li><li>3. צבע השיער</li><li>4. מספר הארוחות הנאכלות ביום בלבד</li></ul>", "ans": "<p>תשובה נכונה: <b>2. גיל, מגדר ויחס שריר/שומן בגוף</b></p>", "html": true}, {"topics": ["life"], "ty": "open", "y": "תשפ\"א 2021", "q": "<p><b>א.</b> ציינו שלושה מזונות או משקאות שיש להמעיט בהם או להימנע מהם בתקופת היריון, והסבירו מדוע.</p><p><b>ב.</b> מדוע אישה מיניקה זקוקה לתזונה מאוזנת וקפדנית?</p>", "ans": "<p><b>א. להמעיט/להימנע:</b><br>- אלכוהול: עובר את השליה ופוגע בהתפתחות מוח העובר.<br>- קפאין מוגזם: עלול לגרום ללידה מוקדמת/משקל נמוך.<br>- דגים נאים/בשר נא/ביצים חיות: סכנת זיהום מחיידקי ליסטריה או סלמונלה, שמסוכנים לעובר.</p><p><b>ב.</b> תזונת האם קובעת במידה רבה את <b>איכות חלב האם</b>, שהוא המקור היחיד לרכיבי תזונה עבור התינוק היונק להתפתחותו התקינה.</p>", "html": true}, {"topics": ["life"], "ty": "open", "y": "תשפ\"ו 2026", "q": "<p><b>א.</b> ציינו שתי סכנות לעובר מצריכת אלכוהול בהיריון.</p><p><b>ב.</b> מדוע אסור לאישה הרה לאכול דגים נאים (סושי), ואילו למיניקה מותר?</p><p><b>ג.</b> מהי חשיבות מינרל הסידן לתינוק בשנה הראשונה?</p>", "ans": "<p><b>א. אלכוהול:</b> פגיעה בהתפתחות המוח והעצבים, פיגור גדילה ומומים מולדים (תסמונת האלכוהול העוברי - FAS).</p><p><b>ב. דגים נאים:</b> בהיריון יש סכנה לזיהום מחיידקי ליסטריה שחוצים את השליה ועלולים לגרום להפלה; בהנקה, החיידקים במערכת העיכול של האם אינם עוברים לחלב, ולכן הסיכון לתינוק מזערי והמזון מותר.</p><p><b>ג. סידן לתינוק:</b> חיוני לבנייה מהירה של עצמות השלד המתארך ולבקיעת שיניים.</p>", "html": true}, {"topics": ["life"], "ty": "open", "y": "תשפ\"ה 2025", "q": "<p><b>א. תזונה בינקות (טעימות)</b> — ציינו שתי סיבות לחשיפה הדרגתית של התינוק למזונות מוצקים חדשים (אחד בכל פעם).</p><p><b>ב.</b> מהי חשיבות הסידן והברזל להתפתחות התינוק?</p>", "ans": "<p><b>א. חשיפה הדרגתית:</b> (1) כדי לזהות בבירור ובקלות תגובות אלרגיות למזון ספציפי. (2) כדי לאפשר למערכת העיכול (שעדיין בשלה חלקית) להתרגל לעיכול מוצקים.</p><p><b>ב. סידן:</b> בניית עצמות ושיניים; <b>ברזל:</b> ייצור תאי דם אדומים, מניעת אנמיה, והתפתחות קוגניטיבית תקינה של המוח.</p>", "html": true}, {"topics": ["life"], "ty": "open", "y": "תשפ\"ד 2024 · תשפ\"ו 2026", "q": "<p><b>א. גיל שלישי</b> — ציינו שני שינויים גופניים ושני שינויים חברתיים/פסיכולוגיים האופייניים לגיל השלישי ומשפיעים על תזונת הקשיש.</p><p><b>ב.</b> מדוע עלול להיווצר בגיל זה מחסור בויטמין B12 גם אם צורכים אותו כראוי במזון?</p>", "ans": "<p><b>א.</b> גופניים: ירידה בחוש הטעם והריח (אוכל נהיה תפל), בעיות שיניים/לעיסה, ירידה בתנועתיות מערכת העיכול (עצירות).<br>חברתיים: בדידות (חוסר רצון לבשל לבד), ירידה בהכנסה (פנסיה) המקשה קניית מזון איכותי.</p><p><b>ב.</b> עם הגיל חלה לעתים קרובות <b>ירידה בחומציות הקיבה ובירידה בהפרשת ה\"גורם הפנימי\"</b>, שהם חיוניים לספיגת B12 למחזור הדם. לכן ישנה בעיית ספיגה, למרות צריכה תקינה.</p>", "html": true}, {"topics": ["life"], "ty": "open", "y": "תשפ\"א 2021 · תשפ\"ג 2023 · תש\"ף 2020", "q": "<p><b>א. צמחונות וטבעונות</b> — הסבירו את ההבדל בין שתי הדיאטות הללו.</p><p><b>ב.</b> על השלמה של אילו רכיבי תזונה יש להקפיד בדיאטה טבעונית?</p><p><b>ג.</b> ציינו יתרון תזונתי אחד וחיסרון תזונתי אחד של טבעונות.</p>", "ans": "<p><b>א.</b> צמחונות — לרוב נמנעים מאכילת בשר ודגים בלבד, אך מתירים אכילת ביצים וחלב. טבעונות — הימנעות מוחלטת מכל מזון או רכיב שמקורו בחי.</p><p><b>ב. להקפיד על:</b> חלבון מלא (ע\"י שילובי צומח), ברזל צמחי (וסיוע בספיגתו עם ויטמין C), סידן מן הצומח, וחובה לתסף ויטמין B12 (שאינו קיים בצומח).</p><p><b>ג.</b> יתרון: הפחתה דרסטית בצריכת שומן רווי וכולסטרול (מניעת מחלות לב). חיסרון: סיכון מוגבר לאנמיה (מחסור ב-B12 וברזל) וצורך בתכנון קפדני של התפריט.</p>", "html": true}, {"topics": ["life"], "ty": "open", "y": "תש\"ף 2020 · תשפ\"ב 2022 · תשפ\"ו 2026", "q": "<p><b>א. רגישויות ואלרגיות</b> — ציינו שלושה רכיבי מזון אלרגניים נפוצים ומזונות המכילים אותם.</p><p><b>ב.</b> מהו ההבדל המהותי (מנגנון) בין רגישות ללקטוז לבין אלרגיה לחלבון החלב?</p><p><b>ג.</b> מדוע לרוב, יוגורט נסבל יותר מעיכולית על ידי רגישים ללקטוז מאשר כוס חלב רגיל?</p>", "ans": "<p><b>א.</b> אלרגנים נפוצים: בוטנים, אגוזים (שקדים/מלך), ביצים, חלב פרה, חלבון גלוטן (חיטה), שומשום.</p><p><b>ב. ההבדל:</b> <b>רגישות ללקטוז</b> היא בעיה במערכת העיכול (חוסר באנזים לקטאז המפרק את סוכר החלב), הגורמת לכאבי בטן וגזים. <b>אלרגיה לחלב</b> היא תגובה חריפה של מערכת החיסון כלפי חלבוני החלב (קזאין/מי גבינה), העלולה לסכן חיים (עד שוק אנפילקטי).</p><p><b>ג.</b> ביוגורט, הלקטוז כבר מפורק בחלקו הגדול בתהליך התסיסה על ידי חיידקי המחמצת הלקטית שהוספו לו, ולכן הקיבה מתמודדת איתו בקלות רבה יותר.</p>", "html": true}, {"topics": ["life"], "ty": "open", "y": "תשע\"ח 2018", "q": "<p><b>א. גלוטן</b> — מהו שם המחלה הקשורה לרגישות לחלבון הגלוטן? ציינו שניים מתסמיניה.</p><p><b>ב.</b> ציינו שלושה סוגי קמח שמוגדרים ללא גלוטן ומותר לחולה במחלה זו לצרוך.</p>", "ans": "<p><b>א.</b> המחלה נקראת <b>צליאק (כרסת)</b>. תסמינים נפוצים: שלשול וכאבי בטן, ירידה בלתי מוסברת במשקל, בעיות ספיגה (תת-תזונה), עייפות, ופגיעה בגדילה אצל ילדים.</p><p><b>ב.</b> קמחים מותרים: קמח אורז, קמח תירס, קמח תפוחי אדמה, כוסמת, קינואה.</p>", "html": true}, {"topics": ["life"], "ty": "mc", "y": "תשפ\"ו 2026", "q": "<p>מהו המאפיין ההתנהגותי המרכזי של מחלת האנורקסיה נרבוזה?</p><ul class=\"mc-q-opts\"><li>1. אכילה מופרזת ומיד אחריה הקאות יזומות</li><li>2. בולמוסי אכילה המלווים בשימוש בחומרים משלשלים</li><li>3. אכילה רגילה אך עיסוק אובססיבי בספורט</li><li>4. הימנעות קיצונית מצריכת מזון והרעבה עצמית</li></ul>", "ans": "<p>תשובה נכונה: <b>4. הימנעות קיצונית מצריכת מזון והרעבה עצמית</b></p>", "html": true}, {"topics": ["life"], "ty": "mc", "y": "תשפ\"ו 2026", "q": "<p>מהו אחד הגורמים הטבעיים לבולמוסי רעב (רעב מוגבר) בגיל ההתבגרות, גם ללא קיום הפרעת אכילה?</p><ul class=\"mc-q-opts\"><li>1. שינויים נוירולוגיים במוח בלבד</li><li>2. שינויים הורמונליים הקשורים לתהליך הגדילה</li><li>3. מחסור טבעי בפחמימות בדם בגיל זה</li><li>4. מחסור בויטמינים</li></ul>", "ans": "<p>תשובה נכונה: <b>2. שינויים הורמונליים הקשורים לתהליך הגדילה</b></p>", "html": true}, {"topics": ["life"], "ty": "mc", "y": "תשפ\"א 2021", "q": "<p>איזו ארוחה מבין הבאות מתאימה לתזונה קטוגנית (דיאטה עתירת שומן ודלת פחמימות)?</p><ul class=\"mc-q-opts\"><li>1. סטייק אנטריקוט (שמן) עם שעועית ירוקה</li><li>2. פסטה ברוטב עגבניות עם גבינה</li><li>3. אורז מלא עם ירקות מוקפצים</li><li>4. כריך מלחם לבן עם ריבה</li></ul>", "ans": "<p>תשובה נכונה: <b>1. סטייק אנטריקוט (שמן) עם שעועית ירוקה</b> (עתיר שומן וחלבון, כמעט ללא פחמימות).</p>", "html": true}, {"topics": ["life"], "ty": "mc", "y": "תשפ\"ג 2023", "q": "<p>איזה מזון מומלץ לאישה הרה <b>לא</b> לצרוך?</p><ul class=\"mc-q-opts\"><li>1. תפוח עץ אדום</li><li>2. אורז מבושל</li><li>3. סושי עם דג סלמון נא (טרי)</li><li>4. גזר</li></ul>", "ans": "<p>תשובה נכונה: <b>3. סושי עם דג סלמון נא</b> (בשל סכנת זיהום חיידקי כמו ליסטריה).</p>", "html": true}, {"topics": ["life"], "ty": "mc", "y": "תשפ\"א 2021", "q": "<p>על מה מומלץ להקפיד בתזונת הגיל השלישי (במיוחד כדי לשמור על צפיפות העצם)?</p><ul class=\"mc-q-opts\"><li>1. ויטמין A, ויטמין D וסידן</li><li>2. פחמימות מסוג סוכר פשוט לאנרגיה</li><li>3. צריכה גבוהה של שומן רווי</li><li>4. משקאות עתירי קפאין למניעת עייפות</li></ul>", "ans": "<p>תשובה נכונה: <b>1. ויטמין A, ויטמין D וסידן</b></p>", "html": true}, {"topics": ["life"], "ty": "term", "y": "תשע\"ז 2017", "q": "<p>הסבירו את המונח: <b>צליאק (כרסת)</b></p>", "ans": "<p>מחלה אוטואימונית המאופיינת ברגישות לחלבון ה<b>גלוטן</b> (נמצא בחיטה, שעורה, שיפון ושיבולת שועל). חשיפה לגלוטן גורמת למערכת החיסון של החולה לתקוף את רירית המעי הדק, מה שפוגע בסיסים המעיים ומוביל לתת-ספיגה חמורה של אבות מזון, ויטמינים ומינרלים.</p>", "html": true}];

<div class="sec"><h3>1. איך הגענו עד לכאן? (האבולוציה של המזון)</h3>
<p><b>העבר הרחוק:</b> במשך מיליוני שנים, בני האדם חיו כ"לקטים-ציידים". המזון היה קשה להשגה, והאדם זז הרבה כדי למצוא אותו.</p>
<p><b>שלוש המהפכות:</b> עם השנים קרו שלוש מהפכות ששינו את התזונה שלנו: <b>המהפכה החקלאית</b> (האדם התחיל לגדל צמחים וחיות), <b>המהפכה התעשייתית</b> (הוספת סוכר, מלח ושומן למזון), ו<b>מהפכת המזון המהיר</b> (מזון זול, תעשייתי ומלא ב"קלוריות ריקות").</p>
<p><b>הבעיה היום:</b> הגוף שלנו עדיין "חושב" שחסר מזון ואוגר אנרגיה כשומן, אבל בפועל יש לנו שפע של אוכל ואנחנו זזים פחות. הפער הזה בין הגוף שלנו לסביבה המודרנית הוא הסיבה העיקרית למגפת ההשמנה ולמחלות כרוניות.</p></div>

<div class="sec"><h3>2. תזונה מאוזנת מול לא מאוזנת ⚖️</h3>
<p>כדי לחיות, הגוף שלנו חייב לקבל מים ואת כל אבות המזון: חלבונים, פחמימות, שומנים, ויטמינים, מינרלים (ראשי תיבות: <b>פ"ח שו"ם</b>).</p>
<ul><li><b>תזונה מאוזנת:</b> אכילת כל אבות המזון בכמות הנכונה לגוף.</li>
<li><b>תזונה לא מאוזנת - השמנת יתר:</b> כאשר אוכלים יותר ממה שהגוף צריך. עודף האנרגיה הופך לשומן. ארגון הבריאות העולמי הגדיר את ההשמנה כ"מגפה", והיא מסכנת חיים.</li>
<li><b>תזונה לא מאוזנת - תת-תזונה:</b> מצב שבו חסר לגוף רכיב מזון אחד או יותר (בדרך כלל במדינות עניות, או עקב הפרעות אכילה במדינות עשירות). חוסר זה עלול לפגוע בהתפתחות, להחליש את מערכת החיסון ולגרום למחלות.</li></ul></div>

<div class="sec"><h3>3. הקצובה היומית המומלצת 📋</h3>
<p>טבלאות ממשלתיות שמראות בדיוק כמה רכיבי תזונה (ויטמינים, מינרלים, חלבונים) כל אדם צריך לאכול ביום, בהתאם לגיל ולמין שלו.</p>
<p><b>החיסרון:</b> הטבלאות האלו מסובכות מדי, עמוסות בפרטים, ולכן קשה מאוד לאדם הרגיל להשתמש בהן בחיי היומיום.</p></div>

<div class="sec"><h3>4. פירמידת המזון הישראלית 🔺</h3>
<p>בגלל שהטבלאות היו מסובכות, המציאו את פירמידת המזון. זהו ציור פשוט שמראה לנו מה לאכול וכמה כדי להיות בריאים. <b>הכלל:</b> ככל שעולים בפירמידה, צריך לאכול פחות.</p>
<ul><li><b>בסיס הפירמידה ורקע:</b> הקפדה על שתיית מים מרובה ופעילות גופנית.</li>
<li><b>קומה 2 (פחמימות):</b> דגנים ומוצרי מאפה (עדיף מחיטה מלאה).</li>
<li><b>קומה 3 (ירקות ופירות):</b> מספקים ויטמינים, מינרלים וסיבים. מומלץ לאכול יותר ירקות מפירות.</li>
<li><b>קומה 4 (חלבונים):</b> מוצרי בשר, דגים, חלב, ביצים וקטניות.</li>
<li><b>קומה 5 (שומנים):</b> שמן, טחינה, אבוקדו, אגוזים. לאכול במידה.</li>
<li><b>קומה 6 בראש הפירמידה (ממתקים):</b> חטיפים ושתייה מתוקה. מכילים "קלוריות ריקות" (משמינים בלי שום יתרון בריאותי). לא חובה לאכול מהם כלל ועדיף לצמצם.</li></ul></div>

<div class="sec"><h3>5. תווית מזון – "תעודת הזהות" של המוצר 🏷️</h3>
<p>לפי חוק, כל יצרן מזון חייב לפרסם על האריזה מידע ברור.</p>
<ul><li><b>רשימת רכיבים:</b> הרכיבים רשומים לפי הכמות שלהם – מהרכיב שיש ממנו הכי הרבה במוצר, ועד לרכיב שיש ממנו הכי מעט. כאן נמצא גם את "תוספי המזון" (כמו חומרי טעם וצבעי מאכל שמוספים עם האות E).</li>
<li><b>סימון תזונתי:</b> טבלה שמראה כמה קלוריות, חלבונים, פחמימות, שומנים ונתרן (מלח) יש ב-100 גרם או 100 מ"ל של המוצר.</li></ul>
<div class="tip"><span>על תעלולי שיווק: מותר לכתוב על שמן צמחי "ללא כולסטרול", אבל זה סתם גימיק! כולסטרול נוצר רק בבעלי חיים, ולכן בצמחים אף פעם אין כולסטרול בכל מקרה.</span></div></div>

<div class="sec"><h3>6. חוק סימון מוצרים ("אפשרי בריא") 🔴🟢</h3>
<p>כדי לעזור לנו לבחור נכון בקלות, משרד הבריאות יצר רפורמה.</p>
<ul><li><b>מדבקה אדומה:</b> מזהירה שהמוצר מכיל יותר מדי סוכר, מלח (נתרן) או שומן רווי.</li>
<li><b>מדבקה ירוקה:</b> מסמנת מזון שעומד בדרישות של תזונה בריאה.</li></ul></div>

<div class="sec"><h3>1. ממה מורכב המזון שלנו? (אורגני מול אי-אורגני) 🧱</h3>
<p>כל החומרים בטבע, במזון ובגוף שלנו מתחלקים לשתי קבוצות:</p>
<ul><li><b>חומר אורגני:</b> חומר שמכיל אטומי פחמן ומימן שמחוברים זה לזה. אבות המזון האורגניים הם: פחמימות, חלבונים, שומנים וויטמינים.</li>
<li><b>חומר אי-אורגני:</b> חומר שלא מכיל קשרים של פחמן ומימן. אבות המזון האי-אורגניים הם: מינרלים ומים.</li></ul></div>

<div class="sec"><h3>2. שני סוגים של פירוק מזון ⚙️🧪</h3>
<p>כדי שהמזון ייכנס לתוך הדם והתאים, הוא חייב להתפרק לחתיכות זעירות. הפירוק קורה בשתי דרכים:</p>
<ul><li><b>פירוק מכני (פיזי) 🔨:</b> חיתוך, טחינה ומעיכה של המזון לחתיכות קטנות יותר. זה לא משנה את החומר עצמו, אלא רק מגדיל את "שטח הפנים" שלו כדי שיהיה קל יותר לעכל אותו.</li>
<li><b>פירוק כימי 🧪:</b> פירוק של הקשרים הכימיים בתוך המזון עצמו. הפירוק הזה נעשה בעזרת <span class="term">אנזימים</span> (ה"פועלים" של הגוף שמזרזים תהליכי פירוק).</li></ul></div>

<div class="sec"><h3>3. התחנות של מערכת העיכול 🗺️</h3>
<p>מערכת העיכול היא כמו צינור אחד ארוך שמתחיל בפה ומסתיים בפי הטבעת.</p>
<ul><li><b>👄 פה:</b> התחנה הראשונה. כאן קורה פירוק מכני (לעיסה בעזרת השיניים והלשון) וגם פירוק כימי (הרוק מכיל אנזים בשם <span class="term">עמילאז</span> שמתחיל לפרק את הפחמימות).</li>
<li><b>🛝 ושט:</b> צינור שרירי שרק דוחף את המזון למטה אל הקיבה. לא קורה כאן שום עיכול.</li>
<li><b>🥩 קיבה:</b> איבר דמוי שק עם נוזל חומצי מאוד. כאן קורה פירוק מכני (שרירי הקיבה לָשִים את המזון) וגם פירוק כימי (האנזים <span class="term">פפסין</span> מתחיל לפרק חלבונים). החומצה החזקה גם משמידה חיידקים מזיקים. (שימו לב: פחמימות לא מתעכלות בקיבה!)</li>
<li><b>🍝 מעי דק:</b> צינור ארוך מאוד (6-8 מטרים!). כאן מסתיים הפירוק הכימי של כל אבות המזון. למעי הדק יש המון בליטות קטנות שנקראות <span class="term">סיסים</span> (מוריגים). הסיסים מגדילים מאוד את שטח הפנים, ודרכם המזון המפורק נספג אל תוך זרם הדם.</li>
<li><b>💩 מעי גס:</b> צינור קצר ורחב יותר שמקבל את שאריות המזון שלא נספגו. התפקיד שלו הוא לספוג בחזרה מים ומלחים אל הגוף. במעי הגס חיים חיידקים טובים שמייצרים עבורנו ויטמינים (כמו ויטמין K). מה שנשאר יוצא החוצה כצואה.</li></ul></div>

<div class="sec"><h3>4. העוזרים מבחוץ (בלוטות העיכול) 🩸🍃</h3>
<p>אלו איברים שהמזון לא עובר בתוכם, אבל הם מייצרים מיצים שעוזרים לעיכול במעי הדק:</p>
<ul><li><b>הכבד וכיס המרה:</b> הכבד מייצר את מיץ המרה (שנאגר בכיס המרה). מיץ המרה פועל כמו סבון (דטרגנט / תחליב) - הוא מפרק טיפות שומן גדולות לטיפות מיקרוסקופיות. רק ככה האנזימים יכולים לגשת לשומן ולפרק אותו.</li>
<li><b>הלבלב:</b> בלוטה שמפרישה למעי הדק אנזימים שמפרקים חלבונים, פחמימות ושומנים. בנוסף, הלבלב מייצר הורמונים חשובים כמו אינסולין.</li></ul></div>

<div class="sec"><h3>5. התחנה הסופית - התא 🔬</h3>
<ul><li>התא הוא יחידת המבנה הבסיסית של כל יצור חי.</li>
<li>אחרי שהמזון נספג לדם במעי הדק, הוא מגיע דרך הכבד אל כל תאי הגוף.</li>
<li>בתאים, המזון משמש כחומר בניין לגוף ולצורך תהליך שנקרא "נשימה תאית", שבו התא משתמש בגלוקוז ובחמצן כדי להפיק אנרגיה.</li></ul></div>
