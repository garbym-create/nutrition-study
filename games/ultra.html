<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>משחק · טבעי או אולטרה-מעובד?</title>
<style>
  :root{--green:#1E7A3D;--dk:#10301D;--lime:#8BC34A;--gold:#F0A83A;--ink:#16241C;
    --muted:#5F6F64;--card:#F6F9F4;--greensoft:#E4F1E4;--line:#D8E2D5;--coral:#E85D2F;--coralsoft:#FBE7DF;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(160deg,#0d2a19,#164a2b);
    color:var(--ink);min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;overflow-x:hidden}
  .app{width:100%;max-width:560px}
  .stage{background:#fff;border-radius:22px;padding:20px 18px 22px;box-shadow:0 18px 50px rgba(0,0,0,.32);position:relative;overflow:hidden}
  .top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .bar{flex:1;height:12px;background:var(--greensoft);border-radius:99px;overflow:hidden}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--lime),var(--green));border-radius:99px;transition:width .45s cubic-bezier(.4,1.3,.5,1)}
  .score{font-weight:800;color:var(--green);font-size:14px;white-space:nowrap;background:var(--greensoft);padding:6px 12px;border-radius:99px}
  .score b{color:var(--gold)}
  .kicker{color:var(--gold);font-weight:800;font-size:13px;letter-spacing:.4px;margin-bottom:8px;text-align:center}
  h1{font-size:25px;line-height:1.25;margin-bottom:6px}
  .prod{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:20px 16px;text-align:center;margin-bottom:14px}
  .prod .em{font-size:68px;line-height:1;margin-bottom:2px}
  .prod .nm{font-size:23px;font-weight:800;color:var(--ink)}
  .ask{text-align:center;font-size:14px;font-weight:700;color:var(--muted);margin-bottom:12px}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .ch{border:none;border-radius:16px;padding:18px 10px;font-size:17px;font-weight:800;font-family:inherit;cursor:pointer;transition:transform .12s;color:#fff;line-height:1.25;display:flex;flex-direction:column;align-items:center;gap:6px}
  .ch:active{transform:scale(.97)}
  .ch[disabled]{cursor:default}
  .ch .i{font-size:26px}
  .ch small{font-weight:600;font-size:12px;opacity:.92}
  .c-nat{background:var(--green)}.c-ultra{background:var(--coral)}
  .ch.dim{opacity:.32;filter:grayscale(.4)}
  .ch.right{outline:4px solid #0d3;box-shadow:0 0 0 4px rgba(30,122,61,.25)}
  .ch.wrongpick{outline:4px solid #7a1a12;box-shadow:0 0 0 4px rgba(232,93,47,.25)}
  .fb{margin-top:14px;border-radius:14px;padding:13px 15px;font-size:14.5px;line-height:1.55;display:none;animation:pop .3s}
  .fb.show{display:block}
  .fb.ok{background:#DFF3E2;color:#155e2c;border:1.5px solid #9ed3ac}
  .fb.no{background:var(--coralsoft);color:#9E3417;border:1.5px solid #e9b6a3}
  .fb b{font-weight:800}
  @keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:none;border-radius:16px;padding:15px;font-size:18px;font-weight:800;font-family:inherit;cursor:pointer;transition:transform .12s;background:var(--green);color:#fff;box-shadow:0 8px 20px rgba(30,122,61,.35)}
  .btn:active{transform:scale(.97)}
  .btn.gold{background:var(--gold);color:var(--dk)}
  .next{margin-top:12px;display:none}.next.show{display:block}
  .footer{text-align:center;color:#9DB3A2;font-size:12px;margin-top:14px}
  .hero{text-align:center;padding:6px 4px}
  .hero .emoji{font-size:52px;margin-bottom:8px}
  .sub{color:var(--muted);font-size:15px;line-height:1.5;margin-bottom:14px}
  .legend{display:flex;gap:10px;margin:0 0 18px}
  .lg{flex:1;border-radius:12px;padding:10px;font-size:13px;font-weight:700;color:#fff;text-align:center;line-height:1.3}
  .result{text-align:center;padding:4px}
  .medal{font-size:64px;margin-bottom:6px}
  .scoreline{font-size:19px;font-weight:800;color:var(--green);margin:6px 0}
  .scoreline b{color:var(--gold);font-size:25px}
  .rmsg{color:var(--muted);font-size:16px;line-height:1.5;margin:8px 0 18px}
  .confetti{position:fixed;top:-10px;width:10px;height:14px;z-index:5;border-radius:2px;pointer-events:none}
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage"></div>
  <div class="footer">מדעי התזונה · מזון אולטרה-מעובד · משחק — גרבי מרי</div>
</div>
<script>
const ITEMS=[
 {em:"🍎",nm:"תפוח טרי",t:"nat",why:"פרי טרי מהטבע — מזון לא מעובד."},
 {em:"🥦",nm:"ברוקולי",t:"nat",why:"ירק טרי — מזון מעובד מינימלית."},
 {em:"🥚",nm:"ביצה",t:"nat",why:"מזון גולמי מהחי — לא מעובד."},
 {em:"🫘",nm:"עדשים יבשות",t:"nat",why:"קטניות גולמיות — מזון מעובד מינימלית."},
 {em:"🍚",nm:"אורז מלא",t:"nat",why:"דגן קרוב לטבע — מעובד מינימלית."},
 {em:"🐟",nm:"דג טרי",t:"nat",why:"מזון גולמי מהחי — לא מעובד."},
 {em:"🥛",nm:"יוגורט טבעי",t:"nat",why:"מוצר חלב מותסס — מעובד מינימלית."},
 {em:"🌭",nm:"נקניקייה",t:"ultra",why:"בשר מעובד עם תוספי מזון — אולטרה-מעובד."},
 {em:"🥤",nm:"משקה מוגז ממותק",t:"ultra",why:"נגזרות סוכר, צבעי מאכל וחומרים משמרים — אולטרה-מעובד."},
 {em:"🍟",nm:"חטיף תפוצ׳יפס",t:"ultra",why:"עבר עיבוד תעשייתי עם שמן, מלח ותוספים — אולטרה-מעובד."},
 {em:"🍫",nm:"חטיף שוקולד",t:"ultra",why:"סוכר, שומן ותוספים בעיבוד תעשייתי — אולטרה-מעובד."},
 {em:"🥫",nm:"קטשופ",t:"ultra",why:"עתיר סוכר, נתרן ותוספים — מוצר אולטרה-מעובד."},
 {em:"🥣",nm:"דגני בוקר קנויים",t:"ultra",why:"דגן שעבר עיבוד רב עם סוכר ותוספים — אולטרה-מעובד."},
 {em:"🍞",nm:"לחם אחיד מלא",t:"nat",why:"לחם בסיסי מדגן — מעובד מינימלית (בישול/אפייה)."},
];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
let deck=[],idx=0,score=0,answered=false;const TOTAL=12;
const stage=document.getElementById('stage');
function start(){deck=shuffle([...ITEMS]).slice(0,TOTAL);idx=0;score=0;render();}
function render(){
  answered=false;
  if(idx>=deck.length)return result();
  const it=deck[idx],prog=Math.round(idx/deck.length*100);
  stage.innerHTML=`
   <div class="top"><div class="score">ניקוד <b>${score}</b>/${deck.length}</div><div class="bar"><i style="width:${prog}%"></i></div></div>
   <div class="kicker">טבעי או אולטרה · פריט ${idx+1} מתוך ${deck.length}</div>
   <div class="prod"><div class="em">${it.em}</div><div class="nm">${it.nm}</div></div>
   <div class="ask">איזה סוג מזון זה?</div>
   <div class="choices">
     <button class="ch c-nat" data-t="nat"><span class="i">🍃</span>טבעי / מעובד מינימלית<small>קרוב לטבע</small></button>
     <button class="ch c-ultra" data-t="ultra"><span class="i">⚗️</span>אולטרה-מעובד<small>עיבוד תעשייתי + תוספים</small></button>
   </div>
   <div class="fb" id="fb"></div>
   <div class="next" id="nextwrap"><button class="btn gold" id="nx">${idx===deck.length-1?'לתוצאות ←':'למוצר הבא ←'}</button></div>`;
  stage.querySelectorAll('.ch').forEach(b=>b.onclick=()=>pick(b.dataset.t,it));
  document.getElementById('nx').onclick=()=>{idx++;render();};
}
function pick(t,it){
  if(answered)return;answered=true;
  const ok=(t===it.t);
  stage.querySelectorAll('.ch').forEach(b=>{b.disabled=true;
    if(b.dataset.t===it.t)b.classList.add('right');
    else if(b.dataset.t===t)b.classList.add('wrongpick');
    else b.classList.add('dim');});
  if(ok)score++;
  const fb=document.getElementById('fb');
  fb.className='fb show '+(ok?'ok':'no');
  fb.innerHTML=`<b>${ok?'נכון! ✓':'לא מדויק ✗'}</b> ${it.nm} → <b>${it.t==="nat"?"טבעי / מעובד מינימלית":"אולטרה-מעובד"}</b>.<br>${it.why}`;
  document.getElementById('nextwrap').classList.add('show');
  fb.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function result(){
  const pct=Math.round(score/deck.length*100);
  let medal='🌱',msg='התחלה טובה! זכרו: אולטרה-מעובד = תוספי מזון ועיבוד תעשייתי.';
  if(pct>=100){medal='🏆';msg='מושלם! אתם מזהים מזון אולטרה-מעובד בקלות.';}
  else if(pct>=75){medal='🥇';msg='מצוין! יש לכם עין חדה למזון מעובד.';}
  else if(pct>=50){medal='🥈';msg='יפה! עוד קצת תרגול ותשלטו בזה.';}
  stage.innerHTML=`<div class="result"><div class="medal">${medal}</div>
   <div class="kicker">סיום המשחק</div>
   <div class="scoreline">מיינתם נכון <b>${score}</b> מתוך ${deck.length}</div>
   <div class="bar" style="max-width:220px;margin:14px auto 18px"><i style="width:${pct}%"></i></div>
   <div class="rmsg">${msg}</div>
   <button class="btn" id="again">↺ שחקו שוב</button></div>`;
  document.getElementById('again').onclick=start;
  if(pct>=75)burst();
}
function burst(){const cols=['#1E7A3D','#8BC34A','#F0A83A','#E85D2F'];
  for(let i=0;i<70;i++){const c=document.createElement('div');c.className='confetti';
    c.style.left=Math.random()*100+'vw';c.style.background=cols[i%cols.length];document.body.appendChild(c);
    const dur=2200+Math.random()*1600,dx=(Math.random()-.5)*220;
    c.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${dx}px,102vh) rotate(${720*(Math.random()>.5?1:-1)}deg)`,opacity:.9}],{duration:dur,easing:'cubic-bezier(.3,.6,.5,1)'});
    setTimeout(()=>c.remove(),dur);}}
function welcome(){
  stage.innerHTML=`<div class="hero">
    <div class="emoji">🍃 ⚗️</div>
    <div class="kicker">מדעי התזונה · מזון אולטרה-מעובד</div>
    <h1>טבעי או אולטרה-מעובד?</h1>
    <div class="sub">יופיע מוצר — החליטו אם הוא מזון טבעי/מעובד מינימלית, או מזון אולטרה-מעובד. ${TOTAL} מוצרים, עם הסבר לכל אחד.</div>
    <div class="legend">
      <div class="lg c-nat">🍃 טבעי<br>קרוב לטבע, עיבוד מינימלי</div>
      <div class="lg c-ultra">⚗️ אולטרה<br>עיבוד תעשייתי + תוספים</div>
    </div>
    <button class="btn gold" id="go">▶ בואו נתחיל</button></div>`;
  document.getElementById('go').onclick=start;
}
welcome();
</script>
</body>
</html>
