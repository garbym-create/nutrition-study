<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>משחק · איזה מוצר בריא יותר?</title>
<style>
  :root{--green:#1E7A3D;--dk:#10301D;--lime:#8BC34A;--gold:#F0A83A;--ink:#16241C;
    --muted:#5F6F64;--card:#F6F9F4;--greensoft:#E4F1E4;--line:#D8E2D5;--coral:#E85D2F;--coralsoft:#FBE7DF;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(160deg,#0d2a19,#164a2b);
    color:var(--ink);min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;overflow-x:hidden}
  .app{width:100%;max-width:620px}
  .stage{background:#fff;border-radius:22px;padding:20px 18px 22px;box-shadow:0 18px 50px rgba(0,0,0,.32);position:relative;overflow:hidden}
  .top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .bar{flex:1;height:12px;background:var(--greensoft);border-radius:99px;overflow:hidden}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--lime),var(--green));border-radius:99px;transition:width .45s cubic-bezier(.4,1.3,.5,1)}
  .score{font-weight:800;color:var(--green);font-size:14px;white-space:nowrap;background:var(--greensoft);padding:6px 12px;border-radius:99px}
  .score b{color:var(--gold)}
  .kicker{color:var(--gold);font-weight:800;font-size:13px;letter-spacing:.4px;margin-bottom:4px;text-align:center}
  h1{font-size:24px;line-height:1.25;margin-bottom:6px}
  .ask{text-align:center;font-size:16px;font-weight:800;color:var(--ink);margin-bottom:4px}
  .subask{text-align:center;font-size:13px;color:var(--muted);margin-bottom:14px}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:460px){.cards{grid-template-columns:1fr}}
  .pcard{border:2px solid var(--line);border-radius:16px;padding:14px 12px;cursor:pointer;background:#fff;transition:transform .12s,border-color .15s;text-align:center}
  .pcard:active{transform:scale(.98)}
  .pcard[disabled]{cursor:default}
  .pcard .em{font-size:46px;line-height:1}
  .pcard .nm{font-size:17px;font-weight:800;margin:2px 0 10px;min-height:40px;display:flex;align-items:center;justify-content:center}
  .stat{display:flex;align-items:center;justify-content:space-between;font-size:13px;padding:5px 6px;border-radius:8px;margin-bottom:4px;background:var(--card)}
  .stat b{font-weight:800}
  .stat .lbl{color:var(--muted);font-weight:600}
  .badge{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;margin-bottom:8px}
  .badge.green{background:var(--greensoft);color:var(--green)}
  .badge.claim{background:#FFF4D6;color:#8a6400}
  .pcard.right{border-color:var(--green);background:#EBF7EE}
  .pcard.wrong{border-color:var(--coral);background:var(--coralsoft)}
  .tag{position:absolute;top:8px;font-size:20px;font-weight:900}
  .fb{margin-top:14px;border-radius:14px;padding:13px 15px;font-size:14.5px;line-height:1.55;display:none;animation:pop .3s}
  .fb.show{display:block}
  .fb.ok{background:#DFF3E2;color:#155e2c;border:1.5px solid #9ed3ac}
  .fb.no{background:var(--coralsoft);color:#9E3417;border:1.5px solid #e9b6a3}
  .fb b{font-weight:800}
  @keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:none;border-radius:16px;padding:15px;font-size:18px;font-weight:800;font-family:inherit;cursor:pointer;transition:transform .12s;background:var(--green);color:#fff;box-shadow:0 8px 20px rgba(30,122,61,.35)}
  .btn:active{transform:scale(.97)}
  .btn.gold{background:var(--gold);color:var(--dk)}
  .next{margin-top:12px;display:none}.next.show{display:block}
  .footer{text-align:center;color:#9DB3A2;font-size:12px;margin-top:14px}
  .hero{text-align:center;padding:6px 4px}
  .hero .emoji{font-size:50px;margin-bottom:8px}
  .sub{color:var(--muted);font-size:15px;line-height:1.5;margin-bottom:14px}
  .rule{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--ink);background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px;text-align:right}
  .rule .d{font-size:18px}
  .result{text-align:center;padding:4px}
  .medal{font-size:64px;margin-bottom:6px}
  .scoreline{font-size:19px;font-weight:800;color:var(--green);margin:6px 0}
  .scoreline b{color:var(--gold);font-size:25px}
  .rmsg{color:var(--muted);font-size:16px;line-height:1.5;margin:8px 0 18px}
  .confetti{position:fixed;top:-10px;width:10px;height:14px;z-index:5;border-radius:2px;pointer-events:none}
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage"></div>
  <div class="footer">מדעי התזונה · תווית מזון · משחק — גרבי מרי</div>
</div>
<script>
/* value = per 100g. lower better for satfat/sodium/sugar; higher better for fiber */
const ROUNDS=[
 {a:{em:"🥤",nm:"משקה קל ״דיאט״",claim:"״0 קלוריות״",v:{"שומן רווי":0,"נתרן":25,"סוכר":0,"סיבים":0},note:"ממותק בממתיקים מלאכותיים, אולטרה-מעובד"},
  b:{em:"💧",nm:"מים",v:{"שומן רווי":0,"נתרן":2,"סוכר":0,"סיבים":0}},
  correct:"b",why:"אף שלמשקה הדיאט ״0 קלוריות״, הוא אולטרה-מעובד וממותק בממתיקים מלאכותיים. מים הם תמיד הבחירה הטובה ביותר."},
 {a:{em:"🥣",nm:"דגני בוקר ״עם ויטמינים״",claim:"מסומן כבריא",v:{"שומן רווי":2,"נתרן":320,"סוכר":25,"סיבים":3}},
  b:{em:"🥣",nm:"שיבולת שועל (קוואקר)",v:{"שומן רווי":1.3,"נתרן":5,"סוכר":1,"סיבים":10}},
  correct:"b",why:"למרות ה״ויטמינים״ שעל האריזה — לדגני הבוקר יותר סוכר ונתרן. לשיבולת השועל הרבה יותר סיבים ופחות סוכר."},
 {a:{em:"🍞",nm:"לחם לבן",v:{"שומן רווי":0.6,"נתרן":450,"סוכר":3,"סיבים":2.5}},
  b:{em:"🍞",nm:"לחם מחיטה מלאה",v:{"שומן רווי":0.5,"נתרן":380,"סוכר":2,"סיבים":7}},
  correct:"b",why:"ללחם המלא יותר סיבים תזונתיים ופחות נתרן וסוכר — בחירה בריאה יותר."},
 {a:{em:"🍟",nm:"חטיף תפוצ׳יפס",v:{"שומן רווי":9,"נתרן":540,"סוכר":1,"סיבים":3}},
  b:{em:"🥜",nm:"אגוזים טבעיים",v:{"שומן רווי":5,"נתרן":3,"סוכר":2,"סיבים":7}},
  correct:"b",why:"לאגוזים פחות שומן רווי, הרבה פחות נתרן, ויותר סיבים. השומן שבהם בריא (לא-רווי)."},
 {a:{em:"🥫",nm:"רוטב עגבניות (קטשופ)",v:{"שומן רווי":0.1,"נתרן":900,"סוכר":22,"סיבים":1}},
  b:{em:"🍅",nm:"רוטב עגבניות ביתי",v:{"שומן רווי":0.3,"נתרן":30,"סוכר":5,"סיבים":2}},
  correct:"b",why:"בקטשופ יש המון נתרן וסוכר. ברוטב הביתי הרבה פחות — אף שהשומן הרווי מעט גבוה יותר, ההפרש בנתרן ובסוכר מכריע."},
 {a:{em:"🥛",nm:"יוגורט פירות ממותק",claim:"״עם פרי אמיתי״",v:{"שומן רווי":3,"נתרן":70,"סוכר":15,"סיבים":0}},
  b:{em:"🥛",nm:"יוגורט טבעי",v:{"שומן רווי":2,"נתרן":50,"סוכר":5,"סיבים":0}},
  correct:"b",why:"״עם פרי אמיתי״ לא אומר בריא — ליוגורט הממותק פי 3 סוכר. עדיף יוגורט טבעי, ולהוסיף פרי בעצמכם."},
 {a:{em:"🍫",nm:"חטיף אנרגיה ״בריאותי״",claim:"מסומן כבריא",v:{"שומן רווי":7,"נתרן":110,"סוכר":28,"סיבים":3}},
  b:{em:"🍎",nm:"תפוח",v:{"שומן רווי":0,"נתרן":1,"סוכר":10,"סיבים":2.4}},
  correct:"b",why:"״חטיף בריאות״ יכול להיות עתיר סוכר ושומן רווי. פרי טרי הוא כמעט תמיד הבחירה הבריאה יותר."},
 {a:{em:"🧀",nm:"גבינה צהובה 28%",v:{"שומן רווי":18,"נתרן":650,"סוכר":0,"סיבים":0}},
  b:{em:"🧀",nm:"גבינה לבנה 5%",v:{"שומן רווי":3,"נתרן":300,"סוכר":3,"סיבים":0}},
  correct:"b",why:"לגבינה הצהובה הרבה יותר שומן רווי ונתרן. גבינה דלת-שומן היא בחירה טובה יותר."},
];
let idx=0,score=0,answered=false;const TOTAL=ROUNDS.length;
const stage=document.getElementById('stage');
const LOWER=["שומן רווי","נתרן","סוכר"];
function fmt(k,v){const unit=(k==="נתרן")?" מ״ג":(k==="שומן רווי"||k==="סוכר"||k==="סיבים")?" ג׳":"";return v+unit;}
function statHTML(prod,other){
  return Object.keys(prod.v).map(k=>{
    const mine=prod.v[k],their=other.v[k];let col="var(--ink)";
    if(mine!==their){const better = LOWER.includes(k)? mine<their : mine>their; col=better?"var(--green)":"var(--coral)";}
    return `<div class="stat"><span class="lbl">${k} (ל-100ג׳)</span><b style="color:${col}">${fmt(k,mine)}</b></div>`;
  }).join("");
}
function render(){
  answered=false;
  if(idx>=TOTAL) return result();
  const r=ROUNDS[idx],prog=Math.round(idx/TOTAL*100);
  function card(prod,key,other){
    return `<div class="pcard" data-k="${key}">
      <div class="em">${prod.em}</div>
      <div class="nm">${prod.nm}</div>
      ${prod.claim?`<span class="badge claim">${prod.claim}</span>`:""}
      ${statHTML(prod,other)}
    </div>`;
  }
  stage.innerHTML=`
   <div class="top"><div class="score">ניקוד <b>${score}</b>/${TOTAL}</div><div class="bar"><i style="width:${prog}%"></i></div></div>
   <div class="kicker">תווית מזון · שאלה ${idx+1} מתוך ${TOTAL}</div>
   <div class="ask">איזה מוצר בריא יותר?</div>
   <div class="subask">שוו לפי 100 גרם: פחות שומן רווי · נתרן · סוכר, ויותר סיבים</div>
   <div class="cards">${Math.random()<0.5?card(r.a,"a",r.b)+card(r.b,"b",r.a):card(r.b,"b",r.a)+card(r.a,"a",r.b)}</div>
   <div class="fb" id="fb"></div>
   <div class="next" id="nextwrap"><button class="btn gold" id="nx">${idx===TOTAL-1?'לתוצאות ←':'לשאלה הבאה ←'}</button></div>`;
  stage.querySelectorAll('.pcard').forEach(c=>c.onclick=()=>pick(c.dataset.k,r));
  document.getElementById('nx').onclick=()=>{idx++;render();};
}
function pick(k,r){
  if(answered)return;answered=true;
  const ok=(k===r.correct);
  stage.querySelectorAll('.pcard').forEach(c=>{c.setAttribute('disabled','');
    if(c.dataset.k===r.correct)c.classList.add('right');
    else if(c.dataset.k===k)c.classList.add('wrong');});
  if(ok)score++;
  const fb=document.getElementById('fb');
  fb.className='fb show '+(ok?'ok':'no');
  fb.innerHTML=`<b>${ok?'נכון! ✓':'לא מדויק ✗'}</b> ${r.why}`;
  document.getElementById('nextwrap').classList.add('show');
  fb.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function result(){
  const pct=Math.round(score/TOTAL*100);
  let medal='🌱',msg='התחלה טובה! זכרו: משווים לפי 100 גרם, לא לפי מנת הגשה.';
  if(pct>=100){medal='🏆';msg='מושלם! אתם קוראים תוויות כמו מומחים.';}
  else if(pct>=75){medal='🥇';msg='מצוין! לא נופלים בקלות למלכודות שיווק.';}
  else if(pct>=50){medal='🥈';msg='יפה! עוד קצת תרגול ותזהו כל הטעיה.';}
  stage.innerHTML=`<div class="result"><div class="medal">${medal}</div>
   <div class="kicker">סיום המשחק</div>
   <div class="scoreline">ענית נכון על <b>${score}</b> מתוך ${TOTAL}</div>
   <div class="bar" style="max-width:220px;margin:14px auto 18px"><i style="width:${pct}%"></i></div>
   <div class="rmsg">${msg}</div>
   <button class="btn" id="again">↺ שחקו שוב</button></div>`;
  document.getElementById('again').onclick=()=>{idx=0;score=0;render();};
  if(pct>=75)burst();
}
function burst(){const cols=['#1E7A3D','#8BC34A','#F0A83A','#E85D2F'];
  for(let i=0;i<70;i++){const c=document.createElement('div');c.className='confetti';
    c.style.left=Math.random()*100+'vw';c.style.background=cols[i%cols.length];document.body.appendChild(c);
    const dur=2200+Math.random()*1600,dx=(Math.random()-.5)*220;
    c.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${dx}px,102vh) rotate(${720*(Math.random()>.5?1:-1)}deg)`,opacity:.9}],{duration:dur,easing:'cubic-bezier(.3,.6,.5,1)'});
    setTimeout(()=>c.remove(),dur);}}
function welcome(){
  stage.innerHTML=`<div class="hero">
    <div class="emoji">🏷️🔍</div>
    <div class="kicker">מדעי התזונה · תווית מזון</div>
    <h1>איזה מוצר בריא יותר?</h1>
    <div class="sub">מוצגים שני מוצרים עם הטבלה התזונתית שלהם. בחרו את הבריא יותר — ושימו לב להטעיות שיווקיות (״דיאט״, ״עם ויטמינים״...).</div>
    <div class="rule"><span class="d">📉</span> פחות: שומן רווי · נתרן · סוכר</div>
    <div class="rule"><span class="d">📈</span> יותר: סיבים תזונתיים</div>
    <div class="rule"><span class="d">⚖️</span> משווים תמיד לפי 100 גרם</div>
    <button class="btn gold" id="go" style="margin-top:14px">▶ בואו נתחיל</button></div>`;
  document.getElementById('go').onclick=()=>{idx=0;score=0;render();};
}
welcome();
</script>
</body>
</html>
