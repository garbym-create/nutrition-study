<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>משחק · מיון לקשת המזון החדשה</title>
<style>
  :root{
    --green:#1E7A3D;--dk:#10301D;--lime:#8BC34A;--gold:#F0A83A;--ink:#16241C;
    --muted:#5F6F64;--card:#F6F9F4;--greensoft:#E4F1E4;--line:#D8E2D5;
    --a-green:#4FA23F;--a-yellow:#E4B53C;--a-orange:#E8862B;--a-pink:#E89AAE;--a-red:#D33B2E;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(160deg,#0d2a19,#164a2b);
    color:var(--ink);min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;overflow-x:hidden}
  .app{width:100%;max-width:600px}
  .stage{background:#fff;border-radius:22px;padding:20px 18px 22px;box-shadow:0 18px 50px rgba(0,0,0,.32);position:relative;overflow:hidden}
  .top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .bar{flex:1;height:12px;background:var(--greensoft);border-radius:99px;overflow:hidden}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--lime),var(--green));border-radius:99px;transition:width .45s cubic-bezier(.4,1.3,.5,1)}
  .score{font-weight:800;color:var(--green);font-size:14px;white-space:nowrap;background:var(--greensoft);padding:6px 12px;border-radius:99px}
  .score b{color:var(--gold)}
  .kicker{color:var(--gold);font-weight:800;font-size:13px;letter-spacing:.4px;margin-bottom:8px;text-align:center}
  h1{font-size:25px;line-height:1.25;margin-bottom:6px}
  .prod{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;text-align:center;margin-bottom:12px}
  .prod .em{font-size:60px;line-height:1;margin-bottom:2px}
  .prod .nm{font-size:22px;font-weight:800;color:var(--ink)}
  .ask{text-align:center;font-size:14px;font-weight:700;color:var(--muted);margin-bottom:10px}
  .arches{display:flex;flex-direction:column;gap:8px}
  .arch{display:flex;align-items:center;gap:12px;border:none;border-radius:14px;padding:12px 14px;font-family:inherit;cursor:pointer;transition:transform .12s;color:#fff;text-align:right;width:100%}
  .arch:active{transform:scale(.98)}
  .arch[disabled]{cursor:default}
  .arch .dot{width:26px;height:26px;border-radius:50%;flex-shrink:0;border:2px solid rgba(255,255,255,.6)}
  .arch .nm{font-size:17px;font-weight:800}
  .arch .fr{font-size:12.5px;opacity:.92;margin-inline-start:auto;font-weight:600}
  .a-green{background:var(--a-green)}.a-yellow{background:var(--a-yellow);color:#5b4410}
  .a-orange{background:var(--a-orange)}.a-pink{background:var(--a-pink);color:#7d2c42}.a-red{background:var(--a-red)}
  .arch.dim{opacity:.3;filter:grayscale(.4)}
  .arch.right{outline:4px solid #163;box-shadow:0 0 0 4px rgba(30,122,61,.25)}
  .arch.wrongpick{outline:4px solid #7a1a12;box-shadow:0 0 0 4px rgba(211,59,46,.25)}
  .fb{margin-top:13px;border-radius:14px;padding:13px 15px;font-size:14.5px;line-height:1.55;display:none;animation:pop .3s}
  .fb.show{display:block}
  .fb.ok{background:#DFF3E2;color:#155e2c;border:1.5px solid #9ed3ac}
  .fb.no{background:#fbe7df;color:#9E3417;border:1.5px solid #e9b6a3}
  .fb b{font-weight:800}
  @keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:none;border-radius:16px;padding:15px;font-size:18px;font-weight:800;font-family:inherit;cursor:pointer;transition:transform .12s;background:var(--green);color:#fff;box-shadow:0 8px 20px rgba(30,122,61,.35)}
  .btn:active{transform:scale(.97)}
  .btn.gold{background:var(--gold);color:var(--dk)}
  .next{margin-top:12px;display:none}.next.show{display:block}
  .footer{text-align:center;color:#9DB3A2;font-size:12px;margin-top:14px}
  .hero{text-align:center;padding:6px 4px}
  .hero .emoji{font-size:52px;margin-bottom:8px}
  .sub{color:var(--muted);font-size:15px;line-height:1.5;margin-bottom:14px}
  .legend{display:flex;flex-direction:column;gap:6px;margin:0 0 18px;text-align:right}
  .lg{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:700;color:var(--ink)}
  .lg .d{width:18px;height:18px;border-radius:50%;flex-shrink:0}
  .lg span{color:var(--muted);font-weight:600;margin-inline-start:auto}
  .result{text-align:center;padding:4px}
  .medal{font-size:64px;margin-bottom:6px}
  .scoreline{font-size:19px;font-weight:800;color:var(--green);margin:6px 0}
  .scoreline b{color:var(--gold);font-size:25px}
  .rmsg{color:var(--muted);font-size:16px;line-height:1.5;margin:8px 0 18px}
  .confetti{position:fixed;top:-10px;width:10px;height:14px;z-index:5;border-radius:2px;pointer-events:none}
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage"></div>
  <div class="footer">מדעי התזונה · קשת המזון החדשה · משחק — גרבי מרי</div>
</div>
<script>
const ARCHES={
  green:{name:"הירוקה",cls:"a-green",col:"#4FA23F",fr:"לאורך היום"},
  yellow:{name:"הצהובה",cls:"a-yellow",col:"#E4B53C",fr:"פעם ביום"},
  orange:{name:"הכתומה",cls:"a-orange",col:"#E8862B",fr:"פעמים בשבוע"},
  pink:{name:"הוורודה",cls:"a-pink",col:"#E89AAE",fr:"לעיתים רחוקות"},
  red:{name:"האדומה",cls:"a-red",col:"#D33B2E",fr:"להימנע"},
};
const ORDER=["green","yellow","orange","pink","red"];
const ITEMS=[
  {em:"🍅",nm:"עגבנייה",a:"green",why:"ירק — הקשת הירוקה, בסיס לכל ארוחה, מדי יום."},
  {em:"🍞",nm:"לחם מלא",a:"green",why:"דגן מלא — הקשת הירוקה, לצרוך לאורך היום."},
  {em:"💧",nm:"מים",a:"green",why:"המים בקשת הירוקה — השתייה המומלצת, לאורך היום."},
  {em:"🍎",nm:"תפוח",a:"green",why:"פרי — הקשת הירוקה. לפחות 5 מנות ירק ופרי ביום."},
  {em:"🫘",nm:"עדשים",a:"yellow",why:"קטניות — הקשת הצהובה, מדי יום. חלבון מהצומח."},
  {em:"🫗",nm:"שמן זית",a:"yellow",why:"הקשת הצהובה — שמן באיכות תזונתית גבוהה."},
  {em:"🥜",nm:"אגוזים",a:"yellow",why:"הקשת הצהובה — שמנים בריאים, חלבון וסיבים."},
  {em:"🥛",nm:"חלב",a:"yellow",why:"חלב ומוצריו — הקשת הצהובה, מקור לחלבון וסידן."},
  {em:"🥑",nm:"אבוקדו",a:"yellow",why:"הקשת הצהובה — שומן בריא, מדי יום במידה."},
  {em:"🥚",nm:"ביצה",a:"orange",why:"הקשת הכתומה — חלבון וברזל, כמה פעמים בשבוע."},
  {em:"🐟",nm:"דג",a:"orange",why:"הקשת הכתומה — חלבון מהחי, כמה פעמים בשבוע."},
  {em:"🍗",nm:"עוף",a:"orange",why:"הקשת הכתומה. קבעו יום בשבוע ללא עוף/בשר."},
  {em:"🥩",nm:"בשר אדום",a:"pink",why:"הקשת הוורודה — לעיתים רחוקות, עד 300 גרם בשבוע."},
  {em:"🥤",nm:"שתייה ממותקת",a:"red",why:"הקשת האדומה — סוכר גבוה, להימנע."},
  {em:"🍬",nm:"ממתקים",a:"red",why:"הקשת האדומה — מזון מעובד ומתוק, מינימום."},
  {em:"🌭",nm:"בשר מעובד",a:"red",why:"הקשת האדומה — מעובד, נתרן ושומן רווי גבוהים."},
  {em:"🥫",nm:"קטשופ",a:"red",why:"הקשת האדומה — מוצר מעובד. עדיף רוטב עגבניות ביתי."},
];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
let deck=[],idx=0,score=0,answered=false;const TOTAL=12;
const stage=document.getElementById('stage');
function start(){deck=shuffle([...ITEMS]).slice(0,TOTAL);idx=0;score=0;render();}
function render(){
  answered=false;
  if(idx>=deck.length) return result();
  const it=deck[idx],prog=Math.round(idx/deck.length*100);
  let a=`<div class="arches">`;
  ORDER.forEach(k=>{a+=`<button class="arch ${ARCHES[k].cls}" data-a="${k}"><span class="dot" style="background:${ARCHES[k].col}"></span><span class="nm">הקשת ${ARCHES[k].name}</span><span class="fr">${ARCHES[k].fr}</span></button>`;});
  a+=`</div>`;
  stage.innerHTML=`
    <div class="top"><div class="score">ניקוד <b>${score}</b>/${deck.length}</div><div class="bar"><i style="width:${prog}%"></i></div></div>
    <div class="kicker">מיון לקשת · פריט ${idx+1} מתוך ${deck.length}</div>
    <div class="prod"><div class="em">${it.em}</div><div class="nm">${it.nm}</div></div>
    <div class="ask">לאיזו קשת שייך המוצר?</div>
    ${a}
    <div class="fb" id="fb"></div>
    <div class="next" id="nextwrap"><button class="btn gold" id="nx">${idx===deck.length-1?'לתוצאות ←':'למוצר הבא ←'}</button></div>`;
  stage.querySelectorAll('.arch').forEach(b=>b.onclick=()=>pick(b,it));
  document.getElementById('nx').onclick=()=>{idx++;render();};
}
function pick(btn,it){
  if(answered) return;answered=true;
  const chosen=btn.dataset.a,ok=(chosen===it.a);
  stage.querySelectorAll('.arch').forEach(b=>{b.disabled=true;
    if(b.dataset.a===it.a)b.classList.add('right');
    else if(b.dataset.a===chosen)b.classList.add('wrongpick');
    else b.classList.add('dim');});
  if(ok)score++;
  const fb=document.getElementById('fb');
  fb.className='fb show '+(ok?'ok':'no');
  fb.innerHTML=`<b>${ok?'נכון! ✓':'לא מדויק ✗'}</b> ${it.nm} → <b>הקשת ${ARCHES[it.a].name}</b>.<br>${it.why}`;
  document.getElementById('nextwrap').classList.add('show');
  fb.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function result(){
  const pct=Math.round(score/deck.length*100);
  let medal='🌱',msg='התחלה טובה! חזרו על הקשתות ונסו שוב.';
  if(pct>=100){medal='🏆';msg='מושלם! שולטים בקשת המזון החדשה!';}
  else if(pct>=75){medal='🥇';msg='מצוין! אתם מכירים היטב את הקשתות והתדירויות.';}
  else if(pct>=50){medal='🥈';msg='יפה! עוד קצת תרגול ותשלטו בזה לגמרי.';}
  stage.innerHTML=`<div class="result"><div class="medal">${medal}</div>
    <div class="kicker">סיום המשחק</div>
    <div class="scoreline">מיינתם נכון <b>${score}</b> מתוך ${deck.length}</div>
    <div class="bar" style="max-width:220px;margin:14px auto 18px"><i style="width:${pct}%"></i></div>
    <div class="rmsg">${msg}</div>
    <button class="btn" id="again">↺ שחקו שוב</button></div>`;
  document.getElementById('again').onclick=start;
  if(pct>=75)burst();
}
function burst(){const cols=['#4FA23F','#E4B53C','#E8862B','#E89AAE','#D33B2E'];
  for(let i=0;i<70;i++){const c=document.createElement('div');c.className='confetti';
    c.style.left=Math.random()*100+'vw';c.style.background=cols[i%cols.length];
    document.body.appendChild(c);const dur=2200+Math.random()*1600,dx=(Math.random()-.5)*220;
    c.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${dx}px,102vh) rotate(${720*(Math.random()>.5?1:-1)}deg)`,opacity:.9}],{duration:dur,easing:'cubic-bezier(.3,.6,.5,1)'});
    setTimeout(()=>c.remove(),dur);}}
function welcome(){
  let lg='';ORDER.forEach(k=>{lg+=`<div class="lg"><span class="d" style="background:${ARCHES[k].col}"></span>הקשת ${ARCHES[k].name}<span>${ARCHES[k].fr}</span></div>`;});
  stage.innerHTML=`<div class="hero">
    <div class="emoji">🌈</div>
    <div class="kicker">מדעי התזונה · קשת המזון החדשה</div>
    <h1>מיון לקשת המזון</h1>
    <div class="sub">יופיע מוצר — בחרו לאיזו קשת (צבע ותדירות) הוא שייך. ${TOTAL} מוצרים, עם משוב והסבר.</div>
    <div class="legend">${lg}</div>
    <button class="btn gold" id="go">▶ בואו נתחיל</button></div>`;
  document.getElementById('go').onclick=start;
}
welcome();
</script>
</body>
</html>
